<style>
  :root {
    /* Light Mode — Warm Archival Paper & Editorial Ink */
    --paper: #fdfcfa;
    --bg: #f6f4ef;
    --sidebar-bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #efece4;
    --surface-hover: #e7e2d7;
    --topbar-bg: rgba(253, 252, 250, 0.92);

    --border: #e5e0d5;
    --border-subtle: #eeeae1;
    --border-strong: #cfc8b8;

    --text: #161513;
    --text-secondary: #3c3a35;
    --text-muted: #6c675d;
    --text-faint: #989286;

    /* Disciplined Editorial Accents */
    --ink-btn: #18181b;
    --ink-btn-hover: #2c2c31;
    --ink-btn-text: #faf9f6;

    --primary: #1f4168;
    --primary-hover: #16304d;
    --primary-soft: rgba(31, 65, 104, 0.075);
    --primary-border: rgba(31, 65, 104, 0.22);

    --accent: #b83227;
    --accent-hover: #96261d;
    --accent-soft: rgba(184, 50, 39, 0.08);
    --accent-border: rgba(184, 50, 39, 0.24);

    --gold: #b88214;
    --gold-soft: rgba(184, 130, 20, 0.11);
    --gold-border: rgba(184, 130, 20, 0.3);

    --ok: #1b6d4c;
    --ok-soft: rgba(27, 109, 76, 0.09);
    --ok-border: rgba(27, 109, 76, 0.26);

    /* Dual-Coding Case Colors */
    --case-nom: #2355a4;
    --case-akk: #c05618;
    --case-dat: #1b6f4e;
    --case-gen: #6a3d9a;

    /* Contrast Box Accents */
    --c-pt-border: #257a5d; --c-pt-bg: rgba(37, 122, 93, 0.05);
    --c-es-border: #bf5226; --c-es-bg: rgba(191, 82, 38, 0.05);
    --c-fr-border: #2f5999; --c-fr-bg: rgba(47, 89, 153, 0.05);
    --c-en-border: #694998; --c-en-bg: rgba(105, 73, 152, 0.05);

    /* Code & Grammar Diagrams */
    --code-bg: #f0ede5;
    --code-text: #1c324d;
    --diagram-bg: #f5f2ea;
    --diagram-border: #e2dcd0;
    --diagram-text: #1b1a17;

    /* German Flag Editorial Band */
    --de-black: #18181b;
    --de-red: #c92a2a;
    --de-gold: #e6b322;

    /* Typography */
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* Elevation & Layout */
    --shadow-xs: 0 1px 2px rgba(22, 21, 19, 0.04);
    --shadow-sm: 0 2px 10px rgba(22, 21, 19, 0.045), 0 1px 2px rgba(22, 21, 19, 0.03);
    --shadow-md: 0 10px 30px rgba(22, 21, 19, 0.08), 0 2px 6px rgba(22, 21, 19, 0.04);
    --shadow-lg: 0 20px 50px rgba(22, 21, 19, 0.16);
    --sidebar-w: 292px;
    --header-h: 58px;
    --radius: 10px;
  }

  [data-theme="dark"] {
    /* Dark Mode — Warm Charcoal Graphite & Parchment Ink */
    --paper: #121316;
    --bg: #0e0f12;
    --sidebar-bg: #0f1013;
    --surface: #181a1f;
    --surface-2: #20232a;
    --surface-hover: #282c35;
    --topbar-bg: rgba(18, 19, 22, 0.92);

    --border: #24272f;
    --border-subtle: #1d2027;
    --border-strong: #353944;

    --text: #f0ede6;
    --text-secondary: #cbc6bc;
    --text-muted: #908c84;
    --text-faint: #64615b;

    --ink-btn: #f0ede6;
    --ink-btn-hover: #ffffff;
    --ink-btn-text: #121316;

    --primary: #89b2df;
    --primary-hover: #a7c8eb;
    --primary-soft: rgba(137, 178, 223, 0.11);
    --primary-border: rgba(137, 178, 223, 0.28);

    --accent: #e05e52;
    --accent-hover: #ec786d;
    --accent-soft: rgba(224, 94, 82, 0.12);
    --accent-border: rgba(224, 94, 82, 0.3);

    --gold: #e4b53e;
    --gold-soft: rgba(228, 181, 62, 0.12);
    --gold-border: rgba(228, 181, 62, 0.32);

    --ok: #55c493;
    --ok-soft: rgba(85, 196, 147, 0.12);
    --ok-border: rgba(85, 196, 147, 0.3);

    --case-nom: #7aaaf5;
    --case-akk: #f0a05c;
    --case-dat: #56c795;
    --case-gen: #be94f2;

    --c-pt-border: #4ab38c; --c-pt-bg: rgba(74, 179, 140, 0.075);
    --c-es-border: #e28252; --c-es-bg: rgba(226, 130, 82, 0.075);
    --c-fr-border: #6f9be0; --c-fr-bg: rgba(111, 155, 224, 0.075);
    --c-en-border: #a784db; --c-en-bg: rgba(167, 132, 219, 0.075);

    --code-bg: #20232b;
    --code-text: #d0e1f7;
    --diagram-bg: #17191e;
    --diagram-border: #262932;
    --diagram-text: #ebe7de;

    --de-black: #2b2e36;
    --de-red: #cf3535;
    --de-gold: #e6b322;

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.42);
    --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.65);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--paper); color: var(--text);
    font-family: var(--font-sans);
    font-size: 15.5px;
    line-height: 1.72;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); border: 2px solid transparent; background-clip: content-box; }

  .svg-icon {
    width: 16px; height: 16px; flex-shrink: 0;
    stroke: currentColor; fill: none; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round;
    display: inline-block; vertical-align: middle;
  }
  .flag-svg {
    width: 16px; height: 12px; border-radius: 2px; flex-shrink: 0;
    display: inline-block; vertical-align: middle;
    box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.26);
  }
  .flag-svg.flag-lg { width: 20px; height: 14px; border-radius: 2.5px; }

  /* ==================== HEADER ==================== */
  header.topbar {
    position: fixed; top: 0; left: 0; right: 0;
    background: var(--topbar-bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    z-index: 40;
  }
  /* Subtle German tricolor hairline at top edge */
  .topbar-tricolor {
    height: 2px; width: 100%;
    background: linear-gradient(90deg, var(--de-black) 0 33.33%, var(--de-red) 33.33% 66.66%, var(--de-gold) 66.66% 100%);
    opacity: 0.92;
  }
  .topbar-main {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; gap: 12px;
  }
  .read-progress {
    position: absolute; bottom: -1px; left: 0; height: 2px; width: 0%;
    background: var(--accent);
    transition: width .08s linear; pointer-events: none;
  }

  .brand-group {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .sidebar-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0;
    background: transparent; border: 1px solid transparent;
    color: var(--text-muted); border-radius: 8px; cursor: pointer;
    transition: background .14s, color .14s, border-color .14s;
  }
  .sidebar-toggle:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

  .brand {
    display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
    text-decoration: none; color: var(--text); white-space: nowrap;
  }
  .brand-word {
    font-family: var(--font-serif); font-size: 23px; font-weight: 600;
    letter-spacing: -0.025em; line-height: 1;
    display: inline-flex; align-items: baseline;
  }
  .brand-sub {
    font-size: 12px; color: var(--text-muted); font-weight: 500;
    letter-spacing: 0.01em; padding-left: 10px; margin-left: 2px;
    border-left: 1px solid var(--border);
  }

  .top-controls {
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .lang-bar {
    display: flex; align-items: center; gap: 7px;
  }
  .lang-bar-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-faint); white-space: nowrap;
  }
  .lang-pills {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--surface-2); padding: 3px; border-radius: 9px; border: 1px solid var(--border);
  }
  .lang-pill {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    font-family: var(--font-sans); font-size: 12px; font-weight: 600;
    padding: 4px 8px; border-radius: 6px; cursor: pointer;
    transition: all .14s ease; white-space: nowrap; opacity: 0.58;
  }
  .lang-pill:hover { color: var(--text); opacity: 0.9; }
  .lang-pill.active {
    background: var(--surface); color: var(--text);
    border-color: var(--border); box-shadow: var(--shadow-xs); opacity: 1;
  }

  .top-actions {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }

  /* Buttons */
  .top-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    font-family: var(--font-sans); font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .14s ease; white-space: nowrap; text-decoration: none;
    line-height: 1.25;
  }
  .top-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
  .top-btn.primary {
    background: var(--ink-btn); color: var(--ink-btn-text); border-color: var(--ink-btn);
  }
  .top-btn.primary:hover { background: var(--ink-btn-hover); border-color: var(--ink-btn-hover); color: var(--ink-btn-text); }
  .top-btn.ghost {
    background: transparent; border-color: transparent; color: var(--text-muted);
  }
  .top-btn.ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

  .badge {
    background: var(--accent); color: #fff;
    font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px;
    border-radius: 999px; font-weight: 600; line-height: 1.45;
  }
  .top-btn.primary .badge {
    background: rgba(255, 255, 255, 0.2); color: var(--ink-btn-text);
  }
  [data-theme="dark"] .top-btn.primary .badge {
    background: rgba(18, 19, 22, 0.16); color: var(--ink-btn-text);
  }
  .badge.has-due,
  .top-btn.primary .badge.has-due,
  [data-theme="dark"] .top-btn.primary .badge.has-due {
    background: var(--accent); color: #fff;
  }
  .icon-btn {
    width: 34px; height: 34px; padding: 0; justify-content: center;
  }

  /* ==================== LAYOUT & SIDEBAR ==================== */
  .layout { display: flex; padding-top: var(--header-h); min-height: 100vh; }

  aside.sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0; width: var(--sidebar-w);
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 30;
    transition: transform .24s cubic-bezier(.22, 1, .36, 1);
  }
  body.sidebar-collapsed aside.sidebar {
    transform: translateX(-100%);
  }

  .sidebar-primary {
    padding: 12px 10px 8px;
    display: flex; flex-direction: column; gap: 2px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .primary-nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 9px;
    padding: 7.5px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    color: var(--text-secondary); text-decoration: none; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .primary-nav-item:hover { background: var(--surface-2); color: var(--text); }
  .primary-nav-item.active, .primary-nav-item[aria-current="page"] {
    background: var(--surface); color: var(--text);
    box-shadow: var(--shadow-xs); border: 1px solid var(--border);
    padding: 6.5px 9px;
  }
  .primary-nav-left { display: inline-flex; align-items: center; gap: 9px; }
  .link-btn .svg-icon { width: 13px; height: 13px; }
  .primary-nav-item .svg-icon { color: var(--text-muted); width: 15px; height: 15px; }
  .primary-nav-item.active .svg-icon, .primary-nav-item[aria-current="page"] .svg-icon { color: var(--accent); }
  .nav-pill-count {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
    padding: 1px 6px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted);
  }
  .nav-pill-count.due { background: var(--accent-soft); color: var(--accent); }

  .sidebar-top { padding: 11px 12px 12px; border-bottom: 1px solid var(--border-subtle); }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-icon {
    position: absolute; left: 10px; color: var(--text-faint); pointer-events: none;
    width: 14px; height: 14px;
  }
  .search-input {
    width: 100%; padding: 7.5px 10px 7.5px 30px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-family: var(--font-sans); font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus { border-color: var(--text-muted); box-shadow: 0 0 0 3px var(--primary-soft); }

  .progress-mini { margin-top: 11px; font-size: 12px; color: var(--text-muted); }
  .progress-mini-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .progress-mini-row strong { font-family: var(--font-mono); font-size: 11px; color: var(--text); font-weight: 600; }
  .bar-track { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--ok), #38a577);
    border-radius: 99px; transition: width .35s ease;
  }

  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
  .nav-group { margin-bottom: 10px; }
  .nav-group-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); cursor: pointer; user-select: none;
    border-radius: 6px; transition: background .12s, color .12s;
  }
  .nav-group-hdr:hover { background: var(--surface-2); color: var(--text); }
  .nav-group-left { display: inline-flex; align-items: center; gap: 6px; }
  .nav-group-chev {
    width: 12px; height: 12px; color: var(--text-faint); transition: transform .15s ease;
  }
  .nav-group.collapsed .nav-group-chev { transform: rotate(-90deg); }
  .nav-group-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); font-weight: 500; }
  .nav-list { list-style: none; margin: 2px 0 0; padding: 0; }
  .nav-group.collapsed .nav-list { display: none; }

  .nav-item {
    position: relative; display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 9px; border-radius: 7px; font-size: 13px; line-height: 1.38;
    color: var(--text-secondary); cursor: pointer; text-decoration: none;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active {
    background: var(--surface); color: var(--text); font-weight: 600;
    box-shadow: var(--shadow-xs);
  }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2.5px;
    border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .nav-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5.5px;
    border: 1.5px solid var(--border-strong); background: transparent;
  }
  .nav-dot[data-st="●"], .nav-dot[data-st="✔"] {
    background: var(--ok); border-color: var(--ok);
  }
  .nav-dot[data-st="◐"] {
    background: var(--gold); border-color: var(--gold);
  }
  .nav-id {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    color: var(--text-faint); flex-shrink: 0; margin-top: 2px;
  }
  .nav-item.active .nav-id { color: var(--accent); font-weight: 600; }
  .nav-title {
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  .case-legend {
    padding: 7px 14px; border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);
    background: var(--surface-2);
  }
  .case-legend span { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; }

  .sidebar-footer {
    padding: 7px 10px; border-top: 1px solid var(--border);
    display: flex; gap: 4px; justify-content: space-between;
    background: var(--sidebar-bg);
  }
  .link-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-family: var(--font-sans); font-weight: 500;
    padding: 5px 8px; border-radius: 6px; font-size: 12px;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .12s, color .12s;
  }
  .link-btn:hover { background: var(--surface-2); color: var(--text); }

  .backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(12, 13, 16, 0.48);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: 25;
  }

  /* ==================== MAIN CONTENT ==================== */
  main.content {
    margin-left: var(--sidebar-w); flex: 1;
    padding: 36px 40px 104px;
    min-width: 0;
    transition: margin-left .24s cubic-bezier(.22, 1, .36, 1);
  }
  body.sidebar-collapsed main.content { margin-left: 0; }
  .container { max-width: 810px; margin: 0 auto; }

  /* ==================== WEB HOME VIEW ==================== */
  .home-hero {
    padding: 8px 0 30px;
    border-bottom: 1px solid var(--border);
  }
  .home-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 16px;
  }
  .home-title {
    font-family: var(--font-serif); font-size: clamp(32px, 5vw, 44px);
    font-weight: 500; line-height: 1.12; letter-spacing: -0.028em;
    color: var(--text); margin: 0 0 16px;
  }
  .home-title em {
    font-style: italic; font-weight: 400; color: var(--text-secondary);
  }
  .home-lead {
    font-size: 16.5px; line-height: 1.68; color: var(--text-secondary);
    max-width: 64ch; margin: 0 0 24px;
  }
  .home-lead strong { color: var(--text); font-weight: 600; }
  .home-cta-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  }
  .home-cta-row .top-btn { padding: 9px 16px; font-size: 13.5px; }

  /* Editorial Specs Strip */
  .home-metrics {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; padding: 22px 0;
    border-bottom: 1px solid var(--border);
  }
  .metric-item { display: flex; flex-direction: column; gap: 2px; }
  .metric-val {
    font-family: var(--font-serif); font-size: 26px; font-weight: 600;
    line-height: 1.15; letter-spacing: -0.02em; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .metric-lbl { font-size: 12.5px; color: var(--text-muted); line-height: 1.35; }

  .home-section {
    padding: 32px 0;
    border-bottom: 1px solid var(--border);
  }
  .home-section:last-child { border-bottom: none; padding-bottom: 8px; }
  .home-sec-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .home-sec-title {
    font-family: var(--font-serif); font-size: 23px; font-weight: 600;
    letter-spacing: -0.018em; margin: 0; color: var(--text);
  }
  .home-sec-link {
    font-size: 13px; font-weight: 600; color: var(--primary);
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .home-sec-link:hover { color: var(--accent); }

  /* Level Cards */
  .level-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  }
  .level-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 18px 16px; display: flex; flex-direction: column; justify-content: space-between;
    text-decoration: none; color: inherit;
    transition: border-color .16s, transform .16s, box-shadow .16s;
  }
  .level-card:hover {
    border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-sm);
  }
  .level-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .level-code {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
    padding: 2px 7px; border-radius: 5px; letter-spacing: 0.04em;
  }
  .level-code.a1 { background: var(--ok-soft); color: var(--ok); }
  .level-code.a2 { background: var(--primary-soft); color: var(--primary); }
  .level-code.b1 { background: var(--accent-soft); color: var(--accent); }
  .level-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); }
  .level-card h3 {
    font-family: var(--font-serif); font-size: 18.5px; font-weight: 600;
    margin: 0 0 6px; color: var(--text); line-height: 1.25;
  }
  .level-card p {
    font-size: 13.5px; line-height: 1.55; color: var(--text-muted); margin: 0 0 14px;
  }
  .level-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px; border-top: 1px solid var(--border-subtle);
    font-size: 12.5px; font-weight: 600; color: var(--text);
  }
  .level-bar { height: 3px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .level-bar > span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }

  /* 30-Minute Routine Grid */
  .routine-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  .routine-step {
    padding: 16px 0 4px; border-top: 2px solid var(--border-strong);
  }
  .routine-meta {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint);
    margin-bottom: 8px;
  }
  .routine-meta strong { color: var(--accent); font-weight: 600; }
  .routine-step h3 {
    font-family: var(--font-sans); font-size: 15px; font-weight: 700;
    margin: 0 0 6px; color: var(--text);
  }
  .routine-step p {
    font-size: 13.5px; line-height: 1.6; color: var(--text-muted); margin: 0 0 10px;
  }
  .routine-step a {
    font-size: 12.5px; font-weight: 600; color: var(--primary); text-decoration: none;
  }

  /* Contrast Pack Showcase on Home */
  .home-contrasts {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 14px; padding: 18px 20px; border-radius: var(--radius);
    background: var(--bg); border: 1px solid var(--border);
  }
  .home-contrasts p {
    margin: 0; font-size: 14px; color: var(--text-secondary); max-width: 48ch; line-height: 1.55;
  }
  .home-contrasts strong { color: var(--text); }

  /* Secondary Study Options */
  .tools-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .tool-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border);
    text-decoration: none; color: inherit; transition: border-color .14s, background .14s;
  }
  .tool-row:hover { border-color: var(--border-strong); background: var(--bg); }
  .tool-icon {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    background: var(--surface-2); color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tool-row h4 { font-size: 14px; font-weight: 650; margin: 0 0 2px; color: var(--text); }
  .tool-row p { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin: 0; }

  .home-colophon {
    font-size: 13px; line-height: 1.65; color: var(--text-muted);
  }
  .home-colophon a { color: var(--text-secondary); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }

  /* ==================== LESSON TOOLBAR ==================== */
  .lesson-toolbar {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; margin-bottom: 28px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .status-group { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .status-label {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-faint); margin-right: 6px;
  }
  .status-btn {
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    font-family: var(--font-sans); font-size: 12px; font-weight: 600;
    padding: 4.5px 9px; border-radius: 6px; cursor: pointer; transition: all .14s;
  }
  .status-btn:hover { background: var(--surface-2); color: var(--text); }
  .status-btn.active { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
  .status-btn.active[data-status="◐"] { background: var(--gold-soft); color: var(--gold); border-color: var(--gold-border); }
  .status-btn.active[data-status="☐"] { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .toolbar-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .toolbar-actions .top-btn { padding: 5.5px 10px; font-size: 12.5px; }

  /* ==================== LESSON MASTHEAD ==================== */
  .lesson-masthead {
    padding-bottom: 24px; margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .masthead-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-bottom: 14px; font-size: 12.5px; color: var(--text-muted);
  }
  .meta-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    padding: 2.5px 8px; border-radius: 5px;
    background: var(--surface-2); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .meta-pill.level-A1 { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
  .meta-pill.level-A2 { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-border); }
  .meta-pill.level-B1 { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .meta-sep { color: var(--border-strong); }
  .masthead-meta a {
    color: var(--primary); text-decoration: none; font-weight: 500;
  }
  .lesson-masthead h1 {
    font-family: var(--font-serif); font-size: clamp(28px, 4vw, 36px);
    font-weight: 600; line-height: 1.18; letter-spacing: -0.025em;
    margin: 0 0 16px; color: var(--text);
  }
  .cando-box {
    border-left: 2.5px solid var(--ok);
    background: var(--bg);
    padding: 11px 16px; border-radius: 0 8px 8px 0;
    font-size: 14.5px; line-height: 1.6; color: var(--text-secondary);
  }
  .cando-label {
    display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ok);
    margin-bottom: 3px;
  }

  /* ==================== FLASHCARDS & PRACTICE ==================== */
  .fc-panel {
    background: var(--paper);
    padding: 4px 0;
  }
  .fc-panel h1 {
    font-family: var(--font-serif); font-size: clamp(26px, 4vw, 34px); font-weight: 600;
    letter-spacing: -0.025em; margin: 0; line-height: 1.18;
  }
  .practice-panel h2 {
    font-family: var(--font-serif); font-size: 21px; line-height: 1.3;
    margin: 22px 0 8px;
  }
  .practice-panel h3 { margin: 18px 0 4px; font-size: 15.5px; }
  .practice-panel p { margin: 8px 0 12px; color: var(--text-secondary); }
  .practice-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .practice-panel .top-btn { text-decoration: none; }
  .practice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; margin-top: 18px; }
  .practice-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; background: var(--surface);
    transition: border-color .15s;
  }
  .practice-card:hover { border-color: var(--border-strong); }
  .practice-card h2 { margin-top: 0; font-size: 19px; }
  .practice-card .top-btn { margin: 4px 8px 6px 0; }
  .practice-panel form { margin-bottom: 14px; }
  .practice-panel label { display: block; margin: 12px 0; font-weight: 600; font-size: 14px; color: var(--text); }
  .practice-panel input[type="text"], .practice-panel textarea, .practice-panel select {
    display: block; width: 100%; margin-top: 5px; padding: 9px 12px; font: inherit; font-weight: 400;
    color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  .practice-panel [readonly] { background: var(--surface-2); }
  .practice-panel textarea { resize: vertical; }
  .practice-panel input:focus-visible, .practice-panel textarea:focus-visible, .practice-panel select:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .practice-results { padding-left: 22px; }
  .practice-results > li, .practice-reviews > li { margin: 0 0 14px; }
  .practice-panel fieldset { min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .practice-panel fieldset label, .practice-panel .practice-check { display: inline-flex; gap: 6px; margin-right: 16px; font-weight: 500; }
  .practice-panel audio { display: block; max-width: 100%; margin: 10px 0; }
  .practice-status { color: var(--accent); font-weight: 500; }
  .practice-panel audio[hidden], .practice-status:empty { display: none; }
  .practice-panel summary { cursor: pointer; font-weight: 600; }
  .practice-clock { display: inline-block; font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin: 8px 10px 12px 0; font-weight: 600; }

  /* ==================== EDITORIAL READING SHEET ==================== */
  article.md {
    color: var(--text);
  }
  article.md > h1:first-child {
    font-family: var(--font-serif); font-size: clamp(28px, 4vw, 36px);
    font-weight: 600; line-height: 1.18; letter-spacing: -0.025em;
    margin: 0 0 18px; color: var(--text);
  }
  article.md h2 {
    font-family: var(--font-serif); font-size: 22.5px; font-weight: 600;
    margin: 40px 0 15px; padding-top: 22px;
    border-top: 1px solid var(--border); letter-spacing: -0.016em;
    color: var(--text); display: flex; align-items: baseline; gap: 10px;
  }
  article.md.is-lesson .lesson-masthead + h2 {
    margin-top: 4px; padding-top: 0; border-top: none;
  }
  article.md h2:first-of-type:not(.lesson-masthead + h2) { margin-top: 24px; }
  .sec-num {
    font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.02em; flex-shrink: 0;
    background: var(--accent-soft); padding: 2px 7px; border-radius: 5px;
    transform: translateY(-2px);
  }
  article.md h3 {
    font-family: var(--font-sans); font-size: 15.5px; font-weight: 700;
    margin: 26px 0 9px; color: var(--text); letter-spacing: -0.008em;
  }
  article.md h4 {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin: 22px 0 8px;
  }
  article.md p { margin: 0 0 15px; color: var(--text-secondary); }
  article.md p strong { color: var(--text); font-weight: 650; }
  article.md ul, article.md ol { margin: 0 0 18px; padding-left: 22px; color: var(--text-secondary); }
  article.md li { margin-bottom: 7px; padding-left: 3px; }
  article.md li::marker { color: var(--text-faint); font-family: var(--font-mono); font-size: 0.88em; }
  article.md li strong { color: var(--text); }
  article.md hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  article.md a {
    color: var(--primary); text-decoration: underline;
    text-decoration-color: var(--primary-border); text-underline-offset: 3px;
    font-weight: 500; transition: text-decoration-color .15s, color .15s;
  }
  .routine-step a:hover, .masthead-meta a:hover { color: var(--accent); text-decoration: underline; }
  .home-colophon a:hover { color: var(--accent); }
  article.md a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  article.md del { color: var(--text-faint); text-decoration-color: var(--accent); }

  article.md code {
    background: var(--code-bg); color: var(--code-text);
    padding: 1.5px 5.5px; border-radius: 4.5px;
    font-family: var(--font-mono); font-size: 0.84em; font-weight: 500;
  }
  /* Warm Architectural Grammar Diagram Block */
  article.md pre {
    background: var(--diagram-bg); color: var(--diagram-text);
    border: 1px solid var(--diagram-border);
    padding: 16px 18px; border-radius: var(--radius); overflow-x: auto;
    margin: 18px 0 24px; line-height: 1.66; max-width: 100%;
  }
  article.md pre code {
    background: transparent; padding: 0; color: inherit;
    font-size: 11.2px; font-weight: 450;
  }

  article.md blockquote {
    margin: 18px 0 22px; padding: 14px 18px;
    border-left: 2.5px solid var(--gold);
    background: var(--bg); border-radius: 0 8px 8px 0;
    color: var(--text-secondary);
  }
  article.md blockquote p { margin-bottom: 8px; }
  article.md blockquote p:last-child { margin-bottom: 0; }

  /* Structured Multilingual Contrast Callouts */
  .contrast-group {
    display: flex; flex-direction: column; gap: 8px; margin: 20px 0 24px;
  }
  article.md .contrast-box {
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    background: var(--primary-soft);
    padding: 13px 16px; border-radius: 0 9px 9px 0;
    font-size: 14.5px; line-height: 1.65;
    color: var(--text-secondary);
  }
  article.md .contrast-box[data-lang="pt-BR"] { border-left-color: var(--c-pt-border); background: var(--c-pt-bg); }
  article.md .contrast-box[data-lang="es"]    { border-left-color: var(--c-es-border); background: var(--c-es-bg); }
  article.md .contrast-box[data-lang="fr"]    { border-left-color: var(--c-fr-border); background: var(--c-fr-bg); }
  article.md .contrast-box[data-lang="en"]    { border-left-color: var(--c-en-border); background: var(--c-en-bg); }
  article.md .contrast-box strong { color: var(--text); }
  article.md .contrast-box.hidden-lang { display: none; }
  .contrast-hdr {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text); margin-bottom: 5px;
  }
  .contrast-body { display: block; }

  /* Swiss Book Typography Tables */
  article.md .table-wrap {
    overflow-x: auto; margin: 18px 0 26px;
    border-top: 1.5px solid var(--border-strong);
    border-bottom: 1.5px solid var(--border-strong);
  }
  article.md table {
    width: 100%; border-collapse: collapse; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  article.md th, article.md td {
    border-bottom: 1px solid var(--border-subtle); padding: 10px 13px;
    text-align: left; vertical-align: top;
  }
  article.md tr:last-child td { border-bottom: none; }
  article.md th {
    background: var(--bg); font-family: var(--font-mono);
    font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  article.md tbody tr:hover { background: var(--bg); }

  /* Collapsible Answer Key */
  article.md details {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg); margin: 16px 0 24px; overflow: hidden;
    transition: border-color .15s;
  }
  article.md details:hover { border-color: var(--border-strong); }
  article.md details summary {
    cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px;
    color: var(--text); list-style: none; user-select: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); transition: background .15s;
  }
  article.md details summary::-webkit-details-marker { display: none; }
  article.md details summary:hover { background: var(--surface-2); }
  .summary-chev {
    width: 16px; height: 16px; color: var(--text-muted);
    transition: transform .18s ease; flex-shrink: 0;
  }
  article.md details[open] .summary-chev { transform: rotate(90deg); color: var(--accent); }
  article.md details[open] summary { border-bottom: 1px solid var(--border); }
  article.md details > .details-body { padding: 18px 20px 6px; }

  /* Case symbol dual-coding */
  .sym-nom { color: var(--case-nom); font-weight: 700; }
  .sym-akk { color: var(--case-akk); font-weight: 700; }
  .sym-dat { color: var(--case-dat); font-weight: 700; }
  .sym-gen { color: var(--case-gen); font-weight: 700; }

  .lesson-footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 38px; padding-top: 22px; border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  /* ==================== FLASHCARDS STUDIO ==================== */
  .fc-tabs {
    display: flex; gap: 8px; margin-bottom: 18px;
    border-bottom: 1px solid var(--border); padding-bottom: 14px; flex-wrap: wrap;
  }
  .fc-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin: 20px 0 22px;
  }
  .stat-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 15px;
  }
  .stat-val {
    font-family: var(--font-serif); font-size: 26px; font-weight: 600;
    line-height: 1.15; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }

  .flashcard {
    position: relative; overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    padding: 32px 30px 26px; min-height: 255px; display: flex; flex-direction: column;
    justify-content: space-between; box-shadow: var(--shadow-sm); margin: 18px 0;
  }
  .flashcard::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--primary);
  }
  .flashcard[data-level="A1"]::before { background: var(--ok); }
  .flashcard[data-level="A2"]::before { background: var(--primary); }
  .flashcard[data-level="B1"]::before { background: var(--accent); }

  .fc-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
    margin-bottom: 20px; gap: 8px; flex-wrap: wrap;
  }
  .fc-tag {
    background: var(--surface-2); padding: 3px 8px; border-radius: 5px;
    border: 1px solid var(--border); color: var(--text-secondary); font-weight: 500;
  }
  .fc-q {
    font-family: var(--font-serif); font-size: 22.5px; font-weight: 500;
    line-height: 1.46; color: var(--text); margin-bottom: 20px;
  }
  .fc-a {
    border-top: 1px dashed var(--border-strong); padding-top: 18px; margin-top: 14px;
    font-size: 16.5px; color: var(--ok); font-weight: 600; line-height: 1.55;
    animation: fadeUp .16s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
  .grade-btn {
    border: 1px solid var(--border); border-radius: 9px; padding: 11px 8px;
    background: var(--bg); color: var(--text); cursor: pointer;
    font-family: var(--font-sans); font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px;
    transition: all .14s ease;
  }
  .grade-btn small { font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .grade-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-xs); }
  .grade-btn.g0 { border-color: var(--accent-border); color: var(--accent); }
  .grade-btn.g0:hover { background: var(--accent-soft); }
  .grade-btn.g1 { border-color: var(--gold-border); color: var(--gold); }
  .grade-btn.g1:hover { background: var(--gold-soft); }
  .grade-btn.g2 { border-color: var(--ok-border); color: var(--ok); }
  .grade-btn.g2:hover { background: var(--ok-soft); }
  .grade-btn.g3 { border-color: var(--primary-border); color: var(--primary); }
  .grade-btn.g3:hover { background: var(--primary-soft); }

  .kbd {
    font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px;
    border-radius: 4px; border: 1px solid currentColor; opacity: .65; margin-left: 4px;
  }

  .fc-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  select.select {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: var(--font-sans);
    font-size: 13px; max-width: 100%; outline: none;
  }
  select.select:focus { border-color: var(--text-muted); }

  .fc-empty {
    text-align: center; padding: 38px 20px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 12px; margin-top: 14px;
  }
  .fc-empty-icon {
    width: 40px; height: 40px; border-radius: 10px; margin: 0 auto 12px;
    background: var(--ok-soft); color: var(--ok);
    display: flex; align-items: center; justify-content: center;
  }

  .notice {
    background: var(--gold-soft); border: 1px solid var(--gold-border); color: var(--text);
    padding: 16px 20px; border-radius: var(--radius); margin-bottom: 18px; font-size: 14.5px;
  }
  .toast {
    position: fixed; bottom: 22px; right: 22px;
    background: var(--ink-btn); color: var(--ink-btn-text);
    padding: 10px 16px; border-radius: 9px; font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px);
    transition: all .2s ease; pointer-events: none; z-index: 99;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ==================== RESPONSIVE: IPAD & TABLET (<= 1024px) ==================== */
  @media (max-width: 1024px) {
    .brand-sub { display: none; }
    .lang-bar-label { display: none; }
    aside.sidebar {
      transform: translateX(-100%);
      box-shadow: var(--shadow-lg);
    }
    aside.sidebar.drawer-open { transform: translateX(0); }
    .backdrop.open { display: block; }
    main.content, body.sidebar-collapsed main.content { margin-left: 0; padding: 28px 28px 88px; }
  }

  /* ==================== RESPONSIVE: IPHONE & MOBILE (<= 720px) ==================== */
  @media (max-width: 720px) {
    :root { --header-h: 94px; }
    .topbar-main {
      height: auto;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 52px 40px;
      padding: 0;
      gap: 0;
    }
    .brand-group {
      grid-column: 1; grid-row: 1;
      padding-left: 12px; gap: 8px;
    }
    .brand-word { font-size: 21px; }
    .top-controls { display: contents; }
    .top-actions {
      grid-column: 2; grid-row: 1;
      padding-right: 12px; gap: 6px;
      justify-self: end; align-self: center;
    }
    .top-actions .top-btn { padding: 6px 10px; font-size: 12.5px; }
    .top-actions .icon-btn { width: 34px; height: 34px; padding: 0; }
    .lang-bar {
      grid-column: 1 / -1; grid-row: 2;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg);
      padding: 0 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; width: 100%;
    }
    .lang-bar-label {
      display: inline-block; font-size: 10px; letter-spacing: 0.06em;
    }
    .lang-pills {
      background: transparent; border: none; padding: 0; gap: 4px;
    }
    .lang-pill {
      padding: 4px 8px; font-size: 11.5px; gap: 4px;
      background: var(--surface); border-color: var(--border); opacity: 0.6;
    }
    .lang-pill.active {
      border-color: var(--border-strong); opacity: 1;
    }

    main.content { padding: 22px 16px 76px; }
    .home-metrics { grid-template-columns: repeat(2, 1fr); gap: 14px 12px; }
    .level-grid { grid-template-columns: 1fr; }
    .routine-grid { grid-template-columns: 1fr; gap: 16px; }
    .tools-grid { grid-template-columns: 1fr; }
    .fc-stats { grid-template-columns: repeat(2, 1fr); }
    .grade-row { grid-template-columns: repeat(2, 1fr); }
    .flashcard { padding: 22px 18px; }
    article.md pre { padding: 15px 14px; font-size: 12.5px; }
  }

  /* ==================== PRINT ==================== */
  @media print {
    header.topbar, aside.sidebar, .backdrop, .lesson-toolbar, .lesson-footer, .toast, .doc-print-bar {
      display: none;
    }
    html, body, [data-theme="dark"] body {
      background: #fff; color: #111; font-size: 11pt; line-height: 1.55;
    }
    .layout { display: block; padding-top: 0; }
    main.content, body.sidebar-collapsed main.content { margin-left: 0; padding: 0; }
    .container { max-width: 100%; }
    .lesson-masthead h1, article.md h1, article.md > h1:first-child { font-size: 20pt; color: #000; }
    article.md h2 { font-size: 14pt; color: #000; page-break-after: avoid; break-after: avoid; }
    article.md p, article.md li { color: #111; }
    article.md a { color: #111; text-decoration: none; }
    article.md pre {
      background: #f5f5f5; color: #111; border: 1px solid #ccc;
      white-space: pre-wrap; page-break-inside: avoid; break-inside: avoid;
    }
    article.md .table-wrap, article.md blockquote, article.md .contrast-box {
      page-break-inside: avoid; break-inside: avoid;
    }
    article.md .contrast-box.hidden-lang { display: none; }
    article.md details:not([open]) { border: 1px dashed #bbb; }
  }
</style>

  function todayISO() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function addDaysISO(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  function isRecord(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }

  function isScheduleRow(id, row) {
    if (!isRecord(row) || row.id !== id || !LESSON_IDS.has(row.topic) || !id.startsWith(`${row.topic}-`)) return false;
    if (!/^(?:A[12]|B1)-\d{2}-(?:[a-zA-Z]+(?:-[a-zA-Z]+)*-)?\d{2,}$/.test(id)) return false;
    if (typeof row.due !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(row.due)) return false;
    const date = new Date(row.due);
    return Number.isFinite(date.valueOf()) && date.toISOString().slice(0, 10) === row.due
      && Number.isInteger(row.step) && row.step >= 0 && row.step < LADDER.length
      && Number.isSafeInteger(row.reviews) && row.reviews >= 0
      && Number.isSafeInteger(row.correct) && row.correct >= 0 && row.correct <= row.reviews;
  }

  function normalizeState(candidate, fallback, strict = false) {
    if (!isRecord(candidate)) throw new Error("Invalid progress data");
    const next = { ...fallback };
    const validators = {
      langs: value => Array.isArray(value) && value.length > 0 && value.every(lang => LANGUAGES.includes(lang)),
      theme: value => value === "light" || value === "dark",
      sidebarCollapsed: value => typeof value === "boolean",
      progress: (id, status) => LESSON_IDS.has(id) && STATUSES.includes(status),
      schedule: isScheduleRow,
      collapsed: (key, value) => SIDEBAR_GROUPS.includes(key) && typeof value === "boolean"
    };
    const fields = [...Object.keys(validators), "practice"].filter(key => Object.hasOwn(candidate, key));
    if (strict && fields.length === 0) throw new Error("Missing progress data");
    for (const key of fields) {
      const value = candidate[key];
      if (key === "practice") {
        try { next.practice = GenauPracticeModel.normalizePractice(value); }
        catch (err) { if (strict) throw err; }
      } else if (key === "langs" || key === "theme" || key === "sidebarCollapsed") {
        if (validators[key](value)) next[key] = key === "langs" ? [...new Set(value)] : value;
        else if (strict) throw new Error(`Invalid ${key}`);
      } else if (isRecord(value)) {
        const entries = Object.entries(value);
        const valid = entries.filter(([id, entry]) => validators[key](id, entry));
        if (strict && valid.length !== entries.length) throw new Error(`Invalid ${key}`);
        next[key] = Object.fromEntries(valid);
      } else if (strict) {
        throw new Error(`Invalid ${key}`);
      }
    }
    return next;
  }

      if (raw) return normalizeState(JSON.parse(raw), defaults);

    return defaults;

  // Relative path resolution for Markdown links
  function resolveRelativePath(baseFile, href) {
    if (!href || href.startsWith("http://") || href.startsWith("https://") || href.startsWith("mailto:") || href.startsWith("#")) {
      return null;
    }
    const cleanHref = href.split("#")[0];
    if (!cleanHref.endsWith(".md")) return null;
    const baseParts = baseFile.split("/").slice(0, -1);
    const relParts = cleanHref.split("/");
    const out = [...baseParts];
    for (const part of relParts) {
      if (!part || part === ".") continue;
      if (part === "..") out.pop();
      else out.push(part);
    }
    return out.join("/");
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function formatInline(text, baseFile) {
    const codeTokens = [];
    let s = text.replace(/`([^`]+)`/g, (_, code) => {
      const idx = codeTokens.length;
      codeTokens.push(`<code>${escapeHtml(code)}</code>`);
      return `\uE000CODE${idx}\uE001`;
    });

    s = escapeHtml(s);

    // Links [text](href)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
      const resolved = resolveRelativePath(baseFile, href);
      if (resolved) {
        return `<a href="#doc=${encodeURIComponent(resolved)}">${label}</a>`;
      }
      if (href.startsWith("http://") || href.startsWith("https://")) {
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      }
      const baseDir = baseFile.includes("/") ? baseFile.slice(0, baseFile.lastIndexOf("/") + 1) : "";
      const url = href.startsWith("/") ? href : baseDir + href;
      return `<a href="${url}" download>${label}</a>`;
    });

    // Bare https URLs
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

    // Strikethrough, Bold, Italic
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^\w*])\*([^*]+)\*(?!\w)/g, "$1<em>$2</em>");

    // Highlight Genau case symbols
    s = s.replace(/●/g, '<span class="sym-nom">●</span>')
         .replace(/▲/g, '<span class="sym-akk">▲</span>')
         .replace(/■/g, '<span class="sym-dat">■</span>')
         .replace(/◆/g, '<span class="sym-gen">◆</span>');

    // Restore inline code
    s = s.replace(/\uE000CODE(\d+)\uE001/g, (_, idx) => codeTokens[Number(idx)]);
    return s;
  }

  function detectContrastLang(line) {
    if (line.includes("🇧🇷")) return "pt-BR";
    if (line.includes("🇪🇸")) return "es";
    if (line.includes("🇫🇷")) return "fr";
    if (line.includes("🇬🇧")) return "en";
    return null;
  }

  function stripContrastPrefix(line) {
    return line
      .replace(/^(?:🇧🇷|🇪🇸|🇫🇷|🇬🇧)\s*/u, "")
      .replace(/^\*\*(?:Portuguese|Brazilian Portuguese|Spanish|French|English)\s+contrast\*\*\s*[—–:-]?\s*/i, "")
      .trim();
  }

  const LIST_ITEM = /^( *)(?:(\d+)\.|[-*+])[ \t]+(.*)$/;

  function renderList(lines, start, baseFile) {
    const first = lines[start].match(LIST_ITEM);
    const indent = first[1].length;
    const ordered = first[2] !== undefined;
    const tag = ordered ? "ol" : "ul";
    const startAttr = ordered && Number(first[2]) !== 1 ? ` start="${Number(first[2])}"` : "";
    const items = [];
    let end = start;
    while (end < lines.length) {
      const item = lines[end].match(LIST_ITEM);
      if (!item || item[1].length !== indent || (item[2] !== undefined) !== ordered) break;
      let content = formatInline(item[3], baseFile);
      end++;
      while (end < lines.length && (lines[end].match(LIST_ITEM)?.[1].length ?? 0) > indent) {
        const nested = renderList(lines, end, baseFile);
        content += nested.html;
        end = nested.end;
      }
      items.push(`<li>${content}</li>`);
    }
    return { html: `<${tag}${startAttr}>${items.join("")}</${tag}>`, end };
  }

  function renderLessonMasthead(md, lesson, baseFile) {
    const lines = md.replace(/<!--[\s\S]*?-->/g, "").replace(/\r\n/g, "\n").split("\n");
    let i = 0;
    while (i < lines.length && !lines[i].trim()) i++;
    if (i >= lines.length || !lines[i].startsWith("# ")) return null;

    const rawTitle = lines[i].replace(/^#\s+/, "").trim();
    const cleanTitle = rawTitle.replace(/^(?:A[12]|B1)-\d{2}\s*[—–-]\s*/, "");
    i++;
    while (i < lines.length && !lines[i].trim()) i++;

    const metaLines = [];
    while (i < lines.length && lines[i].trim() && /^\*\*(?:Level|Can-do|Time|Prerequisites)/i.test(lines[i].trim())) {
      metaLines.push(lines[i].trim());
      i++;
    }
    if (!metaLines.length) return null;

    const levelCode = lesson.id.split("-")[0];
    let timeVal = "";
    let prereqHtml = "";
    let nicosHtml = "";
    let candoHtml = "";

    for (const ml of metaLines) {
      if (/^\*\*Can-do:\*\*/i.test(ml)) {
        candoHtml = formatInline(ml.replace(/^\*\*Can-do:\*\*\s*/i, ""), baseFile);
      } else {
        const parts = ml.split(/\s*·\s*/);
        for (const p of parts) {
          if (/^\*\*Time:\*\*/i.test(p)) timeVal = p.replace(/^\*\*Time:\*\*\s*/i, "").trim();
          else if (/^\*\*Prerequisites:\*\*/i.test(p)) {
            const pr = p.replace(/^\*\*Prerequisites:\*\*\s*/i, "").trim();
            prereqHtml = pr.replace(/\b((?:A[12]|B1)-\d{2})\b/g, (_, id) => {
              const target = LESSON_BY_ID[id];
              return target ? `<a href="#doc=${encodeURIComponent(target.path)}">${id}</a>` : id;
            });
          } else if (/^\*\*Nicos Weg:\*\*/i.test(p)) {
            nicosHtml = formatInline(p.replace(/^\*\*Nicos Weg:\*\*\s*/i, "").trim(), baseFile);
          }
        }
      }
    }

    const pills = [
      `<span class="meta-pill level-${levelCode}">${lesson.id}</span>`,
      timeVal ? `<span>${escapeHtml(timeVal)}</span>` : "",
      prereqHtml && prereqHtml.toLowerCase() !== "none" ? `<span class="meta-sep">·</span><span>Prereq: ${prereqHtml}</span>` : "",
      nicosHtml ? `<span class="meta-sep">·</span><span>DW Nicos Weg: ${nicosHtml}</span>` : ""
    ].filter(Boolean).join("");

    const mastheadHtml = `
      <div class="lesson-masthead">
        <div class="masthead-meta">${pills}</div>
        <h1>${formatInline(cleanTitle, baseFile)}</h1>
        ${candoHtml ? `<div class="cando-box"><span class="cando-label">Learning Goal</span>${candoHtml}</div>` : ""}
      </div>
    `;
    return { mastheadHtml, restMd: lines.slice(i).join("\n") };
  }

  function renderMarkdown(md, baseFile) {
    const cleaned = md.replace(/<!--[\s\S]*?-->/g, "");
    const lines = cleaned.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      if (!line.trim()) { i++; continue; }

      // Collapsible <details> block
      if (/^<details>\s*$/i.test(line.trim())) {
        i++;
        let summaryHtml = "Click to reveal";
        if (i < lines.length && /^<summary>/i.test(lines[i].trim())) {
          const summary = lines[i].trim().replace(/^<summary>/i, "").replace(/<\/summary>$/i, "");
          const bold = summary.match(/^<b>(.*)<\/b>$/i);
          summaryHtml = bold ? `${formatInline(bold[1], baseFile)}` : formatInline(summary, baseFile);
          i++;
        }
        const inner = [];
        while (i < lines.length && !/^<\/details>\s*$/i.test(lines[i].trim())) {
          inner.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        out.push(`<details><summary>${ICONS.chevRight}<span>${summaryHtml}</span></summary><div class="details-body">${renderMarkdown(inner.join("\n"), baseFile)}</div></details>`);
        continue;
      }

      // Fenced code block
      if (line.trim().startsWith("```")) {
        i++;
        const codeLines = [];
        while (i < lines.length && !lines[i].trim().startsWith("```")) {
          codeLines.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        continue;
      }

      // Horizontal rule
      if (/^---+$/.test(line.trim())) {
        out.push("<hr>");
        i++;
        continue;
      }

      // Headings
      const hm = line.match(/^(#{1,6})\s+(.+)$/);
      if (hm) {
        const lvl = hm[1].length;
        const text = hm[2].trim();
        if (lvl === 2) {
          const numMatch = text.match(/^(\d+)\.\s+(.+)$/);
          if (numMatch) {
            out.push(`<h2><span class="sec-num">${numMatch[1].padStart(2, "0")}</span><span>${formatInline(numMatch[2], baseFile)}</span></h2>`);
            i++;
            continue;
          }
        }
        out.push(`<h${lvl}>${formatInline(text, baseFile)}</h${lvl}>`);
        i++;
        continue;
      }

      // Table
      if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|\s*[-:]+/.test(lines[i + 1].trim())) {
        const parseRow = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
        const headers = parseRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith("|")) {
          rows.push(parseRow(lines[i]));
          i++;
        }
        out.push(
          `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${formatInline(h, baseFile)}</th>`).join("")}</tr></thead>` +
          `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${formatInline(c, baseFile)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
        );
        continue;
      }

      // Blockquote & Multilingual contrast callouts
      if (line.trim().startsWith(">")) {
        const bqLines = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) {
          bqLines.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        const isContrastBlock = bqLines.some(l => detectContrastLang(l));
        if (isContrastBlock) {
          const boxes = [];
          for (const bl of bqLines) {
            if (!bl.trim()) continue;
            const lang = detectContrastLang(bl);
            if (lang) {
              const hidden = state.langs.includes(lang) ? "" : " hidden-lang";
              const meta = LANG_META[lang];
              const bodyText = stripContrastPrefix(bl);
              boxes.push(
                `<div class="contrast-box${hidden}" data-lang="${lang}">` +
                `<div class="contrast-hdr">${FLAGS[lang]}<span>${meta.label}</span></div>` +
                `<span class="contrast-body">${formatInline(bodyText, baseFile)}</span>` +
                `</div>`
              );
            } else {
              boxes.push(`<blockquote><p>${formatInline(bl, baseFile)}</p></blockquote>`);
            }
          }
          out.push(`<div class="contrast-group">${boxes.join("")}</div>`);
        } else {
          out.push(`<blockquote>${bqLines.map(l => l.trim() ? `<p>${formatInline(l, baseFile)}</p>` : "").join("")}</blockquote>`);
        }
        continue;
      }

      // Lists
      if (LIST_ITEM.test(line)) {
        const list = renderList(lines, i, baseFile);
        out.push(list.html);
        i = list.end;
        continue;
      }

      // Paragraph
      const para = [line];
      i++;
      while (
        i < lines.length &&
        lines[i].trim() &&
        !lines[i].trim().startsWith("#") &&
        !lines[i].trim().startsWith(">") &&
        !lines[i].trim().startsWith("```") &&
        !lines[i].trim().startsWith("|") &&
        !/^---+$/.test(lines[i].trim()) &&
        !LIST_ITEM.test(lines[i]) &&
        !/^<details>/i.test(lines[i].trim())
      ) {
        para.push(lines[i]);
        i++;
      }
      out.push(`<p>${formatInline(para.join(" "), baseFile)}</p>`);
    }

    return out.join("\n");
  }

  // Fetch markdown file
  async function fetchDoc(path) {
    if (docCache.has(path)) return docCache.get(path);
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const txt = await res.text();
    docCache.set(path, txt);
    return txt;
  }

  // ---------- Flashcards SRS ----------
  function parseCardsMd(txt, langCode = null) {
    const out = [];
    let cur = null;
    for (const line of txt.replace(/\r\n/g, "\n").split("\n")) {
      const m = line.match(/^###\s+(\S+)\s*$/);
      if (m) {
        if (cur) out.push(cur);
        const id = m[1];
        const topic = id.split("-").slice(0, 2).join("-");
        cur = { id, topic, Q: "", A: "", T: "", lang: langCode };
        continue;
      }
      if (cur) {
        if (line.startsWith("Q:")) cur.Q = `${cur.Q} ${line.slice(2).trim()}`.trim();
        else if (line.startsWith("A:")) cur.A = `${cur.A} ${line.slice(2).trim()}`.trim();
        else if (line.startsWith("T:")) cur.T = `${cur.T} ${line.slice(2).trim()}`.trim();
      }
    }
    if (cur) out.push(cur);
    return out;
  }

      ["review/cards/B1.md", null],
      ["review/cards/contrasts/pt-BR.md", "pt-BR"],
      ["review/cards/contrasts/es.md", "es"],
      ["review/cards/contrasts/fr.md", "fr"],
      ["review/cards/contrasts/en.md", "en"]
    ];
    allCardsPromise = Promise.allSettled(files.map(async ([path, lang]) => {
      return parseCardsMd(await fetchDoc(path), lang);
    })).then(results => {
      const failed = files.filter((_, index) => results[index].status === "rejected");
      if (failed.length) {
        allCardsPromise = null;
        throw new Error(`Could not load ${failed.map(([path]) => path).join(", ")}. Try again.`);
      }
      return results.flatMap(result => result.value);
    });
    return allCardsPromise;
  }

  async function queueTopicCards(topicId) {
    const cards = await loadAllCards();
    const today = todayISO();
    let added = 0;
    for (const c of cards) {
      if (c.topic !== topicId) continue;
      if (c.lang && !state.langs.includes(c.lang)) continue;
      if (!state.schedule[c.id]) {
        state.schedule[c.id] = { id: c.id, topic: c.topic, due: today, step: 0, reviews: 0, correct: 0 };
        added++;
      }
    }
    saveState();
    return added;
  }

  function gradeScheduleRow(row, grade) {
    let step = row.step || 0;
    const reviews = row.reviews || 0;
    if (grade === 0) step = 0;
    else if (grade === 1) step = Math.max(0, step - 1);
    else if (grade === 2) step = (reviews === 0 && step === 0) ? 0 : Math.min(LADDER.length - 1, step + 1);
    else if (grade === 3) step = (reviews === 0 && step === 0) ? 1 : Math.min(LADDER.length - 1, step + 2);
    row.step = step;
    row.due = addDaysISO(LADDER[step]);
    row.reviews = reviews + 1;
    row.correct = (row.correct || 0) + (grade >= 2 ? 1 : 0);
    saveState();
  }

  const fcSession = { mode: "due", queue: [], idx: 0, revealed: false, reviewed: 0, practiceTopic: "A1-01" };

  async function openFlashcards(requestId) {
    updatePrimaryNavActive();
    closeDrawerSidebar();
    renderSidebar(document.getElementById("searchInput").value);
    const container = document.getElementById("mainContainer");

    if (window.location.protocol === "file:") {
      container.innerHTML = `<div class="notice">Browser flashcards require the hosted web app or a local HTTP server. For offline flashcards, import the ready-made Anki decks in <code>review/anki/</code>.</div>`;
      return;
    }

    container.innerHTML = `<div style="padding:48px 0; text-align:center; color:var(--text-muted)">Loading flashcards…</div>`;
    let cards;
    try {
      cards = await loadAllCards();
    } catch (err) {
      if (requestId !== navigationId) return;
      container.innerHTML = `<div class="notice">${escapeHtml(err.message)}
        <button class="top-btn" id="retryFlashcardsBtn" type="button" style="margin-left:10px">Retry</button></div>`;
      document.getElementById("retryFlashcardsBtn").addEventListener("click", route);
      return;
    }
    if (requestId !== navigationId) return;
    const cardMap = Object.fromEntries(cards.map(c => [c.id, c]));

    function buildDueQueue() {
      const today = todayISO();
      const due = Object.values(state.schedule).filter(r => r.due <= today && cardMap[r.id]);
      for (let i = due.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [due[i], due[j]] = [due[j], due[i]];
      }
      return due.map(r => cardMap[r.id]);
    }

    function buildPracticeQueue(topicId) {
      return cards.filter(c => c.topic === topicId && (!c.lang || state.langs.includes(c.lang)));
    }

    if (fcSession.mode === "due") {
      fcSession.queue = buildDueQueue();
      fcSession.idx = 0;
      fcSession.revealed = false;
    }

    function renderFc() {
      if (requestId !== navigationId) return;
      const today = todayISO();
      const totalQueued = Object.keys(state.schedule).length;
      const dueCount = Object.values(state.schedule).filter(r => r.due <= today).length;
      const totalReviews = Object.values(state.schedule).reduce((s, r) => s + (r.reviews || 0), 0);
      const totalCorrect = Object.values(state.schedule).reduce((s, r) => s + (r.correct || 0), 0);
      const acc = totalReviews ? `${Math.round((100 * totalCorrect) / totalReviews)}%` : "—";

      const curCard = fcSession.queue[fcSession.idx];

      container.innerHTML = `
        <div class="fc-panel">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:4px">
            <h1>Flashcards &amp; Spaced Repetition</h1>
            <a class="top-btn" href="#doc=review%2Fanki%2FREADME.md">${ICONS.download}<span>Anki Decks</span></a>
          </div>

          <div class="fc-stats">
            <div class="stat-card"><div class="stat-val">${dueCount}</div><div class="stat-lbl">Due today</div></div>
            <div class="stat-card"><div class="stat-val">${totalQueued}</div><div class="stat-lbl">In queue</div></div>
            <div class="stat-card"><div class="stat-val">${acc}</div><div class="stat-lbl">Accuracy</div></div>
            <div class="stat-card"><div class="stat-val">${fcSession.reviewed}</div><div class="stat-lbl">Reviewed today</div></div>
          </div>

          <div class="fc-tabs">
            <button class="top-btn ${fcSession.mode === "due" ? "primary" : ""}" id="tabDue" type="button">Daily Review Queue (${dueCount})</button>
            <button class="top-btn ${fcSession.mode === "practice" ? "primary" : ""}" id="tabPractice" type="button">Free Practice by Topic</button>
          </div>

          <div class="fc-controls">
            <select class="select" id="topicSelect">
              ${ALL_LESSONS.filter(l => !l.path.includes("consolidation")).map(l =>
                `<option value="${l.id}" ${fcSession.practiceTopic === l.id ? "selected" : ""}>${l.id} — ${escapeHtml(l.title)}</option>`
              ).join("")}
            </select>
            ${fcSession.mode === "due"
              ? `<button class="top-btn" id="addTopicBtn" type="button">+ Add Topic</button>
                 <button class="top-btn" id="addDoneBtn" type="button">+ Add Completed Lessons</button>`
              : `<button class="top-btn" id="startPracticeBtn" type="button">Load Topic Cards</button>`
            }
          </div>

          ${curCard ? `
            <div class="flashcard" data-level="${curCard.id.split('-')[0]}">
              <div>
                <div class="fc-meta">
                  <span class="fc-tag">${curCard.id} · ${curCard.topic}${curCard.lang ? ` · ${curCard.lang}` : ""}</span>
                  <span>Card ${fcSession.idx + 1} of ${fcSession.queue.length}</span>
                </div>
                <div class="fc-q">${formatInline(curCard.Q, "README.md")}</div>
                ${fcSession.revealed ? `<div class="fc-a">${formatInline(curCard.A, "README.md")}</div>` : ""}
              </div>
              <div>
                ${!fcSession.revealed
                  ? `<button class="top-btn primary" id="revealBtn" type="button" style="width:100%; justify-content:center; padding:11px">Show Answer <span class="kbd">Space</span></button>`
                  : (fcSession.mode === "due"
                    ? `<div class="grade-row">
                        <button class="grade-btn g0" data-g="0" type="button"><span>Again <span class="kbd">0</span></span><small>1 day</small></button>
                        <button class="grade-btn g1" data-g="1" type="button"><span>Hard <span class="kbd">1</span></span><small>step back</small></button>
                        <button class="grade-btn g2" data-g="2" type="button"><span>Good <span class="kbd">2</span></span><small>next step</small></button>
                        <button class="grade-btn g3" data-g="3" type="button"><span>Easy <span class="kbd">3</span></span><small>skip step</small></button>
                      </div>`
                    : `<button class="top-btn primary" id="nextPracticeBtn" type="button" style="width:100%; justify-content:center; padding:11px">Next Card ${ICONS.arrowRight} <span class="kbd">Space</span></button>`
                  )
                }
              </div>
            </div>
          ` : `
            <div class="fc-empty">
              <div class="fc-empty-icon">${ICONS.check}</div>
              <strong>${fcSession.mode === "due" ? (totalQueued ? "All caught up for today." : "Your review queue is empty.") : "Practice deck complete."}</strong>
              <p style="color:var(--text-muted); font-size:14px; margin:8px auto 0; max-width:44ch">
                ${fcSession.mode === "due"
                  ? "Pick a topic above and click <strong>+ Add Topic</strong>, or switch to <strong>Free Practice</strong> to test yourself right away."
                  : "Pick another topic above to keep practicing."}
              </p>
            </div>
          `}
        </div>
      `;

      document.getElementById("tabDue").addEventListener("click", () => {
        fcSession.mode = "due";
        fcSession.queue = buildDueQueue();
        fcSession.idx = 0;
        fcSession.revealed = false;
        renderFc();
      });
      document.getElementById("tabPractice").addEventListener("click", () => {
        fcSession.mode = "practice";
        fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
        fcSession.idx = 0;
        fcSession.revealed = false;
        renderFc();
      });
      document.getElementById("topicSelect").addEventListener("change", e => {
        fcSession.practiceTopic = e.target.value;
        if (fcSession.mode === "practice") {
          fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        }
      });

      const addTopicBtn = document.getElementById("addTopicBtn");
      if (addTopicBtn) {
        addTopicBtn.addEventListener("click", async () => {
          const tid = document.getElementById("topicSelect").value;
          const n = await queueTopicCards(tid);
          showToast(n ? `Queued ${n} cards for ${tid}` : `${tid} cards already queued`);
          fcSession.queue = buildDueQueue();
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const addDoneBtn = document.getElementById("addDoneBtn");
      if (addDoneBtn) {
        addDoneBtn.addEventListener("click", async () => {
          let total = 0;
          for (const l of ALL_LESSONS) {
            if (["●", "✔"].includes(state.progress[l.id])) {
              total += await queueTopicCards(l.id);
            }
          }
          showToast(total ? `Queued ${total} cards from completed lessons` : "No new cards from completed lessons");
          fcSession.queue = buildDueQueue();
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const startPracticeBtn = document.getElementById("startPracticeBtn");
      if (startPracticeBtn) {
        startPracticeBtn.addEventListener("click", () => {
          fcSession.practiceTopic = document.getElementById("topicSelect").value;
          fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const revealBtn = document.getElementById("revealBtn");
      if (revealBtn) {
        revealBtn.addEventListener("click", () => { fcSession.revealed = true; renderFc(); });
      }
      const nextPracticeBtn = document.getElementById("nextPracticeBtn");
      if (nextPracticeBtn) {
        nextPracticeBtn.addEventListener("click", () => {
          fcSession.idx++;
          fcSession.revealed = false;
          fcSession.reviewed++;
          renderFc();
        });
      }
      container.querySelectorAll(".grade-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const g = Number(btn.dataset.g);
          const row = state.schedule[curCard.id];
          if (row) gradeScheduleRow(row, g);
          fcSession.idx++;
          fcSession.revealed = false;
          fcSession.reviewed++;
          renderFc();
        });
      });
    }

    renderFc();
  }

  // Keyboard shortcuts in flashcard mode
  window.addEventListener("keydown", e => {
    if (location.hash !== "#flashcards") return;
    if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    if (e.code === "Space" || e.key === "Enter") {
      const rev = document.getElementById("revealBtn");
      const nxt = document.getElementById("nextPracticeBtn");
      if (rev) { e.preventDefault(); rev.click(); }
      else if (nxt) { e.preventDefault(); nxt.click(); }
    } else if (["0", "1", "2", "3"].includes(e.key)) {
      const btn = document.querySelector(`.grade-btn[data-g="${e.key}"]`);
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });

  // Header controls
  document.getElementById("themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    saveState();
    applyTheme();
  });
  document.getElementById("fcNavBtn").addEventListener("click", () => {
    location.hash = "#flashcards";
  });
  document.querySelectorAll(".lang-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.dataset.lang;
      if (state.langs.includes(code)) {
        if (state.langs.length === 1) {
          showToast("Keep at least one contrast language enabled.");
          return;
        }
        state.langs = state.langs.filter(l => l !== code);
      } else {
        state.langs.push(code);
      }
      saveState();
      renderLangPills();
      if (currentPath === "README.md" && (!location.hash || location.hash === "#doc=README.md")) {
        renderHome();
      }
      showToast(`Contrast languages: ${state.langs.map(l => LANG_META[l].code).join(", ")}`);
    });
  });

  // Search
  document.getElementById("searchInput").addEventListener("input", e => {
    renderSidebar(e.target.value);
  });

  // Export / Import JSON backup
  document.getElementById("exportProgressBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `genau-progress-${todayISO()}.json`;
    a.click();
    showToast("Backup downloaded.");
  });
  document.getElementById("importProgressBtn").addEventListener("click", () => {
    document.getElementById("importFileInput").click();
  });
  document.getElementById("importFileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    const reader = new FileReader();
    reader.onload = () => {
      let restored;
      try {
        restored = normalizeState(JSON.parse(reader.result), state, true);
      } catch {
        showToast("Invalid backup file.");
        return;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));
      } catch {
        showToast("Could not save this backup in your browser.");
        return;
      }
      state = restored;
      updateBadges();
      applyTheme();
      syncSidebarState();
      renderLangPills();
      route();
      showToast("Progress restored.");
    };
    reader.onerror = () => showToast("Could not read the backup file.");
    reader.readAsText(file);
  });

  // Reading scroll progress bar
  function updateReadProgress() {
    const bar = document.getElementById("readProgress");
    if (!bar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const pct = h > 40 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0;
    bar.style.width = `${pct}%`;
  }
  window.addEventListener("scroll", updateReadProgress, { passive: true });

  // Router
  async function openPractice(page, requestId) {
    updatePrimaryNavActive();
    closeDrawerSidebar();
    renderSidebar(document.getElementById("searchInput").value);
    const container = document.getElementById("mainContainer");
    container.textContent = "Loading practice…";
    try {
      const bank = GenauPracticeModel.validateCatalogue(JSON.parse(await fetchDoc("practice/content.json")));
      if (requestId !== navigationId) return;
      closePractice = GenauPracticeView.mount({
        container, page, bank,
        getPractice: () => state.practice,
        savePractice(practice) {
          const next = { ...state, practice };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); }
          catch { return false; }
          state = next;
          return true;
        }
      });
      window.scrollTo({ top: 0, behavior: "instant" });
    } catch {
      if (requestId !== navigationId) return;
      const notice = document.createElement("div");
      notice.className = "notice";
      notice.textContent = "Could not load practice. Use the hosted app or reload this page.";
      container.replaceChildren(notice);
    }
  }

  function route() {
    closePractice();
    closePractice = () => {};
    const requestId = ++navigationId;
    const h = location.hash || "#doc=README.md";
    updatePrimaryNavActive();
    if (h === "#flashcards") {
      openFlashcards(requestId);
    } else if (h.startsWith("#practice=")) {
      openPractice(h.slice("#practice=".length), requestId);
    } else if (h.startsWith("#doc=")) {
      const path = decodeURIComponent(h.slice(5));
      openDoc(path, requestId);
    } else {
      openDoc("README.md", requestId);
    }
    setTimeout(updateReadProgress, 60);
  }
  window.addEventListener("hashchange", route);

  // Boot
  applyTheme();
  syncSidebarState();
  renderLangPills();
  updateBadges();
  renderSidebar();
  route();
})();
</script>
</body>
</html>
