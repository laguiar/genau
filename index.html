<style>
  :root {
    /* 60% Dominant — Warm archival linen & book paper */
    --bg: #f5f2eb;
    --surface: #fcfbf7;
    --surface-2: #ede9df;
    --surface-hover: #e6e0d4;
    --topbar-bg: rgba(252, 251, 247, 0.88);

    /* 30% Structural neutrals — Warm charcoal & stone */
    --border: #e2dcd0;
    --border-strong: #cfc8b8;
    --text: #1c1b18;
    --text-secondary: #434039;
    --text-muted: #6e695e;
    --text-faint: #948e81;

    /* 10% Complementary accents — Prussian Indigo + Warm Ochre */
    --primary: #1d3c63;
    --primary-hover: #142b47;
    --primary-soft: rgba(29, 60, 99, 0.075);
    --primary-border: rgba(29, 60, 99, 0.22);

    --accent: #b85c1b;
    --accent-hover: #964912;
    --accent-soft: #f9ecdf;
    --accent-border: rgba(184, 92, 27, 0.28);

    /* Semantic & Dual-Coding Case Colors (harmonized, low-glare) */
    --ok: #1d6f4e;
    --ok-soft: #e3f2eb;
    --ok-border: rgba(29, 111, 78, 0.26);

    --case-nom: #2457a6;
    --case-akk: #bd5d18;
    --case-dat: #1d704e;
    --case-gen: #6a3d9a;

    /* Contrast box subtle tints */
    --c-pt-border: #2a7f62; --c-pt-bg: rgba(42, 127, 98, 0.065);
    --c-es-border: #c25a2b; --c-es-bg: rgba(194, 90, 43, 0.065);
    --c-fr-border: #335c9c; --c-fr-bg: rgba(51, 92, 156, 0.065);
    --c-en-border: #6d4c9c; --c-en-bg: rgba(109, 76, 156, 0.065);

    /* Code & Diagrams */
    --code-bg: #eeeae0;
    --code-text: #1c3554;
    --pre-bg: #1e2126;
    --pre-border: #2c313a;
    --pre-text: #eceae4;

    /* Typography */
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* Elevation & Layout */
    --shadow-xs: 0 1px 2px rgba(28, 27, 24, 0.04);
    --shadow-sm: 0 2px 8px rgba(28, 27, 24, 0.045), 0 1px 2px rgba(28, 27, 24, 0.03);
    --shadow-md: 0 10px 28px rgba(28, 27, 24, 0.07), 0 2px 6px rgba(28, 27, 24, 0.04);
    --shadow-lg: 0 18px 42px rgba(28, 27, 24, 0.12);
    --sidebar-w: 304px;
    --header-h: 60px;
    --radius: 12px;
  }

  [data-theme="dark"] {
    --bg: #131518;
    --surface: #1a1d22;
    --surface-2: #22262d;
    --surface-hover: #2a2f38;
    --topbar-bg: rgba(26, 29, 34, 0.88);

    --border: #2c313a;
    --border-strong: #3c4350;
    --text: #eae6dc;
    --text-secondary: #cbc6ba;
    --text-muted: #9398a3;
    --text-faint: #6c727e;

    --primary: #7ca8db;
    --primary-hover: #9ac0ea;
    --primary-soft: rgba(124, 168, 219, 0.13);
    --primary-border: rgba(124, 168, 219, 0.3);

    --accent: #e49250;
    --accent-hover: #f0aa70;
    --accent-soft: rgba(228, 146, 80, 0.14);
    --accent-border: rgba(228, 146, 80, 0.34);

    --ok: #55c493;
    --ok-soft: rgba(85, 196, 147, 0.13);
    --ok-border: rgba(85, 196, 147, 0.3);

    --case-nom: #79a9f5;
    --case-akk: #f0a15c;
    --case-dat: #56c795;
    --case-gen: #bc92f0;

    --c-pt-border: #4ab38c; --c-pt-bg: rgba(74, 179, 140, 0.09);
    --c-es-border: #e28354; --c-es-bg: rgba(226, 131, 84, 0.09);
    --c-fr-border: #6f9be0; --c-fr-bg: rgba(111, 155, 224, 0.09);
    --c-en-border: #a784db; --c-en-bg: rgba(167, 132, 219, 0.09);

    --code-bg: #252a33;
    --code-text: #c9ddf5;
    --pre-bg: #101216;
    --pre-border: #252a33;
    --pre-text: #e6e4de;

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.42);
    --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.58);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans);
    font-size: 15.5px;
    line-height: 1.72;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Subtle warm scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); border: 2px solid transparent; background-clip: content-box; }

  /* Header */
  header.topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
    background: var(--topbar-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; gap: 12px; z-index: 40;
  }
  .read-progress {
    position: absolute; bottom: -1px; left: 0; height: 2px; width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transition: width .08s linear; pointer-events: none;
  }
  .brand-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .menu-btn {
    display: none; background: transparent; border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 15px;
  }
  .brand {
    display: flex; align-items: baseline; gap: 10px; cursor: pointer;
    text-decoration: none; color: var(--text); white-space: nowrap;
  }
  .brand strong {
    font-family: var(--font-serif); font-size: 24px; font-weight: 600;
    letter-spacing: -0.025em; line-height: 1; display: inline-flex; align-items: baseline; gap: 3px;
  }
  .brand strong::after {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); display: inline-block; margin-left: 1px;
  }
  .brand span {
    font-size: 12px; color: var(--text-muted); font-weight: 500;
    letter-spacing: 0.01em; padding-left: 10px; border-left: 1px solid var(--border);
  }

  .top-controls { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; overflow-x: auto; }
  .lang-pills {
    display: flex; align-items: center; gap: 2px;
    background: var(--surface-2); padding: 3px; border-radius: 10px; border: 1px solid var(--border);
  }
  .lang-pill {
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    font-family: var(--font-sans); font-size: 12px; font-weight: 600;
    padding: 4px 9px; border-radius: 7px; cursor: pointer;
    transition: all .15s ease; white-space: nowrap;
  }
  .lang-pill:hover { color: var(--text); }
  .lang-pill.active {
    background: var(--surface); color: var(--text);
    border-color: var(--border); box-shadow: var(--shadow-xs);
  }

  .top-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    font-family: var(--font-sans); font-size: 13px; font-weight: 600;
    padding: 7px 13px; border-radius: 9px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: all .15s ease; white-space: nowrap; box-shadow: var(--shadow-xs);
  }
  .top-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
  .top-btn.primary {
    background: var(--primary); color: #faf9f6; border-color: var(--primary);
  }
  [data-theme="dark"] .top-btn.primary { color: #12161c; }
  .top-btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .badge {
    background: var(--accent); color: #fff;
    font-family: var(--font-mono); font-size: 11px; padding: 1px 6px;
    border-radius: 999px; font-weight: 600; line-height: 1.4;
  }
  .top-btn:not(.primary) .badge { background: var(--accent-soft); color: var(--accent); }
  .icon-btn {
    width: 35px; height: 35px; padding: 0; justify-content: center; font-size: 15px;
  }

  /* Layout */
  .layout { display: flex; padding-top: var(--header-h); min-height: 100vh; }

  aside.sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0; width: var(--sidebar-w);
    background: var(--bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 30;
    transition: transform .22s cubic-bezier(.22,1,.36,1);
  }
  .sidebar-top { padding: 14px 14px 12px; border-bottom: 1px solid var(--border); }
  .search-wrap { position: relative; }
  .search-wrap::before {
    content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-faint); font-size: 15px; pointer-events: none;
  }
  .search-input {
    width: 100%; padding: 8px 10px 8px 28px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-family: var(--font-sans); font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  .progress-mini { margin-top: 12px; font-size: 12px; color: var(--text-muted); }
  .progress-mini-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .progress-mini-row strong { font-family: var(--font-mono); font-size: 11.5px; color: var(--text); }
  .bar-track { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--ok));
    border-radius: 99px; transition: width .35s ease;
  }

  .sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 10px 24px; }
  .nav-group { margin-bottom: 12px; }
  .nav-group-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); cursor: pointer; user-select: none;
    border-radius: 7px; transition: background .12s, color .12s;
  }
  .nav-group-hdr:hover { background: var(--surface-2); color: var(--text); }
  .nav-group-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }
  .nav-list { list-style: none; margin: 3px 0 0; padding: 0; }
  .nav-group.collapsed .nav-list { display: none; }
  .nav-item {
    position: relative; display: flex; align-items: flex-start; gap: 8px;
    padding: 6.5px 10px; border-radius: 8px; font-size: 13px; line-height: 1.38;
    color: var(--text-secondary); cursor: pointer; text-decoration: none;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active {
    background: var(--surface); color: var(--primary); font-weight: 600;
    box-shadow: var(--shadow-xs);
  }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--primary);
  }
  .nav-status {
    font-size: 11px; flex-shrink: 0; margin-top: 2px; width: 13px; text-align: center;
    color: var(--text-faint);
  }
  .nav-status[data-st="●"], .nav-status[data-st="✔"] { color: var(--ok); }
  .nav-status[data-st="◐"] { color: var(--accent); }
  .nav-id {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    color: var(--text-faint); flex-shrink: 0; margin-top: 2px;
  }
  .nav-item.active .nav-id { color: var(--primary); }
  .nav-title { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  .case-legend {
    padding: 8px 14px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);
    background: var(--surface-2); letter-spacing: 0.01em;
  }
  .case-legend span { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; }

  .sidebar-footer {
    padding: 8px 12px; border-top: 1px solid var(--border);
    display: flex; gap: 6px; justify-content: space-between; font-size: 12px;
    background: var(--bg);
  }
  .link-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-family: var(--font-sans); font-weight: 500;
    padding: 5px 8px; border-radius: 7px; font-size: 12px; transition: all .12s;
  }
  .link-btn:hover { background: var(--surface-2); color: var(--text); }

  .backdrop {
    display: none; position: fixed; inset: 0; background: rgba(15, 16, 18, 0.45);
    backdrop-filter: blur(2px); z-index: 25;
  }

  /* Main content */
  main.content {
    margin-left: var(--sidebar-w); flex: 1; padding: 30px 32px 96px;
    min-width: 0;
  }
  .container { max-width: 810px; margin: 0 auto; }

  /* Lesson toolbar */
  .lesson-toolbar {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 11px 16px; margin-bottom: 18px; box-shadow: var(--shadow-xs);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .status-group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .status-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-faint); margin-right: 6px;
  }
  .status-btn {
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    font-family: var(--font-sans); font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 7px; cursor: pointer; transition: all .14s;
  }
  .status-btn:hover { background: var(--surface-2); color: var(--text); }
  .status-btn.active { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
  .status-btn.active[data-status="◐"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .status-btn.active[data-status="☐"] { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
  .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar-actions .top-btn { padding: 6px 11px; font-size: 12.5px; }

  /* Editorial Reading Sheet */
  article.md {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 44px 52px; box-shadow: var(--shadow-sm);
    color: var(--text);
  }
  article.md h1 {
    font-family: var(--font-serif); font-size: 32px; font-weight: 600;
    line-height: 1.22; margin: 0 0 18px; letter-spacing: -0.025em;
    color: var(--text);
  }
  article.md.is-lesson h1 + p {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; font-size: 13.5px; line-height: 1.65; margin: 0 0 24px;
    color: var(--text-muted);
  }
  article.md h2 {
    font-family: var(--font-serif); font-size: 22px; font-weight: 600;
    margin: 38px 0 14px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border); letter-spacing: -0.015em;
    color: var(--text);
  }
  article.md h3 {
    font-family: var(--font-sans); font-size: 15.5px; font-weight: 700;
    margin: 24px 0 9px; color: var(--primary); letter-spacing: -0.005em;
  }
  article.md h4 {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-muted); margin: 20px 0 8px;
  }
  article.md p { margin: 0 0 15px; color: var(--text-secondary); }
  article.md p strong { color: var(--text); font-weight: 650; }
  article.md ul, article.md ol { margin: 0 0 16px; padding-left: 24px; color: var(--text-secondary); }
  article.md li { margin-bottom: 6px; }
  article.md li strong { color: var(--text); }
  article.md hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
  article.md a {
    color: var(--primary); text-decoration: underline;
    text-decoration-color: var(--primary-border); text-underline-offset: 3px;
    font-weight: 500; transition: text-decoration-color .15s, color .15s;
  }
  article.md a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  article.md del { color: var(--text-faint); text-decoration-color: var(--accent); }

  article.md code {
    background: var(--code-bg); color: var(--code-text);
    padding: 2px 6px; border-radius: 5px;
    font-family: var(--font-mono); font-size: 0.85em; font-weight: 500;
  }
  article.md pre {
    background: var(--pre-bg); color: var(--pre-text);
    border: 1px solid var(--pre-border);
    padding: 18px 20px; border-radius: 10px; overflow-x: auto;
    margin: 16px 0 20px; line-height: 1.62; box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  article.md pre code {
    background: transparent; padding: 0; color: inherit;
    font-size: 13px; font-weight: 400;
  }

  article.md blockquote {
    margin: 16px 0 20px; padding: 13px 18px;
    border-left: 3px solid var(--accent);
    background: var(--bg); border-radius: 0 10px 10px 0;
    color: var(--text-secondary);
  }
  article.md blockquote p { margin-bottom: 8px; }
  article.md blockquote p:last-child { margin-bottom: 0; }

  /* Harmonized Multilingual Contrast Callouts */
  article.md .contrast-box {
    border-left: 3.5px solid var(--primary);
    background: var(--primary-soft);
    padding: 12px 16px; border-radius: 0 10px 10px 0;
    margin: 0 0 10px; font-size: 14.5px; line-height: 1.65;
    color: var(--text-secondary);
  }
  article.md .contrast-box[data-lang="pt-BR"] { border-left-color: var(--c-pt-border); background: var(--c-pt-bg); }
  article.md .contrast-box[data-lang="es"]    { border-left-color: var(--c-es-border); background: var(--c-es-bg); }
  article.md .contrast-box[data-lang="fr"]    { border-left-color: var(--c-fr-border); background: var(--c-fr-bg); }
  article.md .contrast-box[data-lang="en"]    { border-left-color: var(--c-en-border); background: var(--c-en-bg); }
  article.md .contrast-box strong { color: var(--text); }
  article.md .contrast-box.hidden-lang { display: none; }

  /* Editorial Tables */
  article.md .table-wrap {
    overflow-x: auto; margin: 16px 0 22px;
    border: 1px solid var(--border); border-radius: 10px;
  }
  article.md table {
    width: 100%; border-collapse: collapse; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  article.md th, article.md td {
    border-bottom: 1px solid var(--border); padding: 10px 13px;
    text-align: left; vertical-align: top;
  }
  article.md th:not(:last-child), article.md td:not(:last-child) {
    border-right: 1px solid var(--border);
  }
  article.md tr:last-child td { border-bottom: none; }
  article.md th {
    background: var(--surface-2); font-weight: 700; font-size: 11.5px;
    text-transform: uppercase; letter-spacing: 0.045em; color: var(--text-muted);
  }
  article.md tbody tr:nth-child(even) { background: rgba(128, 120, 104, 0.035); }
  article.md tbody tr:hover { background: var(--primary-soft); }

  /* Tactile Collapsible Answer Key */
  article.md details {
    border: 1px solid var(--border); border-radius: 11px;
    background: var(--bg); margin: 14px 0 22px; overflow: hidden;
    transition: border-color .15s;
  }

  function todayISO() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function addDaysISO(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  const LANGUAGES = ["pt-BR", "es", "fr", "en"];
  const LESSON_IDS = new Set(ALL_LESSONS.map(lesson => lesson.id));
  const STATUSES = ["☐", "◐", "◑", "●", "✔"];
  const SIDEBAR_GROUPS = ["start", "A1", "A2", "B1", "shared"];

  function isRecord(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }

  function isScheduleRow(id, row) {
    if (!isRecord(row) || row.id !== id || !LESSON_IDS.has(row.topic) || !id.startsWith(row.topic + "-")) return false;
    if (!/^(?:A[12]|B1)-\d{2}-(?:[a-zA-Z]+(?:-[a-zA-Z]+)*-)?\d{2,}$/.test(id)) return false;
    if (typeof row.due !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(row.due)) return false;
    const date = new Date(row.due);
    return Number.isFinite(date.valueOf()) && date.toISOString().slice(0, 10) === row.due
      && Number.isInteger(row.step) && row.step >= 0 && row.step < LADDER.length
      && Number.isSafeInteger(row.reviews) && row.reviews >= 0
      && Number.isSafeInteger(row.correct) && row.correct >= 0 && row.correct <= row.reviews;
  }

  function normalizeState(candidate, fallback, strict = false) {
    if (!isRecord(candidate)) throw new Error("Invalid progress data");
    const next = { ...fallback };
    const validators = {
      langs: value => Array.isArray(value) && value.length > 0 && value.every(lang => LANGUAGES.includes(lang)),
      theme: value => value === "light" || value === "dark",
      progress: (id, status) => LESSON_IDS.has(id) && STATUSES.includes(status),
      schedule: isScheduleRow,
      collapsed: (key, value) => SIDEBAR_GROUPS.includes(key) && typeof value === "boolean"
    };
    const fields = Object.keys(validators).filter(key => Object.hasOwn(candidate, key));
    if (strict && fields.length === 0) throw new Error("Missing progress data");
    for (const key of fields) {
      const value = candidate[key];
      if (key === "langs" || key === "theme") {
        if (validators[key](value)) next[key] = key === "langs" ? [...new Set(value)] : value;
        else if (strict) throw new Error(`Invalid ${key}`);
      } else if (isRecord(value)) {
        const entries = Object.entries(value);
        const valid = entries.filter(([id, entry]) => validators[key](id, entry));
        if (strict && valid.length !== entries.length) throw new Error(`Invalid ${key}`);
        next[key] = Object.fromEntries(valid);
      } else if (strict) {
        throw new Error(`Invalid ${key}`);
      }
    }
    return next;
  }

  function loadState() {
    const defaults = {
      langs: [...LANGUAGES],
      progress: {},
      schedule: {},
      theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
      collapsed: {}
    };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return normalizeState(JSON.parse(raw), defaults);
    } catch {}
    return defaults;
  }
  let state = loadState();
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    updateBadges();
  }

  const docCache = new Map();

  let navigationId = 0;
  let currentPath = "README.md";

  // Relative path resolution for Markdown links
  function resolveRelativePath(baseFile, href) {
    if (!href || href.startsWith("http://") || href.startsWith("https://") || href.startsWith("mailto:") || href.startsWith("#")) {
      return null;
    }
    const cleanHref = href.split("#")[0];
    if (!cleanHref.endsWith(".md")) return null;
    const baseParts = baseFile.split("/").slice(0, -1);
    const relParts = cleanHref.split("/");
    const out = [...baseParts];
    for (const part of relParts) {
      if (!part || part === ".") continue;
      if (part === "..") out.pop();
      else out.push(part);
    }
    return out.join("/");
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function formatInline(text, baseFile) {
    // Protect inline code spans first
    const codeTokens = [];
    let s = text.replace(/`([^`]+)`/g, (_, code) => {
      const idx = codeTokens.length;
      codeTokens.push(`<code>${escapeHtml(code)}</code>`);
      return `\u0000CODE${idx}\u0000`;
    });

    s = escapeHtml(s);

    // Links [text](href)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
      const resolved = resolveRelativePath(baseFile, href);
      if (resolved) {
        return `<a href="#doc=${encodeURIComponent(resolved)}">${label}</a>`;
      }
      if (href.startsWith("http://") || href.startsWith("https://")) {
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      }
      // Relative non-md file (e.g. .tsv download)
      const baseDir = baseFile.includes("/") ? baseFile.slice(0, baseFile.lastIndexOf("/") + 1) : "";
      const url = href.startsWith("/") ? href : baseDir + href;
      return `<a href="${url}" download>${label}</a>`;
    });

    // Bare https URLs
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

    // Strikethrough ~~text~~
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    // Bold **text**
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    // Italic *text*
    s = s.replace(/(^|[^\w*])\*([^*]+)\*(?!\w)/g, "$1<em>$2</em>");

    // Highlight Genau case symbols subtly
    s = s.replace(/●/g, '<span class="sym-nom">●</span>')
         .replace(/▲/g, '<span class="sym-akk">▲</span>')
         .replace(/■/g, '<span class="sym-dat">■</span>')
         .replace(/◆/g, '<span class="sym-gen">◆</span>');

    // Restore inline code
    s = s.replace(/\u0000CODE(\d+)\u0000/g, (_, idx) => codeTokens[Number(idx)]);
    return s;
  }

  function detectContrastLang(line) {
    if (line.includes("🇧🇷") && /contrast/i.test(line)) return "pt-BR";
    if (line.includes("🇪🇸") && /contrast/i.test(line)) return "es";
    if (line.includes("🇫🇷") && /contrast/i.test(line)) return "fr";
    if (line.includes("🇬🇧") && /contrast/i.test(line)) return "en";
    return null;
  }

  const LIST_ITEM = /^( *)(?:(\d+)\.|[-*+])[ \t]+(.*)$/;

  function renderList(lines, start, baseFile) {
    const first = lines[start].match(LIST_ITEM);
    const indent = first[1].length;
    const ordered = first[2] !== undefined;
    const tag = ordered ? "ol" : "ul";
    const startAttr = ordered && Number(first[2]) !== 1 ? ` start="${Number(first[2])}"` : "";
    const items = [];
    let end = start;
    while (end < lines.length) {
      const item = lines[end].match(LIST_ITEM);
      if (!item || item[1].length !== indent || (item[2] !== undefined) !== ordered) break;
      let content = formatInline(item[3], baseFile);
      end++;
      while (end < lines.length && (lines[end].match(LIST_ITEM)?.[1].length ?? 0) > indent) {
        const nested = renderList(lines, end, baseFile);
        content += nested.html;
        end = nested.end;
      }
      items.push(`<li>${content}</li>`);
    }
    return { html: `<${tag}${startAttr}>${items.join("")}</${tag}>`, end };
  }

  function renderMarkdown(md, baseFile) {
    // Strip HTML comments (e.g. <!-- adapted ... -->)
    const cleaned = md.replace(/<!--[\s\S]*?-->/g, "");
    const lines = cleaned.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      // Blank line
      if (!line.trim()) { i++; continue; }

      // Collapsible <details> block
      if (/^<details>\s*$/i.test(line.trim())) {
        i++;
        let summaryHtml = "Click to reveal";
        if (i < lines.length && /^<summary>/i.test(lines[i].trim())) {
          const summary = lines[i].trim().replace(/^<summary>/i, "").replace(/<\/summary>$/i, "");
          const bold = summary.match(/^<b>(.*)<\/b>$/i);
          summaryHtml = bold ? `<b>${formatInline(bold[1], baseFile)}</b>` : formatInline(summary, baseFile);
          i++;
        }
        const inner = [];
        while (i < lines.length && !/^<\/details>\s*$/i.test(lines[i].trim())) {
          inner.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++; // consume </details>
        out.push(`<details><summary>${summaryHtml}</summary><div class="details-body">${renderMarkdown(inner.join("\n"), baseFile)}</div></details>`);
        continue;
      }

      // Fenced code block
      if (line.trim().startsWith("```")) {
        i++;
        const codeLines = [];
        while (i < lines.length && !lines[i].trim().startsWith("```")) {
          codeLines.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        out.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        continue;
      }

      // Horizontal rule
      if (/^---+$/.test(line.trim())) {
        out.push("<hr>");
        i++;
        continue;
      }

      // Headings
      const hm = line.match(/^(#{1,6})\s+(.+)$/);
      if (hm) {
        const lvl = hm[1].length;
        out.push(`<h${lvl}>${formatInline(hm[2].trim(), baseFile)}</h${lvl}>`);
        i++;
        continue;
      }

      // Table
      if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|\s*[-:]+/.test(lines[i + 1].trim())) {
        const parseRow = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
        const headers = parseRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith("|")) {
          rows.push(parseRow(lines[i]));
          i++;
        }
        out.push(
          `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${formatInline(h, baseFile)}</th>`).join("")}</tr></thead>` +
          `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${formatInline(c, baseFile)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
        );
        continue;
      }

      // Blockquote (and contrast language callouts)
      if (line.trim().startsWith(">")) {
        const bqLines = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) {
          bqLines.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        const isContrastBlock = bqLines.some(l => detectContrastLang(l));
        if (isContrastBlock) {
          for (const bl of bqLines) {
            if (!bl.trim()) continue;
            const lang = detectContrastLang(bl);
            if (lang) {
              const hidden = state.langs.includes(lang) ? "" : " hidden-lang";
              out.push(`<div class="contrast-box${hidden}" data-lang="${lang}">${formatInline(bl, baseFile)}</div>`);
            } else {
              out.push(`<blockquote><p>${formatInline(bl, baseFile)}</p></blockquote>`);
            }
          }
        } else {
          out.push(`<blockquote>${bqLines.map(l => l.trim() ? `<p>${formatInline(l, baseFile)}</p>` : "").join("")}</blockquote>`);
        }
        continue;
      }

      // Lists, including choices nested under exam questions.
      if (LIST_ITEM.test(line)) {
        const list = renderList(lines, i, baseFile);
        out.push(list.html);
        i = list.end;
        continue;
      }

      // Paragraph
      const para = [line];
      i++;
      while (
        i < lines.length &&
        lines[i].trim() &&
        !lines[i].trim().startsWith("#") &&
        !lines[i].trim().startsWith(">") &&
        !lines[i].trim().startsWith("```") &&
        !lines[i].trim().startsWith("|") &&
        !/^---+$/.test(lines[i].trim()) &&
        !LIST_ITEM.test(lines[i]) &&
        !/^<details>/i.test(lines[i].trim())
      ) {
        para.push(lines[i]);
        i++;
      }
      out.push(`<p>${formatInline(para.join(" "), baseFile)}</p>`);
    }

    return out.join("\n");
  }

  // Fetch markdown file
  async function fetchDoc(path) {
    if (docCache.has(path)) return docCache.get(path);
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const txt = await res.text();
    docCache.set(path, txt);
    return txt;
  }

      if (lesson) {

        html += `
          <div class="lesson-footer">
            ${prev ? `<a class="top-btn" style="text-decoration:none" href="#doc=${encodeURIComponent(prev.path)}">← ${prev.id}</a>` : `<span></span>`}
            ${next ? `<a class="top-btn primary" style="text-decoration:none" href="#doc=${encodeURIComponent(next.path)}">Next: ${next.id} →</a>` : `<a class="top-btn primary" style="text-decoration:none" href="#doc=${encodeURIComponent("shared/mock-exam-telc-b1.md")}">Take Full Mock Exam →</a>`}
          </div>`;
      }

      container.innerHTML = html;

      const printBtn = document.getElementById("printDocBtn");
      if (printBtn) {

      if (lesson) {

            renderSidebar(document.getElementById("searchInput").value);
            showToast(`${lesson.id} marked ${btn.textContent}`);

        document.getElementById("queueLessonBtn").addEventListener("click", async () => {
          try {

Rules: Ask ONE item at a time and keep the answer key hidden. For a regular lesson, start with the eight core diagnostic items. If I score at least 7/8, tell me I can mark it Known ✔. Review any extra diagnostic items separately. Otherwise explain in short dual-coded chunks, drill exercises one by one, correct mistakes with the rule, and finish with the 5-minute writing prompt. For a consolidation lesson, follow its test and scoring instructions.

    }
  }

  // ---------- Flashcards SRS ----------
  function parseCardsMd(txt, langCode = null) {
    const out = [];
    let cur = null;
    for (const line of txt.replace(/\r\n/g, "\n").split("\n")) {
      const m = line.match(/^###\s+(\S+)\s*$/);
      if (m) {
        if (cur) out.push(cur);
        const id = m[1];
        const topic = id.split("-").slice(0, 2).join("-");
        cur = { id, topic, Q: "", A: "", T: "", lang: langCode };
        continue;
      }
      if (cur) {
        if (line.startsWith("Q:")) cur.Q = (cur.Q + " " + line.slice(2).trim()).trim();
        else if (line.startsWith("A:")) cur.A = (cur.A + " " + line.slice(2).trim()).trim();
        else if (line.startsWith("T:")) cur.T = (cur.T + " " + line.slice(2).trim()).trim();
      }
    }
    if (cur) out.push(cur);
    return out;
  }

  function loadAllCards() {
    if (allCardsPromise) return allCardsPromise;
    const files = [
      ["review/cards/A1.md", null],
      ["review/cards/A2.md", null],
      ["review/cards/B1.md", null],
      ["review/cards/contrasts/pt-BR.md", "pt-BR"],
      ["review/cards/contrasts/es.md", "es"],
      ["review/cards/contrasts/fr.md", "fr"],
      ["review/cards/contrasts/en.md", "en"]
    ];
    allCardsPromise = Promise.allSettled(files.map(async ([path, lang]) => {
      return parseCardsMd(await fetchDoc(path), lang);
    })).then(results => {
      const failed = files.filter((_, index) => results[index].status === "rejected");
      if (failed.length) {
        allCardsPromise = null;
        throw new Error(`Could not load ${failed.map(([path]) => path).join(", ")}. Try again.`);
      }
      return results.flatMap(result => result.value);
    });
    return allCardsPromise;
  }

  async function queueTopicCards(topicId) {
    const cards = await loadAllCards();
    const today = todayISO();
    let added = 0;
    for (const c of cards) {
      if (c.topic !== topicId) continue;
      if (c.lang && !state.langs.includes(c.lang)) continue;
      if (!state.schedule[c.id]) {
        state.schedule[c.id] = { id: c.id, topic: c.topic, due: today, step: 0, reviews: 0, correct: 0 };
        added++;
      }
    }
    saveState();
    return added;
  }

  function gradeScheduleRow(row, grade) {
    let step = row.step || 0;
    const reviews = row.reviews || 0;
    if (grade === 0) step = 0;
    else if (grade === 1) step = Math.max(0, step - 1);
    else if (grade === 2) step = (reviews === 0 && step === 0) ? 0 : Math.min(LADDER.length - 1, step + 1);
    else if (grade === 3) step = (reviews === 0 && step === 0) ? 1 : Math.min(LADDER.length - 1, step + 2);
    row.step = step;
    row.due = addDaysISO(LADDER[step]);
    row.reviews = reviews + 1;
    row.correct = (row.correct || 0) + (grade >= 2 ? 1 : 0);
    saveState();
  }

  let fcSession = { mode: "due", queue: [], idx: 0, revealed: false, reviewed: 0, practiceTopic: "A1-01" };

  async function openFlashcards(requestId) {
    closeMobileSidebar();
    renderSidebar(document.getElementById("searchInput").value);
    const container = document.getElementById("mainContainer");

    if (window.location.protocol === "file:") {
      container.innerHTML = `<div class="notice">Browser flashcards require the GitHub Pages URL (or an HTTP server). For offline flashcards on your phone or laptop, import the ready-made Anki decks in <code>review/anki/</code>.</div>`;
      return;
    }

    container.innerHTML = `<div style="padding:40px; text-align:center; color:var(--text-muted)">Loading flashcards…</div>`;
    let cards;
    try {
      cards = await loadAllCards();
    } catch (err) {
      if (requestId !== navigationId) return;
      container.innerHTML = `<div class="notice">${escapeHtml(err.message)}
        <button class="top-btn" id="retryFlashcardsBtn">Retry</button></div>`;
      document.getElementById("retryFlashcardsBtn").addEventListener("click", route);
      return;
    }
    if (requestId !== navigationId) return;
    const cardMap = Object.fromEntries(cards.map(c => [c.id, c]));

    function buildDueQueue() {
      const today = todayISO();
      const due = Object.values(state.schedule).filter(r => r.due <= today && cardMap[r.id]);
      for (let i = due.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [due[i], due[j]] = [due[j], due[i]];
      }
      return due.map(r => cardMap[r.id]);
    }

    function buildPracticeQueue(topicId) {
      return cards.filter(c => c.topic === topicId && (!c.lang || state.langs.includes(c.lang)));
    }

    if (fcSession.mode === "due") {
      fcSession.queue = buildDueQueue();
      fcSession.idx = 0;
      fcSession.revealed = false;
    }

    function renderFc() {
      if (requestId !== navigationId) return;
      const today = todayISO();
      const totalQueued = Object.keys(state.schedule).length;
      const dueCount = Object.values(state.schedule).filter(r => r.due <= today).length;
      const totalReviews = Object.values(state.schedule).reduce((s, r) => s + (r.reviews || 0), 0);
      const totalCorrect = Object.values(state.schedule).reduce((s, r) => s + (r.correct || 0), 0);
      const acc = totalReviews ? Math.round((100 * totalCorrect) / totalReviews) + "%" : "—";

      const curCard = fcSession.queue[fcSession.idx];

      container.innerHTML = `
        <div class="fc-panel">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:6px">
            <h1>Flashcards &amp; Spaced Repetition</h1>
            <a class="top-btn" style="text-decoration:none" href="#doc=review%2Fanki%2FREADME.md">Prefer Anki? Download Decks</a>
          </div>

          <div class="fc-stats">
            <div class="stat-card"><div class="stat-val">${dueCount}</div><div class="stat-lbl">Due today</div></div>
            <div class="stat-card"><div class="stat-val">${totalQueued}</div><div class="stat-lbl">In your queue</div></div>
            <div class="stat-card"><div class="stat-val">${acc}</div><div class="stat-lbl">Accuracy</div></div>
            <div class="stat-card"><div class="stat-val">${fcSession.reviewed}</div><div class="stat-lbl">Reviewed this session</div></div>
          </div>

          <div class="fc-tabs">
            <button class="top-btn ${fcSession.mode === "due" ? "primary" : ""}" id="tabDue">Daily Review Queue (${dueCount})</button>
            <button class="top-btn ${fcSession.mode === "practice" ? "primary" : ""}" id="tabPractice">Free Practice by Topic</button>
          </div>

          <div class="fc-controls">
            <select class="select" id="topicSelect">
              ${ALL_LESSONS.filter(l => !l.path.includes("consolidation")).map(l =>
                `<option value="${l.id}" ${fcSession.practiceTopic === l.id ? "selected" : ""}>${l.id} — ${escapeHtml(l.title)}</option>`
              ).join("")}
            </select>
            ${fcSession.mode === "due"
              ? `<button class="top-btn" id="addTopicBtn">+ Add Topic to Queue</button>
                 <button class="top-btn" id="addDoneBtn">+ Add All Completed Lessons</button>`
              : `<button class="top-btn" id="startPracticeBtn">Load Topic Cards</button>`
            }
          </div>

          ${curCard ? `
            <div class="flashcard" data-level="${curCard.id.split('-')[0]}">
              <div>
                <div class="fc-meta">
                  <span class="fc-tag">${curCard.id} · ${curCard.topic}${curCard.lang ? ` · ${curCard.lang}` : ""}</span>
                  <span>Card ${fcSession.idx + 1} of ${fcSession.queue.length}</span>
                </div>
                <div class="fc-q">${formatInline(curCard.Q, "README.md")}</div>
                ${fcSession.revealed ? `<div class="fc-a">${formatInline(curCard.A, "README.md")}</div>` : ""}
              </div>
              <div>
                ${!fcSession.revealed
                  ? `<button class="top-btn primary" id="revealBtn" style="width:100%; justify-content:center; padding:12px">Show Answer <span class="kbd">Space</span></button>`
                  : (fcSession.mode === "due"
                    ? `<div class="grade-row">
                        <button class="grade-btn g0" data-g="0"><span>Again <span class="kbd">0</span></span><small>1 day</small></button>
                        <button class="grade-btn g1" data-g="1"><span>Hard <span class="kbd">1</span></span><small>step back</small></button>
                        <button class="grade-btn g2" data-g="2"><span>Good <span class="kbd">2</span></span><small>next step</small></button>
                        <button class="grade-btn g3" data-g="3"><span>Easy <span class="kbd">3</span></span><small>skip step</small></button>
                      </div>`
                    : `<button class="top-btn primary" id="nextPracticeBtn" style="width:100%; justify-content:center; padding:12px">Next Card → <span class="kbd">Space</span></button>`
                  )
                }
              </div>
            </div>
          ` : `
            <div style="text-align:center; padding:34px 16px; background:var(--surface-2); border-radius:10px; margin-top:12px">
              <div style="font-size:28px; margin-bottom:8px">🎉</div>
              <strong>${fcSession.mode === "due" ? (totalQueued ? "All caught up for today!" : "Your review queue is empty.") : "Practice deck complete!"}</strong>
              <p style="color:var(--text-muted); font-size:14px; margin:8px 0 0">
                ${fcSession.mode === "due"
                  ? "Pick a topic above and click <strong>+ Add Topic to Queue</strong>, or switch to <strong>Free Practice</strong> to test yourself right away."
                  : "Pick another topic above to keep practicing."}
              </p>
            </div>
          `}
        </div>
      `;

      document.getElementById("tabDue").addEventListener("click", () => {
        fcSession.mode = "due";
        fcSession.queue = buildDueQueue();
        fcSession.idx = 0;
        fcSession.revealed = false;
        renderFc();
      });
      document.getElementById("tabPractice").addEventListener("click", () => {
        fcSession.mode = "practice";
        fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
        fcSession.idx = 0;
        fcSession.revealed = false;
        renderFc();
      });
      document.getElementById("topicSelect").addEventListener("change", e => {
        fcSession.practiceTopic = e.target.value;
        if (fcSession.mode === "practice") {
          fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        }
      });

      const addTopicBtn = document.getElementById("addTopicBtn");
      if (addTopicBtn) {
        addTopicBtn.addEventListener("click", async () => {
          const tid = document.getElementById("topicSelect").value;
          const n = await queueTopicCards(tid);
          showToast(n ? `Queued ${n} cards for ${tid}` : `${tid} cards already queued`);
          fcSession.queue = buildDueQueue();
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const addDoneBtn = document.getElementById("addDoneBtn");
      if (addDoneBtn) {
        addDoneBtn.addEventListener("click", async () => {
          let total = 0;
          for (const l of ALL_LESSONS) {
            if (["●", "✔"].includes(state.progress[l.id])) {
              total += await queueTopicCards(l.id);
            }
          }
          showToast(total ? `Queued ${total} cards from completed lessons` : "No new cards from completed lessons");
          fcSession.queue = buildDueQueue();
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const startPracticeBtn = document.getElementById("startPracticeBtn");
      if (startPracticeBtn) {
        startPracticeBtn.addEventListener("click", () => {
          fcSession.practiceTopic = document.getElementById("topicSelect").value;
          fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const revealBtn = document.getElementById("revealBtn");
      if (revealBtn) {
        revealBtn.addEventListener("click", () => { fcSession.revealed = true; renderFc(); });
      }
      const nextPracticeBtn = document.getElementById("nextPracticeBtn");
      if (nextPracticeBtn) {
        nextPracticeBtn.addEventListener("click", () => {
          fcSession.idx++;
          fcSession.revealed = false;
          fcSession.reviewed++;
          renderFc();
        });
      }
      container.querySelectorAll(".grade-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const g = Number(btn.dataset.g);
          const row = state.schedule[curCard.id];
          if (row) gradeScheduleRow(row, g);
          fcSession.idx++;
          fcSession.revealed = false;
          fcSession.reviewed++;
          renderFc();
        });
      });
    }

    renderFc();
  }

  // Keyboard shortcuts in flashcard mode
  window.addEventListener("keydown", e => {
    if (location.hash !== "#flashcards") return;
    if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    if (e.code === "Space" || e.key === "Enter") {
      const rev = document.getElementById("revealBtn");
      const nxt = document.getElementById("nextPracticeBtn");
      if (rev) { e.preventDefault(); rev.click(); }
      else if (nxt) { e.preventDefault(); nxt.click(); }
    } else if (["0", "1", "2", "3"].includes(e.key)) {
      const btn = document.querySelector(`.grade-btn[data-g="${e.key}"]`);
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });

  // Mobile sidebar helpers
  function closeMobileSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("backdrop").classList.remove("open");
  }
  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("backdrop").classList.toggle("open");
  });
  document.getElementById("backdrop").addEventListener("click", closeMobileSidebar);

  // Header controls
  document.getElementById("themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    saveState();
    applyTheme();
  });
  document.getElementById("fcNavBtn").addEventListener("click", () => {
    location.hash = "#flashcards";
  });
  document.querySelectorAll(".lang-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.dataset.lang;
      if (state.langs.includes(code)) {
        if (state.langs.length === 1) {
          showToast("Keep at least one contrast language enabled.");
          return;
        }
        state.langs = state.langs.filter(l => l !== code);
      } else {
        state.langs.push(code);
      }
      saveState();
      renderLangPills();
      showToast(`Contrast languages: ${state.langs.join(", ")}`);
    });
  });

  // Search
  document.getElementById("searchInput").addEventListener("input", e => {
    renderSidebar(e.target.value);
  });

  // Export / Import JSON backup
  document.getElementById("exportProgressBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `genau-progress-${todayISO()}.json`;
    a.click();
    showToast("Backup downloaded!");
  });
  document.getElementById("importProgressBtn").addEventListener("click", () => {
    document.getElementById("importFileInput").click();
  });
  document.getElementById("importFileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    const reader = new FileReader();
    reader.onload = () => {
      let restored;
      try {
        restored = normalizeState(JSON.parse(reader.result), state, true);
      } catch {
        showToast("Invalid backup file.");
        return;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));
      } catch {
        showToast("Could not save this backup in your browser.");
        return;
      }
      state = restored;
      updateBadges();
      applyTheme();
      renderLangPills();
      route();
      showToast("Progress restored!");
    };
    reader.onerror = () => showToast("Could not read the backup file.");
    reader.readAsText(file);
  });

  // Reading scroll progress bar
  function updateReadProgress() {
    const bar = document.getElementById("readProgress");
    if (!bar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const pct = h > 40 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0;
    bar.style.width = pct + "%";
  }
  window.addEventListener("scroll", updateReadProgress, { passive: true });

  // Router
  function route() {
    const requestId = ++navigationId;
    const h = location.hash || "#doc=README.md";
    if (h === "#flashcards") {
      openFlashcards(requestId);
    } else if (h.startsWith("#doc=")) {
      const path = decodeURIComponent(h.slice(5));
      openDoc(path, requestId);
    } else {
      openDoc("README.md", requestId);
    }
    setTimeout(updateReadProgress, 60);
  }
  window.addEventListener("hashchange", route);

  // Boot
  applyTheme();
  renderLangPills();
  updateBadges();
  renderSidebar();
  route();
})();
</script>
</body>
</html>
