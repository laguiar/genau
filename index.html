<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fdfcfa" id="themeColorMeta">
<script>
try {
  const scheme = localStorage.getItem("genau_color_scheme");
  const isDark = scheme === "dark" || (scheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  if (scheme === "light" || scheme === "dark") {
    document.querySelector('meta[name="color-scheme"]').content = scheme;
  }
  document.getElementById("themeColorMeta").content = isDark ? "#121316" : "#fdfcfa";
} catch {}
</script>
