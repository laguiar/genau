<style>
  :root {
    /* Light Mode — Warm Archival Paper & Editorial Ink */
    --paper: #fdfcfa;
    --bg: #f6f4ef;
    --sidebar-bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #efece4;
    --surface-hover: #e7e2d7;
    --topbar-bg: rgba(253, 252, 250, 0.92);

    --border: #e5e0d5;
    --border-subtle: #eeeae1;
    --border-strong: #cfc8b8;

    --text: #161513;
    --text-secondary: #3c3a35;
    --text-muted: #6c675d;
    --text-faint: #777267;

    /* Disciplined Editorial Accents */
    --ink-btn: #18181b;
    --ink-btn-hover: #2c2c31;
    --ink-btn-text: #faf9f6;

    --primary: #1f4168;
    --primary-hover: #16304d;
    --primary-soft: rgba(31, 65, 104, 0.075);
    --primary-border: rgba(31, 65, 104, 0.22);

    --accent: #b83227;
    --accent-hover: #96261d;
    --accent-soft: rgba(184, 50, 39, 0.08);
    --accent-border: rgba(184, 50, 39, 0.24);

    --gold: #8f6410;
    --gold-soft: rgba(184, 130, 20, 0.11);
    --gold-border: rgba(184, 130, 20, 0.3);

    --ok: #1b6d4c;
    --ok-soft: rgba(27, 109, 76, 0.09);
    --ok-border: rgba(27, 109, 76, 0.26);

    /* Dual-Coding Case Colors */
    --case-nom: #2355a4;
    --case-akk: #b04e12;
    --case-dat: #1b6f4e;
    --case-gen: #6a3d9a;

    /* Contrast Box Accents */
    --c-pt-border: #257a5d; --c-pt-bg: rgba(37, 122, 93, 0.05);
    --c-es-border: #bf5226; --c-es-bg: rgba(191, 82, 38, 0.05);
    --c-fr-border: #2f5999; --c-fr-bg: rgba(47, 89, 153, 0.05);
    --c-en-border: #694998; --c-en-bg: rgba(105, 73, 152, 0.05);

    /* Code & Grammar Diagrams */
    --code-bg: #f0ede5;
    --code-text: #1c324d;
    --diagram-bg: #f5f2ea;
    --diagram-border: #e2dcd0;
    --diagram-text: #1b1a17;

    /* German Flag Editorial Band */
    --de-black: #18181b;
    --de-red: #c92a2a;
    --de-gold: #e6b322;

    /* Typography */
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* Elevation & Layout */
    --shadow-xs: 0 1px 2px rgba(22, 21, 19, 0.04);
    --shadow-sm: 0 2px 10px rgba(22, 21, 19, 0.045), 0 1px 2px rgba(22, 21, 19, 0.03);
    --shadow-md: 0 10px 30px rgba(22, 21, 19, 0.08), 0 2px 6px rgba(22, 21, 19, 0.04);
    --shadow-lg: 0 20px 50px rgba(22, 21, 19, 0.16);
    --sidebar-w: 292px;
    --header-h: 58px;
    --radius: 10px;
    --scroll-shade: rgba(22, 21, 19, 0.12);
  }

  [data-theme="dark"] {
    --scroll-shade: rgba(0, 0, 0, 0.55);
    /* Dark Mode — Warm Charcoal Graphite & Parchment Ink */
    --paper: #121316;
    --bg: #0e0f12;
    --sidebar-bg: #0f1013;
    --surface: #181a1f;
    --surface-2: #20232a;
    --surface-hover: #282c35;
    --topbar-bg: rgba(18, 19, 22, 0.92);

    --border: #24272f;
    --border-subtle: #1d2027;
    --border-strong: #353944;

    --text: #f0ede6;
    --text-secondary: #cbc6bc;
    --text-muted: #908c84;
    --text-faint: #8d8981;

    --ink-btn: #f0ede6;
    --ink-btn-hover: #ffffff;
    --ink-btn-text: #121316;

    --primary: #89b2df;
    --primary-hover: #a7c8eb;
    --primary-soft: rgba(137, 178, 223, 0.11);
    --primary-border: rgba(137, 178, 223, 0.28);

    --accent: #e05e52;
    --accent-hover: #ec786d;
    --accent-soft: rgba(224, 94, 82, 0.12);
    --accent-border: rgba(224, 94, 82, 0.3);

    --gold: #e4b53e;
    --gold-soft: rgba(228, 181, 62, 0.12);
    --gold-border: rgba(228, 181, 62, 0.32);

    --ok: #55c493;
    --ok-soft: rgba(85, 196, 147, 0.12);
    --ok-border: rgba(85, 196, 147, 0.3);

    --case-nom: #7aaaf5;
    --case-akk: #f0a05c;
    --case-dat: #56c795;
    --case-gen: #be94f2;

    --c-pt-border: #4ab38c; --c-pt-bg: rgba(74, 179, 140, 0.075);
    --c-es-border: #e28252; --c-es-bg: rgba(226, 130, 82, 0.075);
    --c-fr-border: #6f9be0; --c-fr-bg: rgba(111, 155, 224, 0.075);
    --c-en-border: #a784db; --c-en-bg: rgba(167, 132, 219, 0.075);

    --code-bg: #20232b;
    --code-text: #d0e1f7;
    --diagram-bg: #17191e;
    --diagram-border: #262932;
    --diagram-text: #ebe7de;

    --de-black: #2b2e36;
    --de-red: #cf3535;
    --de-gold: #e6b322;

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.42);
    --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.65);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--paper); color: var(--text);
    font-family: var(--font-sans);
    font-size: 15.5px;
    line-height: 1.72;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); border: 2px solid transparent; background-clip: content-box; }

  .svg-icon {
    width: 16px; height: 16px; flex-shrink: 0;
    stroke: currentColor; fill: none; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round;
    display: inline-block; vertical-align: middle;
  }
  .flag-svg {
    width: 16px; height: 12px; border-radius: 2px; flex-shrink: 0;
    display: inline-block; vertical-align: middle;
    box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.26);
  }
  .flag-svg.flag-lg { width: 20px; height: 14px; border-radius: 2.5px; }

  /* ==================== HEADER ==================== */
  header.topbar {
    position: fixed; top: 0; left: 0; right: 0;
    background: var(--topbar-bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    z-index: 40;
  }
  /* Subtle German tricolor hairline at top edge */
  .topbar-tricolor {
    height: 2px; width: 100%;
    background: linear-gradient(90deg, var(--de-black) 0 33.33%, var(--de-red) 33.33% 66.66%, var(--de-gold) 66.66% 100%);
    opacity: 0.92;
  }
  .topbar-main {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; gap: 12px;
  }
  .read-progress {
    position: absolute; bottom: -1px; left: 0; height: 2px; width: 100%;
    background: var(--accent); transform: scaleX(0); transform-origin: left;
    pointer-events: none;
  }

  .brand-group {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .sidebar-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0;
    background: transparent; border: 1px solid transparent;
    color: var(--text-muted); border-radius: 8px; cursor: pointer;
    transition: background .14s, color .14s, border-color .14s;
  }
  .sidebar-toggle:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

  .brand {
    display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
    text-decoration: none; color: var(--text); white-space: nowrap;
  }
  .brand-word {
    font-family: var(--font-serif); font-size: 23px; font-weight: 600;
    letter-spacing: -0.025em; line-height: 1;
    display: inline-flex; align-items: baseline;
  }
  .brand-sub {
    font-size: 12px; color: var(--text-muted); font-weight: 500;
    letter-spacing: 0.01em; padding-left: 10px; margin-left: 2px;
    border-left: 1px solid var(--border);
  }

  .top-controls {
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .lang-summary { gap: 8px; }
  .lang-summary-flags { display: inline-flex; gap: 3px; }
  .lang-summary-flags .flag-svg { width: 16px; height: 11px; border-radius: 2px; }
  .lang-menu .more-list { min-width: 244px; }
  .more-note { margin: 4px 11px 6px; font-size: 12.5px; line-height: 1.45; color: var(--text-muted); }
  .lang-pill .lang-check { margin-left: auto; color: var(--ok); visibility: hidden; }
  .lang-pill.active .lang-check { visibility: visible; }
  .lang-pill.active { color: var(--text); }

  .top-actions {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }

  /* Buttons */
  .top-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    font-family: var(--font-sans); font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .14s ease; white-space: nowrap; text-decoration: none;
    line-height: 1.25;
  }
  .top-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
  .top-btn.primary {
    background: var(--ink-btn); color: var(--ink-btn-text); border-color: var(--ink-btn);
  }
  .top-btn.primary:hover { background: var(--ink-btn-hover); border-color: var(--ink-btn-hover); color: var(--ink-btn-text); }
  .top-btn.ghost {
    background: transparent; border-color: transparent; color: var(--text-muted);
  }
  .top-btn.ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

  .badge {
    background: var(--accent); color: #fff;
    font-family: var(--font-mono); font-size: 11.5px; padding: 1px 6px;
    border-radius: 999px; font-weight: 600; line-height: 1.45;
  }
  .top-btn.primary .badge {
    background: rgba(255, 255, 255, 0.2); color: var(--ink-btn-text);
  }
  [data-theme="dark"] .top-btn.primary .badge {
    background: rgba(18, 19, 22, 0.16); color: var(--ink-btn-text);
  }
  .badge[hidden], .nav-pill-count[hidden] { display: none; }
  .badge.has-due,
  .top-btn.primary .badge.has-due,
  [data-theme="dark"] .top-btn.primary .badge.has-due {
    background: var(--accent); color: #fff;
  }
  .icon-btn {
    width: 34px; height: 34px; padding: 0; justify-content: center;
  }

  /* ==================== LAYOUT & SIDEBAR ==================== */
  .layout { display: flex; padding-top: var(--header-h); min-height: 100vh; }

  aside.sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0; width: var(--sidebar-w);
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 30;
    transition: transform .24s cubic-bezier(.22, 1, .36, 1);
  }
  body.sidebar-collapsed aside.sidebar {
    transform: translateX(-100%);
  }

  .sidebar-primary {
    padding: 12px 10px 8px;
    display: flex; flex-direction: column; gap: 2px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .primary-nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 9px;
    padding: 7.5px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    color: var(--text-secondary); text-decoration: none; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .primary-nav-item:hover { background: var(--surface-2); color: var(--text); }
  .primary-nav-item.active, .primary-nav-item[aria-current="page"] {
    background: var(--surface); color: var(--text);
    box-shadow: var(--shadow-xs); border: 1px solid var(--border);
    padding: 6.5px 9px;
  }
  .primary-nav-left { display: inline-flex; align-items: center; gap: 9px; }
  .link-btn .svg-icon { width: 13px; height: 13px; }
  .primary-nav-item .svg-icon { color: var(--text-muted); width: 15px; height: 15px; }
  .primary-nav-item.active .svg-icon, .primary-nav-item[aria-current="page"] .svg-icon { color: var(--accent); }
  .nav-pill-count {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    padding: 1px 6px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted);
  }
  .nav-pill-count.due { background: var(--accent-soft); color: var(--accent); }

  .sidebar-top { padding: 11px 12px 12px; border-bottom: 1px solid var(--border-subtle); }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-icon {
    position: absolute; left: 10px; color: var(--text-faint); pointer-events: none;
    width: 14px; height: 14px;
  }
  .search-input {
    width: 100%; padding: 7.5px 10px 7.5px 30px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-family: var(--font-sans); font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus { border-color: var(--text-muted); box-shadow: 0 0 0 3px var(--primary-soft); }
  .search-input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  .skip-link {
    position: fixed; left: 12px; top: -60px; z-index: 200;
    background: var(--ink-btn); color: var(--ink-btn-text); padding: 10px 14px; border-radius: 8px;
    font: 600 14px var(--font-sans); text-decoration: none; transition: top .16s ease-out;
  }
  .skip-link:focus { top: 10px; outline: 2px solid var(--primary); outline-offset: 2px; }
  #mainContainer:focus { outline: none; }
  :focus-visible { outline-color: var(--primary); }
  .top-btn:focus-visible, .sidebar-toggle:focus-visible, .lang-choice:focus-visible, .dx-key:focus-visible, .link-quiet:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  ::selection { background: var(--gold-soft); color: var(--text); }
  html { accent-color: var(--primary); caret-color: var(--accent); }

  .progress-mini { margin-top: 11px; font-size: 12px; color: var(--text-muted); }
  .progress-mini-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .progress-mini-row strong { font-family: var(--font-mono); font-size: 11px; color: var(--text); font-weight: 600; }
  .bar-track { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar-fill {
    height: 100%; width: 100%; background: var(--ok);
    border-radius: 99px; transform: scaleX(0); transform-origin: left;
    transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
  .nav-group { margin-bottom: 10px; }
  .nav-group-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); cursor: pointer; user-select: none;
    border-radius: 6px; transition: background .12s, color .12s;
  }
  .nav-group-hdr:hover { background: var(--surface-2); color: var(--text); }
  .nav-group-left { display: inline-flex; align-items: center; gap: 6px; }
  .nav-group-chev {
    width: 12px; height: 12px; color: var(--text-faint); transition: transform .15s ease;
  }
  .nav-group.collapsed .nav-group-chev { transform: rotate(-90deg); }
  .nav-group-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); font-weight: 500; }
  .nav-list { list-style: none; margin: 2px 0 0; padding: 0; }
  .nav-group.collapsed .nav-list { display: none; }

  .nav-item {
    position: relative; display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 9px; border-radius: 7px; font-size: 13px; line-height: 1.38;
    color: var(--text-secondary); cursor: pointer; text-decoration: none;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active {
    background: var(--surface); color: var(--text); font-weight: 600;
    box-shadow: var(--shadow-xs);
  }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2.5px;
    border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .nav-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5.5px;
    border: 1.5px solid var(--border-strong); background: transparent;
  }
  .nav-dot[data-st="●"], .nav-dot[data-st="✔"] {
    background: var(--ok); border-color: var(--ok);
  }
  .nav-dot[data-st="◐"] {
    background: var(--gold); border-color: var(--gold);
  }
  .nav-id {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    color: var(--text-faint); flex-shrink: 0; margin-top: 2px;
  }
  .nav-item.active .nav-id { color: var(--accent); font-weight: 600; }
  .nav-title {
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  .case-legend {
    padding: 7px 14px; border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);
    background: var(--surface-2);
  }
  .case-legend span { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; }

  .sidebar-footer {
    padding: 7px 10px; border-top: 1px solid var(--border);
    display: flex; gap: 4px; justify-content: space-between;
    background: var(--sidebar-bg);
  }
  .link-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-family: var(--font-sans); font-weight: 500;
    padding: 5px 8px; border-radius: 6px; font-size: 12px;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .12s, color .12s;
  }
  .link-btn:hover { background: var(--surface-2); color: var(--text); }

  .backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(12, 13, 16, 0.48);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: 25;
  }

  /* ==================== MAIN CONTENT ==================== */
  main.content {
    margin-left: var(--sidebar-w); flex: 1;
    padding: 36px 40px 104px;
    min-width: 0;
  }
  body.sidebar-collapsed main.content { margin-left: 0; }
  .container { max-width: 810px; margin: 0 auto; }

  /* ==================== WEB HOME VIEW ==================== */
  .home-hero {
    padding: 8px 0 30px;
    border-bottom: 1px solid var(--border);
  }
  .home-title {
    font-family: var(--font-serif); font-size: clamp(34px, 5.2vw, 50px);
    font-weight: 600; line-height: 1.08; letter-spacing: -0.03em;
    color: var(--text); margin: 6px 0 18px; max-width: 20ch; text-wrap: balance;
  }
  .home-title em {
    display: block; font-style: italic; font-weight: 400; color: var(--text-secondary);
  }
  .home-lead {
    font-size: 17px; line-height: 1.65; color: var(--text-secondary);
    max-width: 36em; margin: 0 0 26px;
  }
  .home-lead strong { color: var(--text); font-weight: 600; }
  .home-cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .top-btn.big { padding: 12px 18px; font-size: 14.5px; border-radius: 9px; white-space: normal; text-align: left; }
  .home-text-link {
    font-size: 14px; font-weight: 500; color: var(--text-secondary);
    text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px;
  }
  .home-text-link:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .home-today-note { margin: 16px 0 0; font-size: 13.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .lang-first {
    margin: 0 0 26px; padding: 18px 0 2px; border-top: 1px solid var(--border);
    max-width: 38em;
  }
  .lang-first-title { font-family: var(--font-serif); font-size: 19px; font-weight: 600; color: var(--text); margin: 0 0 4px; }
  .lang-first-body { font-size: 14px; line-height: 1.55; color: var(--text-muted); margin: 0 0 12px; }
  .lang-first-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .lang-choice {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border-strong); background: transparent; color: var(--text-secondary);
    font: 600 13.5px var(--font-sans);
    transition: background-color .14s, border-color .14s, color .14s;
  }
  .lang-choice .flag-svg { opacity: 0.45; transition: opacity .14s; }
  .lang-choice:hover { border-color: var(--text-muted); color: var(--text); }
  .lang-choice .lang-tick { width: 15px; height: 15px; margin-left: -2px; display: none; }
  .lang-choice.active { background: var(--ink-btn); border-color: var(--ink-btn); color: var(--ink-btn-text); }
  .lang-choice.active .lang-tick { display: inline-block; }
  .lang-choice.active:hover { color: var(--ink-btn-text); background: var(--ink-btn-hover); }
  .lang-choice.active .flag-svg { opacity: 1; }
  .lang-choice:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .home-section { padding: 34px 0; border-top: 1px solid var(--border); }
  .home-hero { padding: 8px 0 34px; }
  .home-section:last-child { padding-bottom: 8px; }
  .home-sec-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .home-sec-title {
    font-family: var(--font-serif); font-size: 24px; font-weight: 600;
    letter-spacing: -0.018em; margin: 0; color: var(--text);
  }
  .home-sec-link {
    font-size: 13px; font-weight: 600; color: var(--primary);
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .home-sec-link:hover { color: var(--accent); }

  /* Today's plan: a timed, ruled list */
  .plan { list-style: none; margin: 0; padding: 0; }
  .plan-step {
    display: grid; grid-template-columns: 76px 1fr; gap: 16px;
    padding: 14px 0; border-top: 1px solid var(--border-subtle);
  }
  .plan-step:first-child { border-top: 0; }
  .plan-min {
    font-family: var(--font-serif); font-size: 17px; font-style: italic; color: var(--accent);
    font-variant-numeric: tabular-nums; padding-top: 1px;
  }
  .plan-title { margin: 0 0 2px; font-size: 15.5px; font-weight: 650; color: var(--text); }
  .plan-title a { color: inherit; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .plan-title a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .plan-body { margin: 0; font-size: 14px; line-height: 1.55; color: var(--text-muted); max-width: 38em; }
  .plan-body a { color: var(--primary); font-weight: 600; }
  .plan-step.quiet .plan-min { color: var(--text-muted); }

  /* Contents: ruled table of contents */
  .toc { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--text); }
  .toc-row { border-bottom: 1px solid var(--border); }
  .toc-row a {
    display: grid; grid-template-columns: 42px minmax(0, 1fr) 128px 140px; gap: 18px; align-items: center;
    padding: 16px 4px; text-decoration: none; color: inherit;
    transition: background-color .14s;
  }
  .toc-row a:hover { background: var(--bg); }
  .toc-row a:hover .toc-cta { color: var(--accent); }
  .level-code {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; text-align: center;
    padding: 3px 0; border-radius: 5px; letter-spacing: 0.04em;
  }
  .level-code.a1 { background: var(--ok-soft); color: var(--ok); }
  .level-code.a2 { background: var(--primary-soft); color: var(--primary); }
  .level-code.b1 { background: var(--accent-soft); color: var(--accent); }
  .toc-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .toc-title { font-family: var(--font-serif); font-size: 19px; font-weight: 600; color: var(--text); }
  .toc-desc { font-size: 13.5px; line-height: 1.5; color: var(--text-muted); }
  .toc-progress { display: flex; flex-direction: column; gap: 6px; }
  .toc-count { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .level-bar { height: 3px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .level-bar > span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transform-origin: left; }
  .toc-cta {
    display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px;
    font-size: 13.5px; font-weight: 600; color: var(--text);
  }

  .also-list { list-style: none; margin: 14px 0 0; padding: 0; columns: 2 300px; column-gap: 40px; }
  .also-list li { break-inside: avoid; padding: 10px 0 12px; border-top: 1px solid var(--border-subtle); }
  .also-list a {
    display: inline-block; margin-bottom: 2px; font-weight: 650; font-size: 14.5px; color: var(--text);
    text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px;
  }
  .also-list a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .also-list span { display: block; font-size: 13.5px; line-height: 1.5; color: var(--text-muted); }

  .home-colophon { margin: 0; font-size: 13px; line-height: 1.65; color: var(--text-muted); max-width: 44em; }
  .home-colophon a { color: var(--text-secondary); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }

  /* ==================== LESSON TOOLBAR ==================== */
  .lesson-toolbar {
    padding: 0 0 14px; margin-bottom: 26px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .status-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .status-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .status-seg {
    display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px;
    background: var(--surface-2); border: 1px solid var(--border-subtle);
  }
  .status-btn {
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; white-space: nowrap;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
    transition: background-color .14s, color .14s, border-color .14s;
  }
  .status-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  .more-menu { position: relative; flex-shrink: 0; }
  .more-menu > summary { list-style: none; }
  .more-menu > summary::-webkit-details-marker { display: none; }
  .more-menu[open] > summary { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
  .more-list {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 268px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-md); padding: 5px;
  }
  .more-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 11px; border: 0; border-radius: 7px; background: transparent;
    font: 500 13.5px/1.3 var(--font-sans); color: var(--text-secondary);
    text-align: left; text-decoration: none; cursor: pointer;
  }
  .more-item .svg-icon { color: var(--text-muted); flex-shrink: 0; }
  .more-item:hover, .more-item:focus-visible { background: var(--surface-2); color: var(--text); outline: none; }

  /* ==================== LESSON DIAGNOSTIC ==================== */
  article.md .dx-static { display: none; }
  .dx {
    margin: 6px 0 8px; padding: 20px 22px 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-xs);
  }
  .dx p { margin: 0; }
  .dx .dx-lede { font-size: 15px; line-height: 1.6; color: var(--text-secondary); max-width: 36em; }
  .dx .dx-last { margin-top: 8px; font-size: 13.5px; color: var(--text-muted); }
  .dx-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
  .dx-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .dx-count { font-size: 12.5px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .dx-pips { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
  article.md .dx-pips li { margin: 0; padding: 0; }
  .dx-pips li { width: 18px; height: 4px; border-radius: 2px; background: var(--border); }
  .dx-pips li.now { background: var(--text-muted); }
  .dx-pips li.ok { background: var(--ok); }
  .dx-pips li.miss { background: var(--accent); }
  .dx-prompt {
    display: block; font-family: var(--font-serif); font-size: 21px; line-height: 1.4;
    color: var(--text); margin-bottom: 14px; letter-spacing: -0.005em;
  }
  .dx .dx-prompt-sm { font-size: 16px; color: var(--text-secondary); margin-bottom: 10px; }
  .dx-row { display: flex; gap: 8px; }
  .dx-input {
    flex: 1; min-width: 0; font: 500 16px/1.3 var(--font-sans); color: var(--text);
    background: var(--paper); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 10px 12px;
  }
  .dx-input::placeholder { color: var(--text-muted); }
  .dx-input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  .dx-keys { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .dx-key {
    min-width: 32px; height: 30px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary);
    font: 500 14px/1 var(--font-sans);
  }
  .dx-key:hover { background: var(--surface-2); color: var(--text); }
  .link-quiet {
    margin-top: 12px; padding: 4px 0; border: 0; background: none; cursor: pointer;
    font: 500 13px var(--font-sans); color: var(--text-muted);
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong);
  }
  .link-quiet:hover { color: var(--text); }
  .dx-verdict { border-radius: 9px; padding: 14px 16px; }
  .dx-verdict.ok { background: var(--ok-soft); color: var(--text); }
  .dx-verdict.ok strong { color: var(--ok); margin-right: 6px; }
  .dx-verdict.miss { background: var(--accent-soft); border: 1px solid var(--accent-border); }
  .dx-verdict-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .dx .dx-answer { font-family: var(--font-serif); font-size: 21px; color: var(--text); line-height: 1.4; }
  .dx .dx-you, .practice-panel .dx-you { margin: 6px 0 0; font-size: 13.5px; color: var(--text-muted); }
  .practice-panel .dx-verdict { margin: 4px 0 16px; }
  .practice-panel h2.dx-prompt { font-family: var(--font-serif); font-size: 22px; font-weight: 500; margin: 0 0 6px; }
  .practice-panel .dx-keys { margin: -4px 0 12px; }
  .practice-panel .dx-rule { margin: 10px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--text-secondary); }
  .practice-panel .dx-accepted { font-size: 14px; color: var(--text-muted); }
  .practice-panel .dx-retry label { font-weight: 600; }
  .dx .dx-you span, .practice-panel .dx-you span { text-decoration: line-through; text-decoration-color: var(--accent); color: var(--text-secondary); }
  .dx .dx-honest { margin-top: 10px; font-size: 13.5px; color: var(--text-muted); }
  article.md .dx-peek { margin: 12px 0 0; background: var(--bg); }
  article.md .dx-peek > summary { font-size: 13.5px; padding: 10px 14px; }
  article.md .dx-peek figure.diagram { margin: 0; border: 0; border-radius: 0; }
  article.md .dx-peek .link-quiet { margin: 6px 14px 10px; }
  .dx .dx-honest:empty { display: none; }
  .dx-score { display: flex; gap: 18px; align-items: center; }
  .dx-score-num {
    font-family: var(--font-serif); font-size: 52px; font-weight: 600; line-height: 1;
    color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .dx-score-num span { font-size: 24px; color: var(--text-muted); font-weight: 500; }
  .dx-score.pass .dx-score-num { color: var(--ok); }
  .dx .dx-score-title { font-family: var(--font-serif); font-size: 20px; font-weight: 600; color: var(--text); }
  .dx .dx-score-sub { margin-top: 4px; font-size: 14px; color: var(--text-secondary); max-width: 33em; }
  article.md .dx-missed { margin: 16px 0 0; background: var(--bg); }
  article.md .dx-missed summary { font-size: 13.5px; padding: 10px 14px; }
  .dx-missed ol { margin: 0; padding: 12px 16px 6px 36px !important; }
  .dx-missed li { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .dx-missed-a { color: var(--ok); font-weight: 600; }
  .status-btn:hover { background: var(--surface-2); color: var(--text); }
  .status-btn.active { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
  .status-btn.active[data-status="◐"] { background: var(--gold-soft); color: var(--gold); border-color: var(--gold-border); }
  .status-btn.active[data-status="☐"] { background: var(--surface); color: var(--text); border-color: var(--border-strong); }

  /* ==================== LESSON MASTHEAD ==================== */
  .lesson-masthead {
    padding-bottom: 24px; margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .masthead-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-bottom: 14px; font-size: 12.5px; color: var(--text-muted);
  }
  .meta-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    padding: 2.5px 8px; border-radius: 5px;
    background: var(--surface-2); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .meta-pill.level-A1 { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
  .meta-pill.level-A2 { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-border); }
  .meta-pill.level-B1 { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .meta-sep { color: var(--border-strong); }
  .masthead-meta a {
    color: var(--primary); text-decoration: none; font-weight: 500;
  }
  .lesson-masthead h1 {
    font-family: var(--font-serif); font-size: clamp(28px, 4vw, 36px);
    font-weight: 600; line-height: 1.18; letter-spacing: -0.025em;
    margin: 0 0 16px; color: var(--text);
  }
  .cando-box {
    border: 1px solid var(--ok-border);
    background: var(--ok-soft);
    padding: 11px 16px; border-radius: 8px;
    font-size: 14.5px; line-height: 1.6; color: var(--text-secondary);
  }
  .cando-label {
    display: block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ok);
    margin-bottom: 3px;
  }

  /* ==================== FLASHCARDS & PRACTICE ==================== */
  .fc-panel {
    background: var(--paper);
    padding: 4px 0;
  }
  .fc-panel h1 {
    font-family: var(--font-serif); font-size: clamp(26px, 4vw, 34px); font-weight: 600;
    letter-spacing: -0.025em; margin: 0; line-height: 1.18;
  }
  .practice-panel h2 {
    font-family: var(--font-serif); font-size: 21px; line-height: 1.3;
    margin: 22px 0 8px;
  }
  .practice-panel h3 { margin: 18px 0 4px; font-size: 15.5px; }
  .practice-panel p { margin: 8px 0 12px; color: var(--text-secondary); }
  .practice-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .practice-actions:empty { display: none; }
  .practice-panel .top-btn { text-decoration: none; }
  .practice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; margin-top: 18px; }
  .practice-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; background: var(--surface);
    transition: border-color .15s;
  }
  .practice-card:hover { border-color: var(--border-strong); }
  .practice-card h2 { margin-top: 0; font-size: 19px; }
  .practice-card .top-btn { margin: 4px 8px 6px 0; }
  .practice-panel form { margin-bottom: 14px; }
  .practice-panel label { display: block; margin: 12px 0; font-weight: 600; font-size: 14px; color: var(--text); }
  .practice-panel input[type="text"], .practice-panel textarea, .practice-panel select {
    display: block; width: 100%; margin-top: 5px; padding: 9px 12px; font: inherit; font-weight: 400;
    color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  .practice-panel [readonly] { background: var(--surface-2); }
  .practice-panel textarea { resize: vertical; }
  .practice-panel input:focus-visible, .practice-panel textarea:focus-visible, .practice-panel select:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .practice-results { padding-left: 22px; }
  .practice-results > li, .practice-reviews > li { margin: 0 0 14px; }
  .practice-panel fieldset { min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .practice-panel fieldset label, .practice-panel .practice-check { display: inline-flex; gap: 6px; margin-right: 16px; font-weight: 500; }
  .practice-panel audio { display: block; max-width: 100%; margin: 10px 0; }
  .practice-status { color: var(--accent); font-weight: 500; }
  .practice-panel audio[hidden], .practice-status:empty { display: none; }
  .practice-panel summary { cursor: pointer; font-weight: 600; }
  .practice-clock { display: inline-block; font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin: 8px 10px 12px 0; font-weight: 600; }

  /* ==================== EDITORIAL READING SHEET ==================== */
  article.md {
    color: var(--text);
  }
  article.md > h1:first-child {
    font-family: var(--font-serif); font-size: clamp(28px, 4vw, 36px);
    font-weight: 600; line-height: 1.18; letter-spacing: -0.025em;
    margin: 0 0 18px; color: var(--text);
  }
  article.md h2 {
    font-family: var(--font-serif); font-size: 22.5px; font-weight: 600;
    margin: 40px 0 15px; padding-top: 22px;
    border-top: 1px solid var(--border); letter-spacing: -0.016em;
    color: var(--text); display: flex; align-items: baseline; gap: 10px;
  }
  article.md.is-lesson .lesson-masthead + h2 {
    margin-top: 4px; padding-top: 0; border-top: none;
  }
  article.md h2:first-of-type:not(.lesson-masthead + h2) { margin-top: 24px; }
  .sec-num {
    font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.02em; flex-shrink: 0;
    background: var(--accent-soft); padding: 2px 7px; border-radius: 5px;
    transform: translateY(-2px);
  }
  article.md h3 {
    font-family: var(--font-sans); font-size: 15.5px; font-weight: 700;
    margin: 26px 0 9px; color: var(--text); letter-spacing: -0.008em;
  }
  article.md h4 {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin: 22px 0 8px;
  }
  article.md p { margin: 0 0 15px; color: var(--text-secondary); }
  /* Reading measure: about 70 characters of prose; diagrams and tables may use the full column */
  article.md .contrast-group { max-width: 44em; }
  article.md > p, article.md > ul, article.md > ol, article.md > blockquote,
  article.md > h3, article.md .details-body > p,
  article.md .details-body > ul, article.md .details-body > ol { max-width: 34em; }
  .cando-box, .dx .dx-lede { max-width: 40em; }
  /* Lesson prose is set like a book; controls, tables and callouts keep the sans */
  article.md.is-lesson > p, article.md.is-lesson > ul, article.md.is-lesson > ol,
  article.md.is-lesson > blockquote, article.md.is-lesson .details-body > p,
  article.md.is-lesson .details-body > ul, article.md.is-lesson .details-body > ol,
  article.md:not(.is-lesson) > p, article.md:not(.is-lesson) > ul, article.md:not(.is-lesson) > ol {
    font-family: var(--font-serif); font-size: 18.5px; line-height: 1.62;
    font-optical-sizing: auto; font-variant-numeric: oldstyle-nums proportional-nums;
  }
  article.md.is-lesson > p strong, article.md.is-lesson > ul strong, article.md.is-lesson > ol strong,
  article.md:not(.is-lesson) > p strong { font-weight: 650; }
  article.md li::marker { font-family: var(--font-serif); font-size: 0.92em; }
  article.md > p code, article.md > ul code, article.md > ol code, article.md .details-body code { font-size: 0.76em; }
  article.md h2, .lesson-masthead h1 { text-wrap: balance; }
  article.md p, article.md li { text-wrap: pretty; }
  article.md p strong { color: var(--text); font-weight: 650; }
  article.md ul, article.md ol { margin: 0 0 18px; padding-left: 22px; color: var(--text-secondary); }
  article.md li { margin-bottom: 7px; padding-left: 3px; }
  article.md li::marker { color: var(--text-faint); font-family: var(--font-mono); font-size: 0.88em; }
  article.md li strong { color: var(--text); }
  article.md hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  article.md a {
    color: var(--primary); text-decoration: underline;
    text-decoration-color: var(--primary-border); text-underline-offset: 3px;
    font-weight: 500; transition: text-decoration-color .15s, color .15s;
  }
  .masthead-meta a:hover { color: var(--accent); text-decoration: underline; }
  .home-colophon a:hover { color: var(--accent); }
  article.md a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  article.md del { color: var(--text-faint); text-decoration-color: var(--accent); }

  article.md code {
    background: var(--code-bg); color: var(--code-text);
    padding: 1.5px 5.5px; border-radius: 4.5px;
    font-family: var(--font-mono); font-size: 0.84em; font-weight: 500;
  }
  /* Grammar diagrams: text panels, bracket grids (Satzklammer), paradigms */
  article.md pre {
    background: var(--diagram-bg); color: var(--diagram-text);
    border: 1px solid var(--diagram-border);
    padding: 16px 18px; border-radius: var(--radius); overflow-x: auto;
    margin: 18px 0 24px; line-height: 1.66; max-width: 100%;
  }
  article.md pre code {
    background: transparent; padding: 0; color: inherit;
    font-size: 12px; font-weight: 450;
  }
  article.md figure.diagram {
    margin: 20px 0 28px; max-width: 100%;
    background: var(--diagram-bg); color: var(--diagram-text);
    border: 1px solid var(--diagram-border); border-radius: var(--radius);
    overflow: hidden;
  }
  article.md figure.diagram > * + * { border-top: 1px solid var(--diagram-border); }
  article.md figure.diagram .dia-text {
    padding: 14px 18px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7;
  }
  .dl {
    display: block; white-space: pre-wrap; overflow-wrap: anywhere;
    padding-left: calc(var(--in, 0ch) + 3ch); text-indent: -3ch;
  }
  .dl-gap { height: 0.85em; }
  .dia-label { font-weight: 700; color: var(--text); letter-spacing: 0.03em; }
  .dia-bad { color: var(--accent); font-weight: 700; }
  .dia-good { color: var(--ok); font-weight: 700; }

  .dia-scroll {
    overflow-x: auto; overscroll-behavior-x: contain;
    background:
      linear-gradient(90deg, var(--diagram-bg) 40%, transparent) left / 28px 100% no-repeat local,
      linear-gradient(270deg, var(--diagram-bg) 40%, transparent) right / 28px 100% no-repeat local,
      linear-gradient(90deg, var(--scroll-shade), transparent) left / 12px 100% no-repeat scroll,
      linear-gradient(270deg, var(--scroll-shade), transparent) right / 12px 100% no-repeat scroll;
  }
  article.md .dia-scroll table {
    width: auto; min-width: 100%; border-collapse: separate; border-spacing: 0;
    font-size: 14px; margin: 0;
  }
  article.md .dia-scroll th, article.md .dia-scroll td {
    border: 0; padding: 7px 14px; white-space: nowrap; vertical-align: baseline;
    background: transparent;
  }
  article.md .dia-scroll tbody tr:hover { background: transparent; }
  article.md .dia-scroll thead th {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted);
    padding-top: 16px; padding-bottom: 9px;
  }

  /* Satzklammer: the verb bracket is drawn across the column heads */
  article.md .klammer thead th { position: relative; }
  article.md .klammer thead th.k-open,
  article.md .klammer thead th.k-mid,
  article.md .klammer thead th.k-close { border-top: 2px solid var(--accent); }
  article.md .klammer thead th.k-open { border-left: 2px solid var(--accent); border-top-left-radius: 7px; }
  article.md .klammer thead th.k-close { border-right: 2px solid var(--accent); border-top-right-radius: 7px; }
  article.md .klammer thead th.k-verb { color: var(--accent); }
  article.md .klammer td.k-verb, article.md .klammer th.k-verb { background: var(--accent-soft); }
  article.md .klammer td.k-verb { color: var(--text); font-weight: 650; }
  article.md .klammer td { color: var(--text-secondary); }
  article.md .klammer td.k-note {
    font-size: 12.5px; color: var(--text-muted); font-style: italic;
  }
  article.md .klammer tr.k-gloss td {
    font-family: var(--font-serif); font-style: italic; font-size: 14.5px;
    color: var(--text-muted); padding-top: 0; padding-bottom: 12px; white-space: normal;
  }
  article.md .klammer tbody tr:last-child td { padding-bottom: 14px; }

  /* Paradigm tables: gender columns, case-tinted when the block names a case */
  article.md .paradigm { --case: var(--text-muted); }
  article.md .paradigm.case-nom { --case: var(--case-nom); }
  article.md .paradigm.case-akk { --case: var(--case-akk); }
  article.md .paradigm.case-dat { --case: var(--case-dat); }
  article.md .paradigm.case-gen { --case: var(--case-gen); }
  article.md .paradigm thead th { border-bottom: 1.5px solid var(--case); }
  article.md .paradigm thead th.p-title {
    font-family: var(--font-sans); text-transform: none; letter-spacing: 0;
    font-size: 13px; font-weight: 700; color: var(--text);
  }
  article.md .paradigm tbody th {
    font-family: var(--font-sans); font-weight: 500; font-size: 13px;
    color: var(--text-muted); text-align: left; text-transform: none; letter-spacing: 0;
  }
  article.md .paradigm thead th:not(.p-title) { text-transform: none; font-size: 12.5px; color: var(--text); }
  article.md .paradigm tbody td { color: var(--text); font-weight: 500; white-space: normal; min-width: 8ch; }
  article.md .paradigm tr.p-span td { color: var(--text-secondary); font-weight: 450; }
  article.md .paradigm tbody th { white-space: normal; min-width: 12ch; }
  article.md .paradigm tbody tr + tr > * { border-top: 1px solid var(--diagram-border); }
  article.md .paradigm tr.p-cont td { color: var(--text-muted); font-style: italic; font-weight: 400; }

  article.md blockquote {
    margin: 18px 0 22px; padding: 14px 18px;
    border: 1px solid var(--gold-border);
    background: var(--gold-soft); border-radius: 8px;
    color: var(--text-secondary);
  }
  article.md blockquote p { margin-bottom: 8px; }
  article.md blockquote p:last-child { margin-bottom: 0; }

  /* Structured Multilingual Contrast Callouts */
  .contrast-group {
    display: flex; flex-direction: column; gap: 8px; margin: 20px 0 24px;
  }
  article.md .contrast-box {
    border: 1px solid var(--border);
    background: var(--primary-soft);
    padding: 13px 16px; border-radius: 9px;
    font-size: 14.5px; line-height: 1.65;
    color: var(--text-secondary);
  }
  article.md .contrast-box[data-lang="pt-BR"] { border-color: color-mix(in srgb, var(--c-pt-border) 30%, transparent); background: var(--c-pt-bg); }
  article.md .contrast-box[data-lang="es"]    { border-color: color-mix(in srgb, var(--c-es-border) 30%, transparent); background: var(--c-es-bg); }
  article.md .contrast-box[data-lang="fr"]    { border-color: color-mix(in srgb, var(--c-fr-border) 30%, transparent); background: var(--c-fr-bg); }
  article.md .contrast-box[data-lang="en"]    { border-color: color-mix(in srgb, var(--c-en-border) 30%, transparent); background: var(--c-en-bg); }
  article.md .contrast-box strong { color: var(--text); }
  article.md .contrast-box.hidden-lang { display: none; }
  .contrast-hdr {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text); margin-bottom: 5px;
  }
  .contrast-body { display: block; }

  /* Swiss Book Typography Tables */
  article.md .table-wrap {
    overflow-x: auto; margin: 18px 0 26px;
    border-top: 1.5px solid var(--border-strong);
    border-bottom: 1.5px solid var(--border-strong);
  }
  article.md table {
    width: 100%; border-collapse: collapse; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  article.md th, article.md td {
    border-bottom: 1px solid var(--border-subtle); padding: 10px 13px;
    text-align: left; vertical-align: top;
  }
  article.md tr:last-child td { border-bottom: none; }
  article.md th {
    background: var(--bg); font-family: var(--font-mono);
    font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  article.md tbody tr:hover { background: var(--bg); }

  /* Collapsible Answer Key */
  article.md details {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg); margin: 16px 0 24px; overflow: hidden;
    transition: border-color .15s;
  }
  article.md details:hover { border-color: var(--border-strong); }
  article.md details summary {
    cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px;
    color: var(--text); list-style: none; user-select: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); transition: background .15s;
  }
  article.md details summary::-webkit-details-marker { display: none; }
  article.md details summary:hover { background: var(--surface-2); }
  .summary-chev {
    width: 16px; height: 16px; color: var(--text-muted);
    transition: transform .18s ease; flex-shrink: 0;
  }
  article.md details[open] .summary-chev { transform: rotate(90deg); color: var(--accent); }
  article.md details[open] summary { border-bottom: 1px solid var(--border); }
  article.md details > .details-body { padding: 18px 20px 6px; }

  .case-key {
    display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0;
    font-size: 13px; color: var(--text-muted);
  }
  .case-key > div { display: inline-flex; align-items: baseline; gap: 6px; }
  .case-key dt { font-weight: 700; }
  .case-key dd { margin: 0; }

  /* Case symbol dual-coding */
  .sym-nom { color: var(--case-nom); font-weight: 700; }
  .sym-akk { color: var(--case-akk); font-weight: 700; }
  .sym-dat { color: var(--case-dat); font-weight: 700; }
  .sym-gen { color: var(--case-gen); font-weight: 700; }

  .lesson-footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 38px; padding-top: 22px; border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  /* ==================== FLASHCARDS STUDIO ==================== */
  .fc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px 16px; flex-wrap: wrap; }
  .fc-summary { margin: 6px 0 18px; font-size: 14.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .fc-summary strong { color: var(--text); font-weight: 650; }
  .fc-tabs { margin: 10px 0 16px; }
  .fc-tabs .status-btn.active { background: var(--surface); color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow-xs); }
  .fc-wide { width: 100%; justify-content: center; padding: 12px; font-size: 14px; }
  .grade-q { margin: 16px 0 0; font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }
  .fc-add { margin-top: 22px; border-top: 1px solid var(--border); }
  .fc-add > summary {
    display: flex; align-items: center; gap: 8px; padding: 14px 0; cursor: pointer; list-style: none;
    font-size: 14px; font-weight: 600; color: var(--text-secondary);
  }
  .fc-add > summary::-webkit-details-marker { display: none; }
  .fc-add[open] .summary-chev { transform: rotate(90deg); }
  .fc-add > summary:hover { color: var(--text); }

  .flashcard {
    position: relative; overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    padding: 32px 30px 26px; min-height: 255px; display: flex; flex-direction: column;
    justify-content: space-between; box-shadow: var(--shadow-sm); margin: 18px 0;
  }
  .flashcard::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--primary);
  }
  .flashcard[data-level="A1"]::before { background: var(--ok); }
  .flashcard[data-level="A2"]::before { background: var(--primary); }
  .flashcard[data-level="B1"]::before { background: var(--accent); }

  .fc-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
    margin-bottom: 20px; gap: 8px; flex-wrap: wrap;
  }
  .fc-tag {
    background: var(--surface-2); padding: 3px 8px; border-radius: 5px;
    border: 1px solid var(--border); color: var(--text-secondary); font-weight: 500;
  }
  .fc-q {
    font-family: var(--font-serif); font-size: 22.5px; font-weight: 500;
    line-height: 1.46; color: var(--text); margin-bottom: 20px;
  }
  .fc-a {
    border-top: 1px dashed var(--border-strong); padding-top: 18px; margin-top: 14px;
    font-family: var(--font-serif); font-size: 20px; color: var(--text); font-weight: 500; line-height: 1.5;
    animation: fadeUp .22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeUp {
    from { opacity: 0.35; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
  .grade-btn {
    border: 1px solid var(--border); border-radius: 9px; padding: 11px 8px;
    background: var(--bg); color: var(--text); cursor: pointer;
    font-family: var(--font-sans); font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px;
    transition: all .14s ease;
  }
  .grade-btn small { font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .grade-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-xs); }
  .grade-btn.g0 { border-color: var(--accent-border); color: var(--accent); }
  .grade-btn.g0:hover { background: var(--accent-soft); }
  .grade-btn.g1 { border-color: var(--gold-border); color: var(--gold); }
  .grade-btn.g1:hover { background: var(--gold-soft); }
  .grade-btn.g2 { border-color: var(--ok-border); color: var(--ok); }
  .grade-btn.g2:hover { background: var(--ok-soft); }
  .grade-btn.g3 { border-color: var(--primary-border); color: var(--primary); }
  .grade-btn.g3:hover { background: var(--primary-soft); }

  .kbd {
    font-family: var(--font-mono); font-size: 11.5px; padding: 1px 5px;
    border-radius: 4px; border: 1px solid currentColor; opacity: .65; margin-left: 4px;
  }

  .fc-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  select.select {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: var(--font-sans);
    font-size: 13px; max-width: 100%; outline: none;
  }
  select.select:focus { border-color: var(--text-muted); }

  .fc-empty {
    padding: 28px 28px 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; margin-top: 6px;
  }
  .fc-empty-title {
    margin: 0 0 6px; font-family: var(--font-serif); font-size: 28px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--text);
  }
  .fc-empty.done .fc-empty-title { color: var(--ok); animation: settle .6s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes settle {
    from { opacity: 0; letter-spacing: 0.04em; filter: blur(3px); }
    to   { opacity: 1; letter-spacing: -0.02em; filter: blur(0); }
  }
  .fc-empty-body { margin: 0; font-size: 15px; line-height: 1.6; color: var(--text-secondary); max-width: 34em; }
  @media (prefers-reduced-motion: reduce) {
    .fc-a, .fc-empty.done .fc-empty-title { animation: none; }
    * { scroll-behavior: auto !important; }
  }

  .notice {
    background: var(--gold-soft); border: 1px solid var(--gold-border); color: var(--text);
    padding: 16px 20px; border-radius: var(--radius); margin-bottom: 18px; font-size: 14.5px;
  }
  .toast {
    position: fixed; bottom: 22px; right: 22px;
    background: var(--ink-btn); color: var(--ink-btn-text);
    padding: 10px 16px; border-radius: 9px; font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px);
    transition: all .2s ease; pointer-events: none; z-index: 99;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ==================== RESPONSIVE: IPAD & TABLET (<= 1024px) ==================== */
  @media (max-width: 1024px) {
    .brand-sub { display: none; }
    aside.sidebar {
      transform: translateX(-100%);
      box-shadow: var(--shadow-lg);
    }
    aside.sidebar.drawer-open { transform: translateX(0); }
    .backdrop.open { display: block; }
    main.content, body.sidebar-collapsed main.content { margin-left: 0; padding: 28px 28px 88px; }
  }

  /* ==================== RESPONSIVE: IPHONE & MOBILE (<= 720px) ==================== */
  @media (max-width: 720px) {
    :root { --header-h: 56px; }
    .topbar-main { padding: 0 10px 0 8px; gap: 8px; }
    .brand-group { gap: 4px; }
    .brand-word { font-size: 21px; }
    .top-controls { gap: 6px; }
    .top-actions { gap: 6px; }
    .lang-summary-label { display: none; }
    .lang-summary { padding: 0 10px; height: 44px; }
    .top-actions .top-btn { height: 44px; padding: 0 12px; font-size: 13px; }
    .top-actions .icon-btn, .sidebar-toggle { width: 44px; height: 44px; padding: 0; }
    .lang-menu .more-list { position: fixed; left: 10px; right: 10px; top: calc(var(--header-h) + 4px); min-width: 0; }
    .lang-menu .more-item { padding: 12px 11px; }

    main.content { padding: 22px 16px 76px; }
    .toc-row a { grid-template-columns: 38px minmax(0, 1fr); gap: 6px 14px; padding: 14px 2px; }
    .toc-progress, .toc-cta { grid-column: 2; }
    .toc-cta { justify-content: flex-start; }
    .plan-step { grid-template-columns: 58px 1fr; gap: 12px; }
    .top-btn.big { width: 100%; justify-content: space-between; }
    .top-actions #fcNavBtn > span:not(.badge) { display: none; }
    .fc-empty { padding: 22px 18px 18px; }
    .fc-tabs { display: flex; }
    .fc-tabs .status-btn { flex: 1; }
    .grade-row { grid-template-columns: repeat(2, 1fr); }
    .flashcard { padding: 22px 18px; }
    article.md pre { padding: 15px 14px; font-size: 12.5px; }
    .lesson-toolbar { gap: 8px; }
    .status-label { display: none; }
    .status-group, .status-seg { flex: 1; }
    .status-btn { flex: 1; padding: 9px 4px; font-size: 12.5px; }
    .more-menu > summary.icon-btn { width: 42px; height: 42px; }
    .dx { padding: 16px 14px 14px; margin-left: -4px; margin-right: -4px; }
    .dx-prompt, .dx .dx-answer { font-size: 19px; }
    .dx-input { font-size: 17px; }
    .dx-row .top-btn { padding: 0 16px; }
    .dx-key { min-width: 38px; height: 36px; }
    .dx-score-num { font-size: 44px; }
  }
  @media (max-width: 560px) {
    article.md .paradigm, article.md .paradigm tbody, article.md .paradigm tr { display: block; min-width: 0; width: 100%; }
    article.md .paradigm thead tr { display: block; }
    article.md .paradigm thead th:not(.p-title) { display: none; }
    article.md .paradigm thead th.p-title { display: block; padding: 14px 16px 10px; }
    article.md .paradigm thead th.p-title:empty { display: none; }
    article.md .paradigm tbody tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px 16px 12px; gap: 4px 14px; }
    article.md .paradigm tbody tr + tr > * { border-top: 0; }
    article.md .paradigm tbody tr + tr { border-top: 1px solid var(--diagram-border); }
    article.md .paradigm tbody th, article.md .paradigm tbody td { display: block; padding: 0; min-width: 0; }
    article.md .paradigm tbody th { grid-column: 1 / -1; padding-bottom: 4px; }
    article.md .paradigm tbody td::before {
      content: attr(data-g); display: inline-block; min-width: 2.6ch; margin-right: 6px;
      font: 600 11.5px var(--font-mono); color: var(--text-muted);
    }
    article.md .paradigm tr.p-span td, article.md .paradigm tr.p-cont td { grid-column: 1 / -1; }
    article.md .paradigm td:not([data-g])::before, article.md .paradigm td[data-g=""]::before { display: none; }
    article.md .paradigm td.p-blank { display: none; }
    article.md .klammer td.k-note { white-space: normal; min-width: 18ch; }
  }

  /* ==================== PRINT ==================== */
  @media print {
    header.topbar, aside.sidebar, .backdrop, .lesson-toolbar, .lesson-footer, .toast, .doc-print-bar {
      display: none;
    }
    html, body, [data-theme="dark"] body {
      background: #fff; color: #111; font-size: 11pt; line-height: 1.55;
    }
    .layout { display: block; padding-top: 0; }
    main.content, body.sidebar-collapsed main.content { margin-left: 0; padding: 0; }
    .container { max-width: 100%; }

  function addDaysISO(days) {
    const d = new Date();

  function isRecord(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }

  function isScheduleRow(id, row) {
    if (!isRecord(row) || row.id !== id || !LESSON_IDS.has(row.topic) || !id.startsWith(`${row.topic}-`)) return false;
    if (!/^(?:A[12]|B1)-\d{2}-(?:[a-zA-Z]+(?:-[a-zA-Z]+)*-)?\d{2,}$/.test(id)) return false;
    if (typeof row.due !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(row.due)) return false;
    const date = new Date(row.due);
    return Number.isFinite(date.valueOf()) && date.toISOString().slice(0, 10) === row.due
      && Number.isInteger(row.step) && row.step >= 0 && row.step < LADDER.length
      && Number.isSafeInteger(row.reviews) && row.reviews >= 0
      && Number.isSafeInteger(row.correct) && row.correct >= 0 && row.correct <= row.reviews;
  }

  function normalizeState(candidate, fallback, strict = false) {
    if (!isRecord(candidate)) throw new Error("Invalid progress data");
    const next = { ...fallback };
    const validators = {
      langs: value => Array.isArray(value) && value.length > 0 && value.every(lang => LANGUAGES.includes(lang)),
      theme: value => value === "light" || value === "dark",
      sidebarCollapsed: value => typeof value === "boolean",
      progress: (id, status) => LESSON_IDS.has(id) && STATUSES.includes(status),
      schedule: isScheduleRow,
      collapsed: (key, value) => SIDEBAR_GROUPS.includes(key) && typeof value === "boolean",
      diagnostics: (id, value) => LESSON_IDS.has(id) && isRecord(value) &&
        Number.isInteger(value.score) && Number.isInteger(value.total) &&
        value.score >= 0 && value.score <= value.total && typeof value.date === "string",
      activity: (date, value) => /^\d{4}-\d{2}-\d{2}$/.test(date) && isRecord(value) &&
        Number.isInteger(value.cards) && Array.isArray(value.lessons) &&
        value.lessons.every(id => LESSON_IDS.has(id)),
      langsChosen: value => typeof value === "boolean",
      lastLesson: value => typeof value === "string" && LESSON_IDS.has(value)
    };
    const fields = [...Object.keys(validators), "practice"].filter(key => Object.hasOwn(candidate, key));
    if (strict && fields.length === 0) throw new Error("Missing progress data");
    for (const key of fields) {
      const value = candidate[key];
      if (key === "practice") {
        try { next.practice = GenauPracticeModel.normalizePractice(value); }
        catch (err) { if (strict) throw err; }
      } else if (key === "langs" || key === "theme" || key === "sidebarCollapsed" || key === "langsChosen" || key === "lastLesson") {
        if (validators[key](value)) next[key] = key === "langs" ? [...new Set(value)] : value;
        else if (strict) throw new Error(`Invalid ${key}`);
      } else if (isRecord(value)) {
        const entries = Object.entries(value);
        const valid = entries.filter(([id, entry]) => validators[key](id, entry));
        if (strict && valid.length !== entries.length) throw new Error(`Invalid ${key}`);
        next[key] = Object.fromEntries(valid);
      } else if (strict) {
        throw new Error(`Invalid ${key}`);
      }
    }
    return next;
  }

  // First visit: preselect contrast languages from the browser's languages, always with English.
  function detectLangs() {
    const prefs = (navigator.languages || [navigator.language || ""]).map(l => l.toLowerCase());
    const found = LANGUAGES.filter(code => prefs.some(p => p.startsWith(code.slice(0, 2).toLowerCase())));
    return [...new Set([...found, "en"])];
  }

  function loadState() {

      sidebarCollapsed: false,

      practice: GenauPracticeModel.emptyPractice()

    try {

      if (raw) {
        const parsed = JSON.parse(raw);
        const next = normalizeState(parsed, defaults);
        // Learners from before the first-run language choice already picked theirs.
        if (!Object.hasOwn(parsed, "langsChosen") && Object.keys(next.progress).length) next.langsChosen = true;
        return next;
      }
    } catch {}
    return defaults;
  }
