  // Relative path resolution for Markdown links
  function resolveRelativePath(baseFile, href) {
    if (!href || href.startsWith("http://") || href.startsWith("https://") || href.startsWith("mailto:") || href.startsWith("#")) {
      return null;
    }
    const cleanHref = href.split("#")[0];
    if (!cleanHref.endsWith(".md")) return null;
    const baseParts = baseFile.split("/").slice(0, -1);
    const relParts = cleanHref.split("/");
    const out = [...baseParts];
    for (const part of relParts) {
      if (!part || part === ".") continue;
      if (part === "..") out.pop();
      else out.push(part);
    }
    return out.join("/");
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function formatInline(text, baseFile) {
    const codeTokens = [];
    let s = text.replace(/`([^`]+)`/g, (_, code) => {
      const idx = codeTokens.length;
      codeTokens.push(`<code>${escapeHtml(code)}</code>`);
      return `\uE000CODE${idx}\uE001`;
    });

    s = escapeHtml(s);

    // Links [text](href)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
      const resolved = resolveRelativePath(baseFile, href);
      if (resolved) {
        return `<a href="#doc=${encodeURIComponent(resolved)}">${label}</a>`;
      }
      if (href.startsWith("http://") || href.startsWith("https://")) {
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      }
      const baseDir = baseFile.includes("/") ? baseFile.slice(0, baseFile.lastIndexOf("/") + 1) : "";
      const url = href.startsWith("/") ? href : baseDir + href;
      return `<a href="${url}" download>${label}</a>`;
    });

    // Bare https URLs
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

    // Strikethrough, Bold, Italic
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^\w*])\*([^*]+)\*(?!\w)/g, "$1<em>$2</em>");

    // Highlight Genau case symbols
    s = s.replace(/●/g, '<span class="sym-nom">●</span>')
         .replace(/▲/g, '<span class="sym-akk">▲</span>')
         .replace(/■/g, '<span class="sym-dat">■</span>')
         .replace(/◆/g, '<span class="sym-gen">◆</span>');

    // Restore inline code
    s = s.replace(/\uE000CODE(\d+)\uE001/g, (_, idx) => codeTokens[Number(idx)]);
    return s;
  }

  function detectContrastLang(line) {
    if (line.includes("🇧🇷")) return "pt-BR";
    if (line.includes("🇪🇸")) return "es";
    if (line.includes("🇫🇷")) return "fr";
    if (line.includes("🇬🇧")) return "en";
    return null;
  }

  function stripContrastPrefix(line) {
    return line
      .replace(/^(?:🇧🇷|🇪🇸|🇫🇷|🇬🇧)\s*/u, "")
      .replace(/^\*\*(?:Portuguese|Brazilian Portuguese|Spanish|French|English)\s+contrast\*\*\s*[—–:-]?\s*/i, "")
      .trim();
  }

  const LIST_ITEM = /^( *)(?:(\d+)\.|[-*+])[ \t]+(.*)$/;

  function renderList(lines, start, baseFile) {
    const first = lines[start].match(LIST_ITEM);
    const indent = first[1].length;
    const ordered = first[2] !== undefined;
    const tag = ordered ? "ol" : "ul";
    const startAttr = ordered && Number(first[2]) !== 1 ? ` start="${Number(first[2])}"` : "";
    const items = [];
    let end = start;
    while (end < lines.length) {
      const item = lines[end].match(LIST_ITEM);
      if (!item || item[1].length !== indent || (item[2] !== undefined) !== ordered) break;
      let content = formatInline(item[3], baseFile);
      end++;
      while (end < lines.length && (lines[end].match(LIST_ITEM)?.[1].length ?? 0) > indent) {
        const nested = renderList(lines, end, baseFile);
        content += nested.html;
        end = nested.end;
      }
      items.push(`<li>${content}</li>`);
    }
    return { html: `<${tag}${startAttr}>${items.join("")}</${tag}>`, end };
  }

  function renderLessonMasthead(md, lesson, baseFile) {
    const lines = md.replace(/<!--[\s\S]*?-->/g, "").replace(/\r\n/g, "\n").split("\n");
    let i = 0;
    while (i < lines.length && !lines[i].trim()) i++;
    if (i >= lines.length || !lines[i].startsWith("# ")) return null;

    const rawTitle = lines[i].replace(/^#\s+/, "").trim();
    const cleanTitle = rawTitle.replace(/^(?:A[12]|B1)-\d{2}\s*[—–-]\s*/, "");
    i++;
    while (i < lines.length && !lines[i].trim()) i++;

    const metaLines = [];
    while (i < lines.length && lines[i].trim() && /^\*\*(?:Level|Can-do|Time|Prerequisites)/i.test(lines[i].trim())) {
      metaLines.push(lines[i].trim());
      i++;
    }
    if (!metaLines.length) return null;

    const levelCode = lesson.id.split("-")[0];
    let timeVal = "";
    let prereqHtml = "";
    let nicosHtml = "";
    let candoHtml = "";

    for (const ml of metaLines) {
      if (/^\*\*Can-do:\*\*/i.test(ml)) {
        candoHtml = formatInline(ml.replace(/^\*\*Can-do:\*\*\s*/i, ""), baseFile);
      } else {
        const parts = ml.split(/\s*·\s*/);
        for (const p of parts) {
          if (/^\*\*Time:\*\*/i.test(p)) timeVal = p.replace(/^\*\*Time:\*\*\s*/i, "").trim();
          else if (/^\*\*Prerequisites:\*\*/i.test(p)) {
            const pr = p.replace(/^\*\*Prerequisites:\*\*\s*/i, "").trim();
            prereqHtml = pr.replace(/\b((?:A[12]|B1)-\d{2})\b/g, (_, id) => {
              const target = LESSON_BY_ID[id];
              return target ? `<a href="#doc=${encodeURIComponent(target.path)}">${id}</a>` : id;
            });
          } else if (/^\*\*Nicos Weg:\*\*/i.test(p)) {
            nicosHtml = formatInline(p.replace(/^\*\*Nicos Weg:\*\*\s*/i, "").trim(), baseFile);
          }
        }
      }
    }

    const pills = [
      `<span class="meta-pill level-${levelCode}">${lesson.id}</span>`,
      timeVal ? `<span>${escapeHtml(timeVal)}</span>` : "",
      prereqHtml && prereqHtml.toLowerCase() !== "none" ? `<span class="meta-sep">·</span><span>Prereq: ${prereqHtml}</span>` : "",
      nicosHtml ? `<span class="meta-sep">·</span><span>DW Nicos Weg: ${nicosHtml}</span>` : ""
    ].filter(Boolean).join("");

    const usedCases = Object.entries(CASE_SYM).filter(([sym]) => md.includes(sym));
    const legendHtml = usedCases.length
      ? `<dl class="case-key" aria-label="Case symbols in this lesson">${usedCases.map(([sym, key]) =>
          `<div><dt class="sym-${key}">${sym}</dt><dd>${CASE_NAME[key]}</dd></div>`).join("")}</dl>`
      : "";

    const mastheadHtml = `
      <div class="lesson-masthead">
        <div class="masthead-meta">${pills}</div>
        <h1>${formatInline(cleanTitle, baseFile)}</h1>
        ${candoHtml ? `<div class="cando-box"><span class="cando-label">Learning Goal</span>${candoHtml}</div>` : ""}
        ${legendHtml}
      </div>
    `;
    return { mastheadHtml, restMd: lines.slice(i).join("\n") };
  }

  // ==================== GRAMMAR DIAGRAMS ====================
  // Fenced blocks are hand-aligned ASCII diagrams. Two shapes are rebuilt as real
  // structures: bracket (word-order) grids and gender paradigms. Everything else
  // stays monospace, with case symbols and ✔/✘ marks coloured.
  const CASE_SYM = { "●": "nom", "▲": "akk", "■": "dat", "◆": "gen" };
  const CASE_NAME = { nom: "Nominativ", akk: "Akkusativ", dat: "Dativ", gen: "Genitiv" };

  function diaInline(text) {
    return escapeHtml(text)
      .replace(/[●▲■◆]/g, sym => `<span class="sym-${CASE_SYM[sym]}">${sym}</span>`)
      .replace(/✘/g, '<span class="dia-bad">✘</span>')
      .replace(/✔/g, '<span class="dia-good">✔</span>');
  }

  function diaSegments(line) {
    const segs = [];
    const re = /\S+(?: \S+)*/g;
    let m;
    while ((m = re.exec(line))) segs.push({ start: m.index, text: m[0] });
    return segs;
  }

  function assignToColumns(line, starts) {
    const cells = starts.map(() => []);
    for (const seg of diaSegments(line)) {
      let col = 0;
      for (let c = 0; c < starts.length; c++) if (starts[c] <= seg.start + 3) col = c;
      cells[col].push(seg.text);
    }
    return cells.map(parts => parts.join(" "));
  }

  const BRACKET_HEADER = /^\s*(?:\[[^\]]+\]\s*){2,}$/;

  function isParadigmHeader(line) {
    const cells = line.trim().split(/\s{2,}/).map(c => c.toLowerCase().replace(/\s*\(.*\)$/, ""));
    return ["m", "n", "f"].every(g => cells.includes(g));
  }

  function renderBracketGrid(header, rows) {
    const cols = [];
    const re = /\[\s*([^\]]+?)\s*\]/g;
    let m;
    while ((m = re.exec(header))) cols.push({ start: m.index, label: m[1] });
    const isVerb = l => /\bV\b|\bV2\b|V-END|VERB|conjugated|Partizip|Infinitiv/i.test(l);
    const isLink = l => /Subjunktor|Relativ|Fragewort|Article|Artikel/i.test(l);
    cols.forEach(c => { c.verb = isVerb(c.label); c.end = /END/i.test(c.label); });
    let open = cols.findIndex(c => (c.verb && !c.end) || isLink(c.label));
    let close = -1;
    cols.forEach((c, idx) => { if (c.verb && idx > open) close = idx; });
    if (open === -1 || close === -1) { open = -1; close = -1; }

    const starts = cols.map(c => c.start);
    const thead = cols.map((c, idx) => {
      const cls = ["k-col"];
      if (c.verb) cls.push("k-verb");
      if (idx === open) cls.push("k-open");
      else if (idx === close) cls.push("k-close");
      else if (open > -1 && idx > open && idx < close) cls.push("k-mid");
      return `<th scope="col" class="${cls.join(" ")}"><span>${diaInline(c.label)}</span></th>`;
    }).join("") + `<th class="k-note-h" aria-hidden="true"></th>`;

    const body = rows.map(row => {
      const trimmed = row.trim();
      if (/^=/.test(trimmed)) {
        return `<tr class="k-gloss"><td colspan="${cols.length + 1}">${diaInline(trimmed)}</td></tr>`;
      }
      const cells = assignToColumns(row, starts);
      let note = "";
      const last = cells.length - 1;
      const noteMatch = cells[last].match(/^(.*?\S)?\s*(\([^()]*\)|←.*)$/);
      if (noteMatch && noteMatch[1]) { cells[last] = noteMatch[1]; note = noteMatch[2]; }
      else if (noteMatch && !noteMatch[1] && cells[last].startsWith("(")) { note = cells[last]; cells[last] = ""; }
      return `<tr>${cells.map((cell, idx) =>
        `<td class="${cols[idx].verb ? "k-verb" : ""}">${diaInline(cell)}</td>`
      ).join("")}<td class="k-note">${diaInline(note)}</td></tr>`;
    }).join("");

    return `<div class="dia-scroll"><table class="klammer" lang="de"><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function renderParadigm(header, rows) {
    const segs = diaSegments(header);
    const genderIdx = segs.findIndex(s => /^(m|n|f|pl)\b/i.test(s.text));
    const titleText = genderIdx > 0 ? segs.slice(0, genderIdx).map(s => s.text).join(" ") : "";
    const gender = segs.slice(genderIdx);
    const starts = [0, ...gender.map(s => s.start)];
    const caseSym = (titleText.match(/[●▲■◆]/) || [])[0];
    const caseKey = caseSym ? CASE_SYM[caseSym] : "";

    const thead = `<th scope="col" class="p-title">${diaInline(titleText)}</th>` +
      gender.map(g => `<th scope="col">${diaInline(g.text)}</th>`).join("");
    const genderLabels = gender.map(g => g.text.replace(/\s*\(.*\)$/, ""));
    const body = rows.map(row => {
      const cells = assignToColumns(row, starts);
      const filled = cells.filter(Boolean).length;
      if (!cells[0] && filled === 1) {
        const at = cells.findIndex(Boolean);
        return `<tr class="p-cont"><td class="p-blank"></td><td colspan="${cells.length - 1}">${diaInline(cells[at])}</td></tr>`;
      }
      // A single example list that runs across the gender columns gets one full-width cell.
      const used = cells.map((c, idx) => idx).filter(idx => idx > 0 && cells[idx]);
      if (used.length === 1) {
        const k = used[0];
        const room = (starts[k + 1] ?? starts[k] + 14) - starts[k];
        if (cells[k].length > room + 4) {
          return `<tr class="p-span"><th scope="row">${diaInline(cells[0])}</th><td colspan="${cells.length - 1}">${diaInline(cells[k])}</td></tr>`;
        }
      }
      const rowSym = (cells[0].match(/[●▲■◆]/) || [])[0];
      return `<tr${rowSym ? ` class="case-row case-${CASE_SYM[rowSym]}"` : ""}><th scope="row">${diaInline(cells[0])}</th>${
        cells.slice(1).map((c, idx) => `<td data-g="${escapeHtml(genderLabels[idx] || "")}">${diaInline(c)}</td>`).join("")}</tr>`;
    }).join("");

    return `<div class="dia-scroll"><table lang="de" class="paradigm${caseKey ? ` case-${caseKey}` : ""}"${caseKey ? ` aria-label="${CASE_NAME[caseKey]} paradigm"` : ""}><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function renderDiagram(codeLines) {
    const parts = [];
    let textBuf = [];
    const flushText = () => {
      while (textBuf.length && !textBuf[textBuf.length - 1].trim()) textBuf.pop();
      while (textBuf.length && !textBuf[0].trim()) textBuf.shift();
      if (!textBuf.length) return;
      const minIndent = Math.min(...textBuf.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
      // Each line keeps its indent as a hanging indent, so long lines wrap instead of clipping.
      const html = textBuf.map(l => {
        const line = l.slice(minIndent);
        if (!line.trim()) return `<span class="dl dl-gap"></span>`;
        const indent = line.match(/^ */)[0].length;
        const text = line.trim();
        const isLabel = /^[A-ZÄÖÜ0-9●▲■◆][A-ZÄÖÜẞ0-9 ●▲■◆&+\-—–·/().,'"!?]*[:A-ZÄÖÜ)]\s*$/.test(text) && /[A-ZÄÖÜ]{3}/.test(text);
        return `<span class="dl${isLabel ? " dia-label" : ""}" style="--in:${indent}ch">${diaInline(text)}</span>`;
      }).join("");
      parts.push(`<div class="dia-text" lang="de">${html}</div>`);
      textBuf = [];
    };

    let i = 0;
    while (i < codeLines.length) {
      const line = codeLines[i];
      const bracket = BRACKET_HEADER.test(line);
      const paradigm = !bracket && isParadigmHeader(line);
      if (bracket || paradigm) {
        const rows = [];
        let j = i + 1;
        while (j < codeLines.length && codeLines[j].trim() && !BRACKET_HEADER.test(codeLines[j])) {
          rows.push(codeLines[j]);
          j++;
        }
        if (rows.length) {
          flushText();
          parts.push(bracket ? renderBracketGrid(line, rows) : renderParadigm(line, rows));
          i = j;
          continue;
        }
      }
      textBuf.push(line);
      i++;
    }
    flushText();
    return `<figure class="diagram">${parts.join("")}</figure>`;
  }

  function renderMarkdown(md, baseFile) {
    const cleaned = md.replace(/<!--[\s\S]*?-->/g, "");
    const lines = cleaned.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      if (!line.trim()) { i++; continue; }

      // Collapsible <details> block
      if (/^<details>\s*$/i.test(line.trim())) {
        i++;
        let summaryHtml = "Click to reveal";
        if (i < lines.length && /^<summary>/i.test(lines[i].trim())) {
          const summary = lines[i].trim().replace(/^<summary>/i, "").replace(/<\/summary>$/i, "");
          const bold = summary.match(/^<b>(.*)<\/b>$/i);
          summaryHtml = bold ? `${formatInline(bold[1], baseFile)}` : formatInline(summary, baseFile);
          i++;
        }
        const inner = [];
        while (i < lines.length && !/^<\/details>\s*$/i.test(lines[i].trim())) {
          inner.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        out.push(`<details><summary>${ICONS.chevRight}<span>${summaryHtml}</span></summary><div class="details-body">${renderMarkdown(inner.join("\n"), baseFile)}</div></details>`);
        continue;
      }

      // Fenced code block
      if (line.trim().startsWith("```")) {
        i++;
        const codeLines = [];
        while (i < lines.length && !lines[i].trim().startsWith("```")) {
          codeLines.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        out.push(renderDiagram(codeLines));
        continue;
      }

      // Horizontal rule
      if (/^---+$/.test(line.trim())) {
        out.push("<hr>");
        i++;
        continue;
      }

      // Headings
      const hm = line.match(/^(#{1,6})\s+(.+)$/);
      if (hm) {
        const lvl = hm[1].length;
        const text = hm[2].trim();
        if (lvl === 2) {
          const numMatch = text.match(/^(\d+)\.\s+(.+)$/);
          if (numMatch) {
            out.push(`<h2><span class="sec-num" aria-hidden="true">${numMatch[1].padStart(2, "0")}</span><span>${formatInline(numMatch[2], baseFile)}</span></h2>`);
            i++;
            continue;
          }
        }
        out.push(`<h${lvl}>${formatInline(text, baseFile)}</h${lvl}>`);
        i++;
        continue;
      }

      // Table
      if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|\s*[-:]+/.test(lines[i + 1].trim())) {
        const parseRow = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
        const headers = parseRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith("|")) {
          rows.push(parseRow(lines[i]));
          i++;
        }
        out.push(
          `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${formatInline(h, baseFile)}</th>`).join("")}</tr></thead>` +
          `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${formatInline(c, baseFile)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
        );
        continue;
      }

      // Blockquote & Multilingual contrast callouts
      if (line.trim().startsWith(">")) {
        const bqLines = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) {
          bqLines.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        const isContrastBlock = bqLines.some(l => detectContrastLang(l));
        if (isContrastBlock) {
          const boxes = [];
          for (const bl of bqLines) {
            if (!bl.trim()) continue;
            const lang = detectContrastLang(bl);
            if (lang) {
              const hidden = state.langs.includes(lang) ? "" : " hidden-lang";
              const meta = LANG_META[lang];
              const bodyText = stripContrastPrefix(bl);
              boxes.push(
                `<div class="contrast-box${hidden}" data-lang="${lang}">` +
                `<div class="contrast-hdr">${FLAGS[lang]}<span>${meta.label}</span></div>` +
                `<span class="contrast-body">${formatInline(bodyText, baseFile)}</span>` +
                `</div>`
              );
            } else {
              boxes.push(`<blockquote><p>${formatInline(bl, baseFile)}</p></blockquote>`);
            }
          }
          out.push(`<div class="contrast-group">${boxes.join("")}</div>`);
        } else {
          out.push(`<blockquote>${bqLines.map(l => l.trim() ? `<p>${formatInline(l, baseFile)}</p>` : "").join("")}</blockquote>`);
        }
        continue;
      }

      // Lists
      if (LIST_ITEM.test(line)) {
        const list = renderList(lines, i, baseFile);
        out.push(list.html);
        i = list.end;
        continue;
      }

      // Paragraph
      const para = [line];
      i++;
      while (
        i < lines.length &&
        lines[i].trim() &&
        !lines[i].trim().startsWith("#") &&
        !lines[i].trim().startsWith(">") &&
        !lines[i].trim().startsWith("```") &&
        !lines[i].trim().startsWith("|") &&
        !/^---+$/.test(lines[i].trim()) &&
        !LIST_ITEM.test(lines[i]) &&
        !/^<details>/i.test(lines[i].trim())
      ) {
        para.push(lines[i]);
        i++;
      }
      out.push(`<p>${formatInline(para.join(" "), baseFile)}</p>`);
    }

    return out.join("\n");
  }

  // ==================== WEB HOME VIEW ====================
  function nextLessonFor(list) {
    return list.find(l => !["●", "✔"].includes(state.progress[l.id])) || list[0];
  }

  // The lesson to offer next: the one you were working on, else the first unfinished one after it.
  function resumeLesson() {
    const isDone = l => ["●", "✔"].includes(state.progress[l.id]);
    const last = state.lastLesson && LESSON_BY_ID[state.lastLesson];
    if (last && !isDone(last)) return last;
    if (last) {
      const after = ALL_LESSONS.slice(ALL_LESSONS.indexOf(last) + 1).find(l => !isDone(l));
      if (after) return after;
    }
    return nextLessonFor(ALL_LESSONS);
  }
  function hasStarted(lesson) {
    return state.lastLesson === lesson.id || !!state.diagnostics[lesson.id] ||
      ["◐", "◑", "●", "✔"].includes(state.progress[lesson.id]);
  }

  // Fetch markdown file
  async function fetchDoc(path) {
    if (docCache.has(path)) return docCache.get(path);
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const txt = await res.text();
    docCache.set(path, txt);
    return txt;
  }

  // Load and render a Markdown document
  // ==================== ACTIVITY (today's session) ====================
  function logActivity(kind, lessonId) {
    const day = todayISO();
    const entry = state.activity[day] || (state.activity[day] = { cards: 0, lessons: [] });
    if (kind === "card") entry.cards += 1;
    if (kind === "lesson" && lessonId && !entry.lessons.includes(lessonId)) entry.lessons.push(lessonId);
    const days = Object.keys(state.activity).sort();
    while (days.length > 90) delete state.activity[days.shift()];
  }

  function studyStreak() {
    let streak = 0;
    const d = new Date();
    for (;;) {
      const key = d.toISOString().slice(0, 10);
      const day = state.activity[key];
      if (day && (day.cards > 0 || day.lessons.length)) streak++;
      else if (streak > 0 || key !== todayISO()) break;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  // ==================== LESSON DIAGNOSTIC ====================
  function stripMdInline(text) {
    return text.replace(/`([^`]*)`/g, "$1").replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/(^|[^\w*])\*([^*]+)\*(?!\w)/g, "$1$2").trim();
  }

  function parseDiagnostic(md) {
    const clean = md.replace(/<!--[\s\S]*?-->/g, "").replace(/\r\n/g, "\n");
    const section = clean.match(/^## 0\. Diagnostic[^\n]*\n([\s\S]*?)(?=^## )/m);
    const keyMatch = clean.match(/^\*\*0\.\*\*\s*([\s\S]*?)\n\s*\n/m);
    if (!section || !keyMatch) return null;
    const items = [...section[1].matchAll(/^\s*(\d+)\.\s+(.+)$/gm)].slice(0, 8).map(m => m[2].trim());
    if (items.length < 8) return null;
    const instruction = section[1].split("\n").map(l => l.trim())
      .filter(l => l && !/^\d+\.\s/.test(l)).join(" ")
      .replace(/\s*≥\s*7\/8\s*→\s*`?✔`?\.?/g, "").trim();
    const key = keyMatch[1].replace(/\s+/g, " ");
    const marks = [];
    let pos = 0;
    for (let n = 1; n <= items.length; n++) {
      const re = new RegExp(`(?:^|\\s)${n}[.)]?\\s`, "g");
      re.lastIndex = pos;
      const m = re.exec(key);
      if (!m) return null;
      marks.push({ at: m.index, body: m.index + m[0].length });
      pos = m.index + m[0].length;
    }
    const answers = marks.map((mk, idx) => key.slice(mk.body, idx + 1 < marks.length ? marks[idx + 1].at : key.length).trim());
    return { instruction, items, answers };
  }

  function normalizeGuess(text) {
    return stripMdInline(text).normalize("NFC").toLowerCase()
      .replace(/[“”„"'’]/g, "").replace(/\s*([.,!?;:])\s*/g, "$1 ")
      .replace(/[.!?]+\s*$/, "").replace(/\s+/g, " ").trim();
  }

  function guessMatches(guess, answer) {
    const g = normalizeGuess(guess);
    if (!g) return false;
    const plain = stripMdInline(answer).replace(/\s*\([^)]*\)\s*$/, "");
    const variants = [plain, ...plain.split(/\s+\/\s+|\s+·\s+|\s+or\s+/)];
    return variants.some(v => normalizeGuess(v) === g);
  }

  function mountDiagnostic(article, lesson, dx, baseFile, onStatus) {
    const h2 = [...article.querySelectorAll("h2")].find(h => /Diagnostic/i.test(h.textContent));
    if (!h2) return;
    // The static list stays for print; the screen gets the one-at-a-time check.
    let node = h2.nextElementSibling;
    while (node && node.tagName !== "H2") {
      node.classList.add("dx-static");
      node = node.nextElementSibling;
    }
    const root = document.createElement("section");
    root.className = "dx";
    root.setAttribute("aria-label", `${lesson.id} diagnostic`);
    root.innerHTML = `<div class="dx-body"></div><p class="sr-only" aria-live="polite"></p>`;
    const view = root.querySelector(".dx-body");
    const live = root.querySelector("[aria-live]");
    const announce = text => { live.textContent = ""; requestAnimationFrame(() => { live.textContent = text; }); };
    const ruleFigure = article.querySelector("figure.diagram");
    const ruleHeading = [...article.querySelectorAll("h2")].find(h => /rule in words/i.test(h.textContent));
    h2.after(root);

    const total = dx.items.length;
    let idx = 0;
    let results = [];

    const pips = () => `<ol class="dx-pips" aria-hidden="true">${dx.items.map((_, i) =>
      `<li class="${results[i] === true ? "ok" : results[i] === false ? "miss" : i === idx ? "now" : ""}"></li>`).join("")}</ol>`;

    function focusFirst(sel) {
      const el = root.querySelector(sel);
      if (el) el.focus({ preventScroll: true });
    }

    function intro() {
      const last = state.diagnostics[lesson.id];
      view.innerHTML = `
        <p class="dx-lede">${dx.instruction ? formatInline(dx.instruction, baseFile) + " " : ""}Eight quick items, about three minutes. Answer from memory: each answer shows right after you try.</p>
        ${last ? `<p class="dx-last">Last time: <strong>${last.score} of ${last.total}</strong> on ${escapeHtml(last.date)}.</p>` : ""}
        <div class="dx-actions">
          <button type="button" class="top-btn primary" data-act="start">${last ? "Take it again" : "Start the check"}${ICONS.arrowRight}</button>
          <button type="button" class="top-btn ghost" data-act="skip">I'm new to this, teach me first</button>
        </div>`;
    }

    function askItem() {
      view.innerHTML = `
        <div class="dx-head"><span class="dx-count">Item ${idx + 1} of ${total}</span>${pips()}</div>
        <form class="dx-form" novalidate>
          <label class="dx-prompt" for="dxInput-${lesson.id}" lang="de">${formatInline(dx.items[idx], baseFile)}</label>
          <div class="dx-row">
            <input id="dxInput-${lesson.id}" class="dx-input" type="text" lang="de" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer">
            <button type="submit" class="top-btn primary">Check</button>
          </div>
          <div class="dx-keys" role="group" aria-label="Insert German letters">
            ${["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü"].map(ch => `<button type="button" class="dx-key" data-ch="${ch}" tabindex="-1">${ch}</button>`).join("")}
          </div>
        </form>
        <button type="button" class="link-quiet" data-act="dontknow">I don't know this one</button>`;
      focusFirst(".dx-input");
    }

    function feedback(guess) {
      const answer = dx.answers[idx];
      const right = guessMatches(guess, answer);
      const youSaid = guess.trim() ? `<p class="dx-you">You wrote <span lang="de">${escapeHtml(guess.trim())}</span></p>` : "";
      if (right) {
        results[idx] = true;
        view.innerHTML = `
          <div class="dx-head"><span class="dx-count">Item ${idx + 1} of ${total}</span>${pips()}</div>
          <p class="dx-prompt dx-prompt-sm" lang="de">${formatInline(dx.items[idx], baseFile)}</p>
          <div class="dx-verdict ok" role="status"><strong>Richtig.</strong> <span lang="de">${formatInline(answer, baseFile)}</span></div>
          <div class="dx-actions"><button type="button" class="top-btn primary" data-act="next">${idx + 1 < total ? "Next item" : "See my result"}${ICONS.arrowRight}</button></div>`;
        announce(`Richtig: ${stripMdInline(answer)}`);
        focusFirst("[data-act=next]");
        return;
      }
      view.innerHTML = `
        <div class="dx-head"><span class="dx-count">Item ${idx + 1} of ${total}</span>${pips()}</div>
        <p class="dx-prompt dx-prompt-sm" lang="de">${formatInline(dx.items[idx], baseFile)}</p>
        <div class="dx-verdict miss" role="status">
          <span class="dx-verdict-label">${guess.trim() ? "Not quite" : "Here's the answer"}</span>
          <p class="dx-answer" lang="de">${formatInline(answer, baseFile)}</p>
          ${youSaid}
        </div>
        ${ruleFigure ? `<details class="dx-peek"><summary>${ICONS.chevRight}<span>See the rule</span></summary><div class="dx-peek-body"></div>${ruleHeading ? `<button type="button" class="link-quiet" data-act="words">Read the rule in words</button>` : ""}</details>` : ""}
        <p class="dx-honest">${guess.trim() ? "Only a typo, or another correct form? Count it yourself." : ""}</p>
        <div class="dx-actions">
          <button type="button" class="top-btn primary" data-act="miss">${idx + 1 < total ? "Next item" : "See my result"}${ICONS.arrowRight}</button>
          ${guess.trim() ? `<button type="button" class="top-btn" data-act="count">${ICONS.check}I had it right</button>` : ""}
        </div>`;
      const peek = root.querySelector(".dx-peek-body");
      if (peek) peek.append(ruleFigure.cloneNode(true));
      announce(`${guess.trim() ? "Not quite" : "Answer"}: ${stripMdInline(answer)}`);
      focusFirst("[data-act=miss]");
    }

    function result() {
      const score = results.filter(Boolean).length;
      const passed = score >= 7;
      state.diagnostics[lesson.id] = { score, total, date: todayISO() };
      logActivity("lesson", lesson.id);
      const before = state.progress[lesson.id] || "☐";
      if (!passed && before === "☐") onStatus("◐", true);
      saveState();
      const missed = dx.items.map((item, i) => ({ item, answer: dx.answers[i], ok: results[i] })).filter(r => !r.ok);
      view.innerHTML = `
        <div class="dx-score ${passed ? "pass" : ""}" role="status">
          <span class="dx-score-num">${score}<span>/${total}</span></span>
          <div>
            <p class="dx-score-title">${passed ? "You already know this." : score >= 5 ? "Close. A short study pass will fix it." : "Good: now you know exactly what to study."}</p>
            <p class="dx-score-sub">${passed
              ? `Mark ${lesson.id} as Known and its cards go into your review queue. You can still read the lesson.`
              : `${before === "☐" ? `${lesson.id} is now In progress. ` : ""}Read the rule, do the exercises, then take the check again.`}</p>
          </div>
        </div>
        ${missed.length ? `<details class="dx-missed"${passed ? "" : " open"}><summary>${ICONS.chevRight}<span>${missed.length === 1 ? "The one you missed" : `The ${missed.length} you missed`}</span></summary>
          <ol>${missed.map(m => `<li><span lang="de">${formatInline(m.item, baseFile)}</span><span class="dx-missed-a" lang="de">→ ${formatInline(m.answer, baseFile)}</span></li>`).join("")}</ol></details>` : ""}
        <div class="dx-actions">
          ${passed
            ? `<button type="button" class="top-btn primary" data-act="known">${ICONS.check}Mark Known and add cards</button>
               <button type="button" class="top-btn ghost" data-act="study">Read the lesson anyway</button>`
            : `<button type="button" class="top-btn primary" data-act="study">Study the rule${ICONS.arrowRight}</button>
               <button type="button" class="top-btn ghost" data-act="start">Take it again</button>`}
        </div>`;
      announce(`Score ${score} of ${total}.`);
      focusFirst(".dx-actions .primary");
    }

    function toRule() {
      const target = [...article.querySelectorAll("h2")].find(h => /rule in one picture|rule in words/i.test(h.textContent)) || h2.nextElementSibling;
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    root.addEventListener("click", async e => {
      const key = e.target.closest(".dx-key");
      if (key) {
        const input = root.querySelector(".dx-input");
        const at = input.selectionStart ?? input.value.length;
        input.setRangeText(key.dataset.ch, at, input.selectionEnd ?? at, "end");
        input.focus();
        return;
      }
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (!act) return;
      if (act === "start") { idx = 0; results = []; askItem(); }
      else if (act === "skip") { if ((state.progress[lesson.id] || "☐") === "☐") onStatus("◐", false); toRule(); }
      else if (act === "dontknow") { results[idx] = false; feedback(""); }
      else if (act === "count" || act === "miss" || act === "next") {
        if (act === "count") results[idx] = true;
        if (act === "miss") results[idx] = false;
        idx += 1;
        if (idx < total) askItem(); else result();
      }
      else if (act === "known") {
        onStatus("✔", false);
        try {
          const added = await queueTopicCards(lesson.id);
          showToast(added > 0 ? `${lesson.id} is Known. ${added} cards added to review.` : `${lesson.id} is Known. Its cards were already in review.`);
        } catch (err) { showToast(err.message); }
        intro();
      }
      else if (act === "study") toRule();
      else if (act === "words" && ruleHeading) ruleHeading.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    root.addEventListener("submit", e => {
      e.preventDefault();
      const value = root.querySelector(".dx-input").value;
      if (!value.trim()) { root.querySelector(".dx-input").focus(); return; }
      feedback(value);
    });

    intro();
  }

  // ---------- Flashcards SRS ----------
  function parseCardsMd(txt, langCode = null) {
    const out = [];
    let cur = null;
    for (const line of txt.replace(/\r\n/g, "\n").split("\n")) {
      const m = line.match(/^###\s+(\S+)\s*$/);
      if (m) {
        if (cur) out.push(cur);
        const id = m[1];
        const topic = id.split("-").slice(0, 2).join("-");
        cur = { id, topic, Q: "", A: "", T: "", lang: langCode };
        continue;
      }
      if (cur) {
        if (line.startsWith("Q:")) cur.Q = `${cur.Q} ${line.slice(2).trim()}`.trim();
        else if (line.startsWith("A:")) cur.A = `${cur.A} ${line.slice(2).trim()}`.trim();
        else if (line.startsWith("T:")) cur.T = `${cur.T} ${line.slice(2).trim()}`.trim();
      }
    }
    if (cur) out.push(cur);
    return out;
  }

  function loadAllCards() {
    if (allCardsPromise) return allCardsPromise;
    const files = [
      ["review/cards/A1.md", null],
      ["review/cards/A2.md", null],
      ["review/cards/B1.md", null],
      ["review/cards/contrasts/pt-BR.md", "pt-BR"],
      ["review/cards/contrasts/es.md", "es"],
      ["review/cards/contrasts/fr.md", "fr"],
      ["review/cards/contrasts/en.md", "en"]
    ];
    allCardsPromise = Promise.allSettled(files.map(async ([path, lang]) => {
      return parseCardsMd(await fetchDoc(path), lang);
    })).then(results => {
      const failed = files.filter((_, index) => results[index].status === "rejected");
      if (failed.length) {
        allCardsPromise = null;
        throw new Error(`Could not load ${failed.map(([path]) => path).join(", ")}. Try again.`);
      }
      return results.flatMap(result => result.value);
    });
    return allCardsPromise;
  }

  async function queueTopicCards(topicId) {
    const cards = await loadAllCards();
    const today = todayISO();
    let added = 0;
    for (const c of cards) {
      if (c.topic !== topicId) continue;
      if (c.lang && !state.langs.includes(c.lang)) continue;
      if (!state.schedule[c.id]) {
        state.schedule[c.id] = { id: c.id, topic: c.topic, due: today, step: 0, reviews: 0, correct: 0 };
        added++;
      }
    }
    saveState();
    return added;
  }

  function gradeScheduleRow(row, grade) {
    let step = row.step || 0;
    const reviews = row.reviews || 0;
    if (grade === 0) step = 0;
    else if (grade === 1) step = Math.max(0, step - 1);
    else if (grade === 2) step = (reviews === 0 && step === 0) ? 0 : Math.min(LADDER.length - 1, step + 1);
    else if (grade === 3) step = (reviews === 0 && step === 0) ? 1 : Math.min(LADDER.length - 1, step + 2);
    row.step = step;
    row.due = addDaysISO(LADDER[step]);
    row.reviews = reviews + 1;
    row.correct = (row.correct || 0) + (grade >= 2 ? 1 : 0);
    saveState();
  }

  const fcSession = { mode: "due", queue: [], idx: 0, revealed: false, reviewed: 0, practiceTopic: "A1-01" };

  async function openFlashcards(requestId) {
    updatePrimaryNavActive();
    closeDrawerSidebar();
    renderSidebar(document.getElementById("searchInput").value);
    const container = document.getElementById("mainContainer");

    if (window.location.protocol === "file:") {
      container.innerHTML = `<div class="notice">Browser flashcards require the hosted web app or a local HTTP server. For offline flashcards, import the ready-made Anki decks in <code>review/anki/</code>.</div>`;
      return;
    }

    container.innerHTML = `<div style="padding:48px 0; text-align:center; color:var(--text-muted)">Loading flashcards…</div>`;
    let cards;
    try {
      cards = await loadAllCards();
    } catch (err) {
      if (requestId !== navigationId) return;
      container.innerHTML = `<div class="notice">${escapeHtml(err.message)}
        <button class="top-btn" id="retryFlashcardsBtn" type="button" style="margin-left:10px">Retry</button></div>`;
      document.getElementById("retryFlashcardsBtn").addEventListener("click", route);
      return;
    }
    if (requestId !== navigationId) return;
    const cardMap = Object.fromEntries(cards.map(c => [c.id, c]));

    function buildDueQueue() {
      const today = todayISO();
      const due = Object.values(state.schedule).filter(r => r.due <= today && cardMap[r.id]);
      for (let i = due.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [due[i], due[j]] = [due[j], due[i]];
      }
      return due.map(r => cardMap[r.id]);
    }

    function buildPracticeQueue(topicId) {
      return cards.filter(c => c.topic === topicId && (!c.lang || state.langs.includes(c.lang)));
    }

    if (fcSession.mode === "due") {
      fcSession.queue = buildDueQueue();
      fcSession.idx = 0;
      fcSession.revealed = false;
    }

    function renderFc() {
      if (requestId !== navigationId) return;
      const today = todayISO();
      const totalQueued = Object.keys(state.schedule).length;
      const dueCount = Object.values(state.schedule).filter(r => r.due <= today).length;
      const totalReviews = Object.values(state.schedule).reduce((s, r) => s + (r.reviews || 0), 0);
      const totalCorrect = Object.values(state.schedule).reduce((s, r) => s + (r.correct || 0), 0);
      const acc = totalReviews ? `${Math.round((100 * totalCorrect) / totalReviews)}%` : "—";

      const curCard = fcSession.queue[fcSession.idx];

      const nextLesson = resumeLesson();
      const doneNotQueued = ALL_LESSONS.filter(l => ["●", "✔"].includes(state.progress[l.id]) &&
        !Object.keys(state.schedule).some(id => id.startsWith(l.id + "-"))).length;
      const tomorrow = addDaysISO(1);
      const dueTomorrow = Object.values(state.schedule).filter(r => r.due === tomorrow).length;
      const todayAct = state.activity[today] || { cards: 0, lessons: [] };
      const streak = studyStreak();
      const topicOptions = ALL_LESSONS.filter(l => !l.path.includes("consolidation")).map(l =>
        `<option value="${l.id}" ${fcSession.practiceTopic === l.id ? "selected" : ""}>${l.id} · ${escapeHtml(l.title)}</option>`).join("");

      let emptyHtml = "";
      if (!curCard && fcSession.mode === "due" && !totalQueued) {
        emptyHtml = `
          <div class="fc-empty first">
            <p class="fc-empty-title">No cards yet.</p>
            <p class="fc-empty-body">Cards join your review when you pass a lesson's check. You can also add a lesson's cards yourself and start remembering it today.</p>
            <div class="dx-actions">
              ${doneNotQueued
                ? `<button class="top-btn primary" id="addDoneBtn" type="button">${ICONS.cards}Add cards from your ${doneNotQueued} finished ${doneNotQueued === 1 ? "lesson" : "lessons"}</button>`
                : `<button class="top-btn primary" id="addNextBtn" type="button" data-topic="${nextLesson.id}">${ICONS.cards}Add ${nextLesson.id}'s cards</button>`}
              <a class="top-btn ghost" href="#doc=${encodeURIComponent(nextLesson.path)}">Open ${nextLesson.id} first</a>
            </div>
          </div>`;
      } else if (!curCard && fcSession.mode === "due") {
        const reviewedToday = Math.max(todayAct.cards, fcSession.reviewed);
        emptyHtml = `
          <div class="fc-empty done">
            <p class="fc-empty-title">${reviewedToday ? "Fertig für heute." : "Nothing due today."}</p>
            <p class="fc-empty-body">${reviewedToday
              ? `You reviewed ${reviewedToday} ${reviewedToday === 1 ? "card" : "cards"} today${todayAct.lessons.length ? ` and worked on ${todayAct.lessons.join(", ")}` : ""}.${streak > 1 ? ` That's ${streak} days in a row.` : ""}`
              : "Your cards come back on their own schedule, spaced further apart each time you remember them."}
              ${dueTomorrow ? ` Tomorrow: ${dueTomorrow} ${dueTomorrow === 1 ? "card" : "cards"}.` : ""}</p>
            <div class="dx-actions">
              <a class="top-btn primary" href="#doc=${encodeURIComponent(nextLesson.path)}">Next: ${nextLesson.id} · ${escapeHtml(nextLesson.title)}${ICONS.arrowRight}</a>
            </div>
          </div>`;
      } else if (!curCard) {
        emptyHtml = `
          <div class="fc-empty">
            <p class="fc-empty-title">Topic finished.</p>
            <p class="fc-empty-body">Pick another topic above, or add this one to your review so it comes back at the right time.</p>
          </div>`;
      }

      container.innerHTML = `
        <div class="fc-panel">
          <div class="fc-head">
            <h1>Flashcards</h1>
            <a class="home-text-link" href="#doc=review%2Fanki%2FREADME.md">Prefer Anki? Get the decks</a>
          </div>
          ${totalQueued ? `<p class="fc-summary"><strong>${dueCount}</strong> due today · <strong>${totalQueued}</strong> in your review${totalReviews ? ` · <strong>${acc}</strong> remembered` : ""}</p>` : ""}

          <div class="status-seg fc-tabs" role="group" aria-label="Flashcard mode">
            <button class="status-btn ${fcSession.mode === "due" ? "active" : ""}" id="tabDue" type="button" aria-pressed="${fcSession.mode === "due"}">Today's review${dueCount ? ` (${dueCount})` : ""}</button>
            <button class="status-btn ${fcSession.mode === "practice" ? "active" : ""}" id="tabPractice" type="button" aria-pressed="${fcSession.mode === "practice"}">Practise a topic</button>
          </div>

          ${fcSession.mode === "practice" ? `
          <div class="fc-controls">
            <label class="sr-only" for="topicSelect">Topic</label>
            <select class="select" id="topicSelect">${topicOptions}</select>
            <button class="top-btn" id="startPracticeBtn" type="button">Load cards</button>
          </div>` : ""}

          ${curCard ? `
            <div class="flashcard" data-level="${curCard.id.split('-')[0]}">
              <div>
                <div class="fc-meta">
                  <span class="fc-tag">${curCard.id}${curCard.lang ? ` · ${curCard.lang}` : ""}</span>
                  <span>Card ${fcSession.idx + 1} of ${fcSession.queue.length}</span>
                </div>
                <div class="fc-q">${formatInline(curCard.Q, "README.md")}</div>
                ${fcSession.revealed ? `<div class="fc-a" lang="de">${formatInline(curCard.A, "README.md")}</div>` : ""}
              </div>
              <div>
                ${!fcSession.revealed
                  ? `<button class="top-btn primary fc-wide" id="revealBtn" type="button">Show answer <span class="kbd">Space</span></button>`
                  : (fcSession.mode === "due"
                    ? `<p class="grade-q" id="gradeQ">How well did you remember it?</p>
                      <div class="grade-row" role="group" aria-labelledby="gradeQ">
                        <button class="grade-btn g0" data-g="0" type="button"><span>Forgot <span class="kbd">0</span></span><small>see it tomorrow</small></button>
                        <button class="grade-btn g1" data-g="1" type="button"><span>Hard <span class="kbd">1</span></span><small>sooner</small></button>
                        <button class="grade-btn g2" data-g="2" type="button"><span>Good <span class="kbd">2</span></span><small>next step</small></button>
                        <button class="grade-btn g3" data-g="3" type="button"><span>Easy <span class="kbd">3</span></span><small>skip a step</small></button>
                      </div>`
                    : `<button class="top-btn primary fc-wide" id="nextPracticeBtn" type="button">Next card ${ICONS.arrowRight} <span class="kbd">Space</span></button>`
                  )
                }
              </div>
            </div>
          ` : emptyHtml}

          ${fcSession.mode === "due" && totalQueued ? `
          <details class="fc-add">
            <summary>${ICONS.chevRight}<span>Add a topic to your review</span></summary>
            <div class="fc-controls">
              <label class="sr-only" for="topicSelect">Topic</label>
              <select class="select" id="topicSelect">${topicOptions}</select>
              <button class="top-btn" id="addTopicBtn" type="button">Add its cards</button>
              ${doneNotQueued ? `<button class="top-btn ghost" id="addDoneBtn" type="button">Add all finished lessons (${doneNotQueued})</button>` : ""}
            </div>
          </details>` : ""}
        </div>
      `;

      document.getElementById("tabDue").addEventListener("click", () => {
        fcSession.mode = "due";
        fcSession.queue = buildDueQueue();
        fcSession.idx = 0;
        fcSession.revealed = false;
        renderFc();
      });
      document.getElementById("tabPractice").addEventListener("click", () => {
        fcSession.mode = "practice";
        fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
        fcSession.idx = 0;
        fcSession.revealed = false;
        renderFc();
      });
      document.getElementById("topicSelect")?.addEventListener("change", e => {
        fcSession.practiceTopic = e.target.value;
        if (fcSession.mode === "practice") {
          fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        }
      });

      const addTopicBtn = document.getElementById("addTopicBtn");
      if (addTopicBtn) {
        addTopicBtn.addEventListener("click", async () => {
          const tid = document.getElementById("topicSelect").value;
          const n = await queueTopicCards(tid);
          showToast(n ? `Queued ${n} cards for ${tid}` : `${tid} cards already queued`);
          fcSession.queue = buildDueQueue();
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const addNextBtn = document.getElementById("addNextBtn");
      if (addNextBtn) {
        addNextBtn.addEventListener("click", async () => {
          const n = await queueTopicCards(addNextBtn.dataset.topic);
          showToast(n ? `${n} cards from ${addNextBtn.dataset.topic} are ready.` : `${addNextBtn.dataset.topic} cards were already in your review.`);
          fcSession.queue = buildDueQueue();
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const addDoneBtn = document.getElementById("addDoneBtn");
      if (addDoneBtn) {
        addDoneBtn.addEventListener("click", async () => {
          let total = 0;
          for (const l of ALL_LESSONS) {
            if (["●", "✔"].includes(state.progress[l.id])) {
              total += await queueTopicCards(l.id);
            }
          }
          showToast(total ? `Queued ${total} cards from completed lessons` : "No new cards from completed lessons");
          fcSession.queue = buildDueQueue();
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const startPracticeBtn = document.getElementById("startPracticeBtn");
      if (startPracticeBtn) {
        startPracticeBtn.addEventListener("click", () => {
          fcSession.practiceTopic = document.getElementById("topicSelect").value;
          fcSession.queue = buildPracticeQueue(fcSession.practiceTopic);
          fcSession.idx = 0;
          fcSession.revealed = false;
          renderFc();
        });
      }

      const revealBtn = document.getElementById("revealBtn");
      if (revealBtn) {
        revealBtn.addEventListener("click", () => { fcSession.revealed = true; renderFc(); });
      }
      const nextPracticeBtn = document.getElementById("nextPracticeBtn");
      if (nextPracticeBtn) {
        nextPracticeBtn.addEventListener("click", () => {
          fcSession.idx++;
          fcSession.revealed = false;
          fcSession.reviewed++;
          renderFc();
        });
      }
      container.querySelectorAll(".grade-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const g = Number(btn.dataset.g);
          const row = state.schedule[curCard.id];
          if (row) gradeScheduleRow(row, g);
          logActivity("card");
          saveState();
          fcSession.idx++;
          fcSession.revealed = false;
          fcSession.reviewed++;
          renderFc();
        });
      });
    }

    renderFc();
  }

  // Keyboard shortcuts in flashcard mode
  window.addEventListener("keydown", e => {
    if (location.hash !== "#flashcards") return;
    if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    if (e.code === "Space" || e.key === "Enter") {
      const rev = document.getElementById("revealBtn");
      const nxt = document.getElementById("nextPracticeBtn");
      if (rev) { e.preventDefault(); rev.click(); }
      else if (nxt) { e.preventDefault(); nxt.click(); }
    } else if (["0", "1", "2", "3"].includes(e.key)) {
      const btn = document.querySelector(`.grade-btn[data-g="${e.key}"]`);
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });

  // Header controls
  document.getElementById("themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    saveState();
    applyTheme();
  });
  document.getElementById("fcNavBtn").addEventListener("click", () => {
    location.hash = "#flashcards";
  });
  document.querySelectorAll(".lang-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.dataset.lang;
      if (state.langs.includes(code)) {
        if (state.langs.length === 1) {
          showToast("Keep at least one contrast language enabled.");
          return;
        }
        state.langs = state.langs.filter(l => l !== code);
      } else {
        state.langs.push(code);
      }
      state.langsChosen = true;
      saveState();
      renderLangPills();
      if (currentPath === "README.md" && (!location.hash || location.hash === "#doc=README.md")) {
        renderHome();
      }
      showToast(`Contrast notes: ${state.langs.map(l => LANG_META[l].name).join(", ")}`);
    });
  });

  // Search
  document.getElementById("searchInput").addEventListener("input", e => {
    renderSidebar(e.target.value);
  });

  // Export / Import JSON backup
  document.getElementById("exportProgressBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `genau-progress-${todayISO()}.json`;
    a.click();
    showToast("Backup downloaded.");
  });
  document.getElementById("importProgressBtn").addEventListener("click", () => {
    document.getElementById("importFileInput").click();
  });
  document.getElementById("importFileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    const reader = new FileReader();
    reader.onload = () => {
      let restored;
      try {
        restored = normalizeState(JSON.parse(reader.result), state, true);
      } catch {
        showToast("Invalid backup file.");
        return;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));
      } catch {
        showToast("Could not save this backup in your browser.");
        return;
      }
      state = restored;
      updateBadges();
      applyTheme();
      syncSidebarState();
      renderLangPills();
      route();
      showToast("Progress restored.");
    };
    reader.onerror = () => showToast("Could not read the backup file.");
    reader.readAsText(file);
  });

  // Reading scroll progress bar
  function updateReadProgress() {
    const bar = document.getElementById("readProgress");
    if (!bar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const pct = h > 40 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0;
    bar.style.transform = `scaleX(${pct / 100})`;
  }
  window.addEventListener("scroll", updateReadProgress, { passive: true });

  // Router
  async function openPractice(page, requestId) {
    updatePrimaryNavActive();
    closeDrawerSidebar();
    renderSidebar(document.getElementById("searchInput").value);
    const container = document.getElementById("mainContainer");
    container.textContent = "Loading practice…";
    try {
      const bank = GenauPracticeModel.validateCatalogue(JSON.parse(await fetchDoc("practice/content.json")));
      if (requestId !== navigationId) return;
      closePractice = GenauPracticeView.mount({
        container, page, bank,
        getPractice: () => state.practice,
        savePractice(practice) {
          const next = { ...state, practice };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); }
          catch { return false; }
          state = next;
          return true;
        }
      });
      window.scrollTo({ top: 0, behavior: "instant" });
    } catch {
      if (requestId !== navigationId) return;
      const notice = document.createElement("div");
      notice.className = "notice";
      notice.textContent = "Could not load practice. Use the hosted app or reload this page.";
      container.replaceChildren(notice);
    }
  }

  function route() {
    closePractice();
    closePractice = () => {};
    const requestId = ++navigationId;
    const h = location.hash || "#doc=README.md";
    updatePrimaryNavActive();
    if (h === "#flashcards") {
      openFlashcards(requestId);
    } else if (h.startsWith("#practice=")) {
      openPractice(h.slice("#practice=".length), requestId);
    } else if (h.startsWith("#doc=")) {
      const path = decodeURIComponent(h.slice(5));
      openDoc(path, requestId);
    } else {
      openDoc("README.md", requestId);
    }
    setTimeout(updateReadProgress, 60);
  }
  window.addEventListener("hashchange", route);

  // Boot
  applyTheme();
  syncSidebarState();
  renderLangPills();
  updateBadges();
  renderSidebar();
  route();
})();
</script>
</body>
</html>
