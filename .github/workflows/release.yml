name: Create Course Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto-increments from latest tag; first release is v1.0.0)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: "Optional custom version tag (leave blank to auto-bump, e.g. v2.0.0)"
        required: false
        default: ""
        type: string
      notes:
        description: "Optional release notes (leave blank to auto-generate from commits)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: course-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
        run: |
          STABLE_VERSION='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ -n "$CUSTOM" ]; then
            if [[ "$CUSTOM" == -* ]] || ! git check-ref-format "refs/tags/$CUSTOM"; then
              echo "Invalid Git tag: $CUSTOM" >&2
              exit 1
            fi
            NEXT="$CUSTOM"
          else
            LATEST=$(git tag --sort=-v:refname | grep -m1 -E "$STABLE_VERSION" || true)
            if [ -z "$LATEST" ]; then
              NEXT="v1.0.0"
            else
              VER="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
              case "$BUMP" in
                major) NEXT="v$((MAJOR + 1)).0.0" ;;
                minor) NEXT="v${MAJOR}.$((MINOR + 1)).0" ;;
                patch) NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                *) echo "Unknown bump type: $BUMP" >&2; exit 1 ;;
              esac
            fi
          fi
          if TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/$NEXT^{commit}"); then
            if [ "$TAG_SHA" != "$(git rev-parse HEAD)" ]; then
              echo "$NEXT already points to a different commit." >&2
              exit 1
            fi
          fi
          echo "Next release version: $NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Package clean course ZIP
        run: |
          mkdir -p dist/genau
          git archive HEAD -- README.md METHOD.md PLAN.md PROGRESS.md PROMPT.md AGENTS.md LICENSE \
            A1 A2 B1 shared review/review.py review/README.md review/schedule.md review/error-log.md \
            review/adaptations.md review/cards review/anki practice/README.md practice/content.json practice/audio \
            writing/README.md writing/corrections/.gitkeep writing/submissions/.gitkeep |
            tar -x -C dist/genau
          python3 dist/genau/review/review.py reset --yes --clean-profile
          (cd dist && zip -r -q genau.zip genau)
          ls -lh dist/genau.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          args=(
            --target "$(git rev-parse HEAD)"
            --title "Genau $VERSION"
            --latest
          )
          if [ -n "$NOTES" ]; then
            args+=(--notes "$NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "$VERSION" \
            dist/genau.zip \
            dist/genau/review/anki/genau-all-core.tsv \
            dist/genau/review/anki/genau-complete-all-languages.tsv \
            "${args[@]}"
