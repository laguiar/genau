name: Create Course Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto-increments from latest tag; first release is v1.0.0)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: "Optional custom version tag (leave blank to auto-bump, e.g. v2.0.0)"
        required: false
        default: ""
        type: string
      notes:
        description: "Optional release notes (leave blank to auto-generate from commits)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
        run: |
          if [ -n "$CUSTOM" ]; then
            NEXT="$CUSTOM"
          else
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "$LATEST" ]; then
              NEXT="v1.0.0"
            else
              VER="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
              case "$BUMP" in
                major) NEXT="v$((MAJOR + 1)).0.0" ;;
                minor) NEXT="v${MAJOR}.$((MINOR + 1)).0" ;;
                patch) NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                *) echo "Unknown bump type: $BUMP" >&2; exit 1 ;;
              esac
            fi
          fi
          echo "Next release version: $NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Package clean course ZIP
        run: |
          mkdir -p dist/genau
          for item in README.md METHOD.md PLAN.md PROGRESS.md PROMPT.md AGENTS.md A1 A2 B1 shared review writing; do
            if [ -e "$item" ]; then
              cp -R "$item" dist/genau/
            fi
          done
          if [ -f LICENSE ]; then
            cp LICENSE dist/genau/
          fi
          find dist/genau -name ".DS_Store" -delete
          find dist/genau -name "__pycache__" -type d -exec rm -rf {} +
          rm -f dist/genau/review/anki-export.tsv
          (cd dist && zip -r -q genau.zip genau)
          ls -lh dist/genau.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            gh release create "$VERSION" \
              dist/genau.zip \
              review/anki/genau-all-core.tsv \
              review/anki/genau-complete-all-languages.tsv \
              --title "Genau $VERSION" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$VERSION" \
              dist/genau.zip \
              review/anki/genau-all-core.tsv \
              review/anki/genau-complete-all-languages.tsv \
              --title "Genau $VERSION" \
              --generate-notes \
              --latest
          fi
